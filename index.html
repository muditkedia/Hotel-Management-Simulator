<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Stay — Hotel Management Simulator</title>
<style>
:root{
  --bg:#0c111b; --bg2:#0f1623; --panel:#141c2b; --panel2:#1a2435; --line:#243047;
  --line2:#2e3c57; --ink:#e8eef7; --mut:#8a98b2; --mut2:#5e6c86;
  --gold:#d8a24a; --gold2:#eebd6a; --pos:#46c06a; --neg:#ef6a6a; --warn:#e6b450;
  --info:#4fa9c9; --vip:#b27ad6;
  --r:8px; --sh:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 80% -10%,#15203200,#0c111b),var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; overflow:hidden;
}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#26324a;border-radius:6px;border:2px solid var(--bg2)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- SETUP WIZARD ---------- */
#setup{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#0a0f18,#10182a);overflow:auto;display:flex;align-items:center;justify-content:center;padding:32px}
.wiz{width:min(1080px,100%)}
.brandmark{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.logo{width:46px;height:46px;border-radius:11px;background:linear-gradient(145deg,var(--gold2),#9c6f24);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#1a1206;box-shadow:0 6px 18px rgba(216,162,74,.35)}
.brandmark h1{font-size:26px;letter-spacing:.3px;font-weight:700}
.brandmark .tag{color:var(--mut);font-size:12.5px;margin-top:2px;letter-spacing:.3px}
.wizstep{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--sh)}
.wizhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.wizhead h2{font-size:16px;font-weight:650}
.steps{display:flex;gap:8px;margin:18px 0 6px}
.stepdot{flex:1;height:3px;border-radius:3px;background:var(--line2)}
.stepdot.on{background:var(--gold)}
.grid-cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
.pick{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:.13s;position:relative}
.pick:hover{border-color:var(--line2);transform:translateY(-1px)}
.pick.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 8px 22px rgba(216,162,74,.12)}
.pick .ttl{font-weight:650;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.tier{font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:20px;text-transform:uppercase}
.t1{background:#3a2a12;color:var(--gold2)} .t2{background:#15303a;color:#6fc6df} .t3{background:#1d2b1c;color:#88cf86}
.pick .sub{color:var(--mut);font-size:11.5px;margin-top:5px;min-height:30px}
.barrow{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11px;color:var(--mut)}
.barrow .lbl{width:78px;flex:none}
.mtr{flex:1;height:5px;background:#0e1626;border-radius:4px;overflow:hidden}
.mtr i{display:block;height:100%;background:linear-gradient(90deg,#5a7,#7c9);border-radius:4px}
.wizbtns{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;transition:.12s}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(145deg,var(--gold2),#b27e2c);border:none;color:#1a1206}
.btn.primary:hover{filter:brightness(1.07);color:#1a1206}
.diff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.diff-grid .pick .sub{min-height:64px}

/* ---------- APP SHELL ---------- */
#app{display:none;height:100vh;grid-template-rows:auto 1fr;grid-template-columns:212px 1fr}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:0;background:linear-gradient(180deg,#121a29,#0e1521);border-bottom:1px solid var(--line);height:54px;padding:0 14px}
.tb-logo{display:flex;align-items:center;gap:10px;width:198px;flex:none}
.tb-logo .logo{width:32px;height:32px;border-radius:8px;font-size:16px}
.tb-logo b{font-size:14px;letter-spacing:.3px}
.tb-prop{font-size:11px;color:var(--mut);margin-top:1px}
.kpis{display:flex;gap:2px;flex:1;overflow:hidden}
.kpi{padding:5px 14px;border-left:1px solid var(--line);min-width:96px}
.kpi .k{font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:15px;font-weight:700;margin-top:1px}
.kpi .v small{font-size:10px;font-weight:500;color:var(--mut)}
.clockbox{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--line)}
.clock{text-align:right}
.clock .t{font-size:15px;font-weight:700}
.clock .d{font-size:10.5px;color:var(--mut)}
.speeds{display:flex;gap:3px}
.sp{width:30px;height:30px;border-radius:7px;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.sp.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.sp:hover{border-color:var(--gold)}

#side{background:var(--bg2);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;color:var(--mut);font-weight:550;font-size:13px;border:1px solid transparent}
.nav:hover{background:var(--panel);color:var(--ink)}
.nav.on{background:linear-gradient(90deg,#1b2740,#16203200);color:var(--ink);border-color:var(--line2)}
.nav .ic{width:18px;text-align:center;font-size:14px;opacity:.9}
.nav .badge{margin-left:auto;background:var(--neg);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;min-width:18px;text-align:center}
.nav .badge.g{background:var(--gold);color:#1a1206}
.side-sep{height:1px;background:var(--line);margin:8px 4px}
.side-foot{margin-top:auto;display:flex;gap:6px;padding:6px 4px}
.side-foot .btn{flex:1;padding:7px;font-size:11px;text-align:center}

#main{overflow:auto;padding:16px 18px 40px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.page-head h2{font-size:18px;font-weight:680;letter-spacing:.2px}
.page-head .desc{color:var(--mut);font-size:12px;margin-top:2px}

/* cards */
.cards{display:grid;gap:12px}
.cols-4{grid-template-columns:repeat(4,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:650;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.stat{font-size:26px;font-weight:740;letter-spacing:-.5px}
.stat small{font-size:12px;color:var(--mut);font-weight:500;margin-left:4px}
.delta{font-size:11.5px;font-weight:600;margin-top:4px}
.up{color:var(--pos)} .down{color:var(--neg)} .flat{color:var(--mut)}

.row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.row:last-child{border-bottom:none}
.row .lab{color:var(--mut)}
.row .val{font-weight:600}
.pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.3px}
.pill.green{background:#15301f;color:var(--pos)} .pill.red{background:#321618;color:var(--neg)}
.pill.gold{background:#332512;color:var(--gold2)} .pill.blue{background:#142b35;color:#6fc6df}
.pill.gray{background:#1d2536;color:var(--mut)} .pill.vip{background:#26173a;color:var(--vip)}

.bar{height:8px;background:#0e1626;border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--mut2);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:7px 9px;border-bottom:1px solid var(--line2)}
td{padding:8px 9px;border-bottom:1px solid var(--line)}
tr:hover td{background:#161f30}
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

.roomgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.roomcell{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px;cursor:pointer;transition:.12s;position:relative;overflow:hidden}
.roomcell:hover{border-color:var(--line2);transform:translateY(-1px)}
.roomcell .rt{font-weight:680;font-size:13px}
.roomcell .rn{font-size:10.5px;color:var(--mut)}
.roomcell .rstat{font-size:10px;font-weight:700;letter-spacing:.4px;margin-top:8px;text-transform:uppercase}
.roomcell .rprice{position:absolute;top:10px;right:10px;font-size:11px;color:var(--gold2);font-weight:650}
.statline{position:absolute;left:0;top:0;bottom:0;width:3px}
.occ{color:#6fc6df} .clean-ok{color:var(--pos)} .dirty{color:var(--warn)} .maint{color:var(--neg)}
.bg-occ{background:#6fc6df}.bg-clean{background:var(--pos)}.bg-dirty{background:var(--warn)}.bg-maint{background:var(--neg)}

.feed{display:flex;flex-direction:column;gap:0;max-height:340px;overflow:auto}
.fitem{display:flex;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12px}
.fitem .dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none}
.fitem .ft{color:var(--mut2);font-size:10.5px;margin-left:auto;flex:none}
.fitem .txt{color:var(--ink)}

input[type=range]{width:100%;accent-color:var(--gold)}
input[type=number],input[type=text],select{background:#0e1626;border:1px solid var(--line2);color:var(--ink);border-radius:6px;padding:7px 9px;font-family:inherit;font-size:12.5px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--gold)}
label.fl{display:block;font-size:11px;color:var(--mut);margin:10px 0 4px;font-weight:550}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.sw{width:40px;height:22px;border-radius:14px;background:#26324a;position:relative;cursor:pointer;transition:.15s;flex:none}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#cbd5e6;transition:.15s}
.sw.on{background:var(--gold)} .sw.on i{left:20px;background:#1a1206}

.stars{color:var(--gold2);letter-spacing:1px}
.star-dim{color:#3a4051}
.review{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:9px}
.review .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.review .who{font-weight:650;font-size:12.5px}
.review .txt{color:#c8d2e2;font-size:12.5px}
.review .meta{font-size:10.5px;color:var(--mut2);margin-top:5px}

/* MODAL / EVENTS */
#modal{position:fixed;inset:0;z-index:60;background:rgba(6,9,15,.72);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.mbox{width:min(540px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.mhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.mhead .mic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.mhead h3{font-size:16px;font-weight:680}
.mhead .ms{color:var(--mut);font-size:11.5px;margin-top:1px}
.mbody{padding:16px 18px}
.mbody .desc{color:#c8d2e2;font-size:13px;margin-bottom:14px}
.choice{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:11px 13px;margin-bottom:8px;transition:.12s}
.choice:hover{border-color:var(--gold);background:#1d2738}
.choice .ct{font-weight:640;font-size:13px}
.choice .cc{font-size:11px;color:var(--mut);margin-top:3px}
.toast-wrap{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;flex-direction:column;gap:8px;max-width:330px}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--gold);border-radius:8px;padding:10px 13px;font-size:12.5px;box-shadow:var(--sh);animation:sl .25s ease}
@keyframes sl{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.muted{color:var(--mut)} .sm{font-size:11px} .b{font-weight:650} .gold{color:var(--gold2)} .right{text-align:right}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.flex{display:flex;gap:8px;align-items:center}
.wrapf{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:11px;padding:4px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.tag.on{border-color:var(--gold);color:var(--gold2)}
.notice{background:#1a2435;border:1px solid var(--line2);border-radius:8px;padding:11px 13px;font-size:12px;color:var(--mut);margin-bottom:12px}
.kbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 11px;font-size:11.5px}
.mini b{font-size:14px;display:block;margin-top:1px}
.shopitem{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);margin-bottom:8px}
.shopitem .si-ic{width:38px;height:38px;border-radius:9px;background:#1c2740;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.shopitem .si-b{flex:1}
.shopitem .si-t{font-weight:640;font-size:13px}
.shopitem .si-d{font-size:11px;color:var(--mut);margin-top:2px}
</style>
<style id="resp">
@media(max-width:980px){
  #app{grid-template-columns:1fr!important}
  #side{position:fixed;left:0;top:54px;bottom:0;width:230px;z-index:40;transform:translateX(-100%);transition:transform .22s;box-shadow:0 16px 40px rgba(0,0,0,.5);overflow:auto}
  #app.navopen #side{transform:none}
  #navscrim{position:fixed;inset:54px 0 0 0;background:rgba(0,0,0,.5);z-index:35;display:none}
  #app.navopen #navscrim{display:block}
  .cols-4{grid-template-columns:repeat(2,1fr)!important}
  .cols-3{grid-template-columns:repeat(2,1fr)!important}
  .split{grid-template-columns:1fr!important}
  #kpis,.kpis{overflow-x:auto;overflow-y:hidden}
  #hamb{display:flex!important}
}
@media(max-width:620px){
  .cols-4,.cols-3,.cols-2{grid-template-columns:1fr!important}
  .tbl-wrap{overflow-x:auto}
  table{min-width:520px}
  .kpi{min-width:90px}
  .page-head{flex-wrap:wrap;gap:8px}
  #main{padding:12px 12px 48px}
}
#hamb{display:none;width:34px;height:34px;border-radius:8px;background:var(--panel2,#161d2e);border:1px solid var(--line2,#26304a);color:inherit;align-items:center;justify-content:center;font-size:16px;margin-right:8px;flex:none;cursor:pointer}
</style>
</head>
<body>

<!-- ================= SETUP WIZARD ================= -->
<div id="setup">
  <div class="wiz">
    <div class="brandmark">
      <div class="logo">GS</div>
      <div><h1>Grand Stay</h1><div class="tag">An international hotel management simulation</div></div>
    </div>
    <div class="wizstep">
      <div class="steps">
        <div class="stepdot on" data-s="0"></div><div class="stepdot" data-s="1"></div>
        <div class="stepdot" data-s="2"></div><div class="stepdot" data-s="3"></div>
      </div>
      <div id="wizbody"></div>
      <div class="wizbtns">
        <button class="btn" id="wizBack">Back</button>
        <button class="btn primary" id="wizNext">Continue</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div id="topbar">
    <div class="tb-logo">
      <div class="logo" style="width:32px;height:32px;font-size:15px;border-radius:8px">GS</div>
      <div><b>Grand Stay</b><div class="tb-prop" id="tbProp">—</div></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="clockbox">
      <div class="clock"><div class="t" id="clkTime">06:00</div><div class="d" id="clkDate">Day 1</div></div>
      <div class="speeds">
        <button class="sp" id="spPause" title="Pause">❚❚</button>
        <button class="sp on" data-sp="1" title="1×">1×</button>
        <button class="sp" data-sp="2" title="2×">2×</button>
        <button class="sp" data-sp="4" title="4×">4×</button>
        <button class="sp" data-sp="8" title="8×">8×</button>
      </div>
    </div>
  </div>

  <div id="side">
    <div class="nav on" data-tab="overview"><span class="ic">▣</span>Overview</div>
    <div class="nav" data-tab="rooms"><span class="ic">▦</span>Rooms</div>
    <div class="nav" data-tab="guests"><span class="ic">☺</span>Front Desk<span class="badge" id="bgGuests" style="display:none"></span></div>
    <div class="nav" data-tab="pricing"><span class="ic">💰</span>Pricing</div>
    <div class="nav" data-tab="policies"><span class="ic">⚙</span>Policies</div>
    <div class="nav" data-tab="staff"><span class="ic">⚇</span>Staff</div>
    <div class="nav" data-tab="facilities"><span class="ic">◈</span>Facilities</div>
    <div class="nav" data-tab="operations"><span class="ic">⚙</span>Operations</div>
    <div class="nav" data-tab="reviews"><span class="ic">★</span>Reviews</div>
    <div class="side-sep"></div>
    <div class="nav" data-tab="market"><span class="ic">◴</span>Market</div>
    <div class="nav" data-tab="finance"><span class="ic">▤</span>Finance</div>
    <div class="nav" data-tab="analytics"><span class="ic">▥</span>Analytics</div>
    <div class="nav" data-tab="reports"><span class="ic">☰</span>Reports</div>
    <div class="nav" data-tab="log"><span class="ic">≣</span>Log</div>
    <div class="side-sep"></div>
    <div class="nav" data-tab="expand"><span class="ic">⬈</span>Expansion</div>
    <div class="nav" data-tab="hq"><span class="ic">⌂</span>Headquarters</div>
    <div class="side-foot">
      <button class="btn primary" id="btnSave">💾 Save Game</button>
      <button class="btn" id="btnLoad">📂 Load Game</button>
    </div>
  </div>

  <div id="main"></div>
</div>

<div id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast-wrap" id="toasts"></div>

<script>
/* =========================================================================
   AATITHYA — Indian Hotel Management Simulation (offline, single file)
   ========================================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* Currency is localized at the display layer (v22). All internal money stays in
   one base unit; LOC carries the active currency symbol, display divisor k and
   number style. India: sym '₹', k 1, style 'in' — identical to the original. */
let LOC={sym:'₹',k:1,style:'in'};
const cr=n=>{
  n=Math.round(n)/(LOC.k||1); const s=LOC.sym,a=Math.abs(n);
  if(LOC.style==='in'){
    if(a>=1e7) return s+(n/1e7).toFixed(2)+' Cr';
    if(a>=1e5) return s+(n/1e5).toFixed(2)+' L';
    return s+Math.round(n).toLocaleString('en-IN');
  }
  if(a>=1e9) return s+(n/1e9).toFixed(2)+'B';
  if(a>=1e6) return s+(n/1e6).toFixed(2)+'M';
  if(a>=1e4) return s+Math.round(n/1e3)+'K';
  return s+Math.round(n).toLocaleString('en-US');
};
const cr0=n=>LOC.sym+Math.round(n/(LOC.k||1)).toLocaleString(LOC.style==='in'?'en-IN':'en-US');
const pct=n=>Math.round(n)+'%';

function seasonFactor(day,city,loc){
  const doy=day%360;
  let s=1+Math.sin((doy/360)*Math.PI*2 - 1)*(city.seas+loc.seas);
  // festival/peak windows
  const peaks=[ [300,340,.35],[80,110,.2],[170,200,-.18] ]; // wedding/winter peak, spring, monsoon trough
  peaks.forEach(([a,b,m])=>{ if(doy>=a&&doy<=b) s+= m*(city.seas+ .25); });
  return clamp(s,.45,1.7);
}
function marketRate(prop,rt){
  return prop.city.baseRate*prop.city.spend*prop.loc.rate*ROOMTYPES[rt].rateF*G.seasonNow;
}
function priceComp(prop,rt){ // demand multiplier from your price vs market
  const mkt=marketRate(prop,rt);
  const r=prop.prices[rt]/mkt;
  const sens=prop.city.sens*G.D.sensM;
  return clamp(1.35 - (r-1)*1.1*sens, .12, 1.5);
}
function repFactor(prop){ return .45+prop.reputation/100*.95; } // wider spread: weak reputation genuinely hurts, strong genuinely pays
function compFactor(prop){

  return clamp(quality/intensity,.4,1.4);

  const air=prop.loc.name==='Airport Zone',biz=(prop.city.biz>.45||prop.loc.name==='Business District');

function maturity(prop){
  const reviews=prop.reviews.length,age=G.day-(prop.bornDay||1);

  m+=clamp(prop.reputation/100,0,1)*.20;
  m+=clamp(age/240,0,1)*.10;
  m+=clamp((G.chain?G.chain.loyaltyMembers:0)/200,0,1)*.10;
  m+=clamp((prop.awareness||0)/100,0,1)*.05;
  return clamp(m,0,1);
}

  const adrV=sold.length?sold.reduce((s,r)=>s+r.guest.price,0)/sold.length:avgPrice(prop);
  const sat=prop._satN?prop._satSum/prop._satN:(prop.analytics.length?prop.analytics[prop.analytics.length-1].sat:70);
  const staffN=Object.values(prop.staff).reduce((s,a)=>s+a.length,0)||1;
  const chTot=Object.values(prop.channelRev).reduce((s,v)=>s+v,0)||1;
  const cm=prop.chCountToday||{},cmTot=Object.values(cm).reduce((s,v)=>s+v,0)||1;
  prop.analytics.push({day:G.day-1,occ:occR,adr:adrV,revpar:adrV*occR/100,rev:prop.revYest,exp:prop.expYest,
    profit:prop.revYest-prop.expYest,cashflow:prop.revYest-prop.expYest,sat,rep:prop.reputation,rating:prop.rating||0,

    directMix:(cm.direct||0)/cmTot*100,otaMix:(cm.ota||0)/cmTot*100,facUtil:Math.min(100,prop.facilities.length*7)});
  if(prop.analytics.length>500)prop.analytics.shift();
}

/* ---------------- COMPETITOR AI (override: open/close hotels) ---------------- */
function competitorAI(prop){
  ensureIntel(prop);
  prop.comps.forEach(co=>{
    co.cash+=rnd(-.04,.05);
    const gap=(prop.rating||3)-co.rating;let act=null;
    // (Wave 5) daily brain handles tactical price drift only — strategic plays
    // (renovations, campaigns, facilities, acquisitions) belong to the weekly
    // compBrain strategist, which used to double up with this loop.
    if(Math.random()<.12){const roll=Math.random();
      if(roll<.6){co.priceIdx=clamp(co.priceIdx+(gap>0?-.05:.04),.55,2);act=gap>0?'cut prices':'raised rates';}
      else if(co.cash<.35){co.rating=clamp(co.rating-rnd(.04,.1),2.2,4.9);act='cut back amid losses';}
    }
    if(co.promo){co.promo--;if(co.promo<=0)co.priceIdx=clamp(co.priceIdx+.08,.55,2);}
    co.occ=clamp(co.occ+rnd(-.06,.06),.2,.98);
    if(act){co.lastAct=act;co.lastActDay=G.day;if(knows(co,'rating')||knows(co,'price'))feed('🏨 '+co.name+' '+act+'.','warn');}
  });
  // market entry / exit (rare)
  if(Math.random()<.02&&prop.comps.length<10){const nm=pick(['Skyline','Greenview','Citygate','Pinnacle','Crestwood','Parkside'])+' '+pick(['Hotel','Suites','Residency']);prop.comps.push({name:nm,seg:pick(['Budget','Midscale','Upscale']),rating:rnd(3.4,4.2),priceIdx:rnd(.8,1.2),occ:rnd(.4,.7),facN:ri(2,4),cash:rnd(.8,1.2),strength:1,viz:{}});ensureIntel(prop);logEvent(prop,'competition','New competitor entered the market: '+nm+'.');feed('🏨 New rival opened nearby: '+nm+'.','warn');}
  else if(Math.random()<.012&&prop.comps.length>2){const weak=prop.comps.slice().sort((a,b)=>(a.rating+a.cash)-(b.rating+b.cash))[0];if(weak&&weak.cash<.4){prop.comps=prop.comps.filter(c=>c!==weak);logEvent(prop,'competition',weak.name+' shut down after sustained losses.');feed('🏨 Rival '+weak.name+' closed down.','pos');}}
}

/* ---------------- HELPERS: CLASS, GST, FESTIVAL, DEMAND ---------------- */
function hotelClass(prop){
  const adr=avgPrice(prop)||0;
  const facN=prop.facilities.length;
  const fq=prop.rooms.length?prop.rooms.reduce((s,r)=>s+(r.q&&r.q.q||0),0)/prop.rooms.length:0;
  let s=clamp(adr/12000,0,1)*40 + clamp(facN/10,0,1)*30 + clamp(fq/18,0,1)*30;
  if(s<25)return {k:'budget',name:'Budget',exp:0.90,elast:1.40,foodCost:.30,staffPerRoom:.5,w:{clean:.28,service:.16,value:.24,location:.10,comfort:.10,fnb:.06,tech:.06}};
  if(s<50)return {k:'midscale',name:'Midscale',exp:1.00,elast:1.10,foodCost:.32,staffPerRoom:1.0,w:{clean:.25,service:.20,value:.20,location:.11,comfort:.10,fnb:.08,tech:.06}};
  if(s<75)return {k:'upscale',name:'Upscale',exp:1.12,elast:.85,foodCost:.33,staffPerRoom:1.6,w:{clean:.24,service:.23,value:.16,location:.12,comfort:.11,fnb:.09,tech:.05}};
  return {k:'luxury',name:'Luxury',exp:1.25,elast:.70,foodCost:.34,staffPerRoom:2.5,w:{clean:.23,service:.25,value:.14,location:.12,comfort:.12,fnb:.09,tech:.05}};
}
function gstRate(rate){const m=G.macro||{};return rate>(m.gstFence||7500)?(m.gstStd||.18):(m.gstLow||.05);}
function festivalMultiplier(){
  const doy=((G.day-1)%360), month=Math.floor(doy/30)+1;
  let m=1;
  if([10,11,12,1,2].includes(month))m*=1.15;                 // winter leisure + wedding season
  [315,300,250,75].forEach(fd=>{const dist=Math.min(Math.abs(doy-fd),360-Math.abs(doy-fd));if(dist<4)m*=1.5-dist*0.1;}); // Diwali/Dussehra/Eid/Holi spikes
  return m;
}
function computeDemand(prop){
  const seas=seasonFactor(G.day,prop.city,prop.loc), fest=festivalMultiplier(), wthr=weatherDemand();
  const rep=repFactor(prop), comp=compFactor(prop), weekend=(G.dow>=5);
  const m=G.macro||{airTraffic:1,supply:1};
  const macro=(m.airTraffic||1)/(m.supply||1);
  const base=prop.city.dem*prop.loc.dem;
  let d=base*seas*fest*wthr*rep*comp;
  d*=(1+facBoost(prop,'dem'));
  d*=(1+(G.chain?G.chain.brand:0)/100*.5);
  d*=(1+(prop.awareness||0)/100*.3);
  d*=macro;
  d*=weekend?(1+prop.city.tour*.25):(1+prop.city.biz*.12);
  d*=G.D.demM;
  prop._demandBreak={base,season:seas,festival:fest,weather:wthr,reputation:rep,competition:comp,macro,total:clamp(d,.15,2.6)};
  return clamp(d,.15,2.6);
}

/* ---------------- HOUSEKEEPING CAPACITY (credit-based, override) ---------------- */
function cleanCapacity(prop){
  const hk=(prop.staff.housekeeping||[]);if(!hk.length)return 0;
  let perHour=0;
  hk.forEach(a=>{const rooms8=12+(a.skill/100)*6;perHour+=rooms8/8*(a.morale/100)*(1-(a.fatigue||0)/200);});
  if(prop.invShort&&(prop.invShort.linen||prop.invShort.cleaning||prop.invShort.amenities))perHour*=.6;
  return perHour;
}

/* ---------------- OPERATING COSTS (energy + macro, override) ---------------- */
function accrueHourlyCost(prop){
  let payroll=0;for(const role in prop.staff)prop.staff[role].forEach(s=>payroll+=s.sal);
  const m=G.macro||{}, sIdx=m.salary||1, inf=1+(m.inflation||0);
  const util=prop.rooms.length*250*inf;
  const energy=occupied(prop)*70*inf;                    // energy per occupied room/day (research: ~25kWh/room)
  const maint=prop.rooms.reduce((s,r)=>s+ROOMTYPES[r.type].dmaint,0)*inf;
  const fac=prop.facilities.reduce((s,f)=>s+FACILITIES[f].daily,0)*inf;
  const hourly=(payroll*sIdx/30 + util + energy + maint + fac)/24;
  G.cash-=hourly; prop.expToday+=hourly; prop._opExToday=(prop._opExToday||0)+hourly;
}

/* ---------------- DAY SCHEDULING (demand engine + GST + class elasticity, override) ---------------- */
function scheduleDay(){
  const prop=P();
  buildReturnPool();
  G.seasonNow=seasonFactor(G.day,prop.city,prop.loc);
  prop.channelStats=prop.channelStats||{};
  const total=prop.rooms.length||1;
  const demandIdx=computeDemand(prop);
  let attempts=Math.round(total*1.6*demandIdx*rnd(.8,1.2));
  attempts=clamp(attempts,prop.rooms.length?1:0,total*3);
  const cls=hotelClass(prop);
  const arrivals=[],chCount={};const overbook=prop.policies.overbook||0;let booked=0;
  for(let i=0;i<attempts;i++){
    const g=genGuest(prop);
    g.nights=clamp(ri(GUEST_TYPES[g.type].nights[0],GUEST_TYPES[g.type].nights[1]),prop.policies.minStay||1,prop.policies.maxStay||30);
    let cand=prop.rooms.filter(r=>r.status==='clean'&&priceOK(prop,r,g)&&!arrivals.find(a=>a.roomId===r.id));
    if(!cand.length){if(overbook>0&&booked<total+overbook){cand=prop.rooms.filter(r=>!arrivals.find(a=>a.roomId===r.id)&&priceOK(prop,r,g));}if(!cand.length)continue;}
    if(g.returning&&g.favRT){const same=cand.filter(r=>r.type===g.favRT);if(same.length)cand=same;}
    cand.sort((a,b)=>scoreFor(g,b)-scoreFor(g,a));
    const room=cand[0];
    const rate=prop.prices[room.type];
    let willing=bookWillingness(prop,room,g);
    // GST fence + class price-elasticity (guests feel the tax-inclusive total)
    const gst=gstRate(rate), tot=rate*(1+gst);
    willing*=clamp(Math.pow((g.budget*1.15)/tot,cls.elast),0.35,1.35);
    if(prop.policies.cancelType==='nonref')willing*=.9;
    if(prop.policies.payment==='full')willing*=.92;
    if(prop.policies.cancelType==='flexible')willing*=1.04;
    if(g.loyalty)willing*=1.08;
    const st=prop.channelStats[g.channel]=prop.channelStats[g.channel]||{bookings:0,cancels:0,satSum:0,satN:0,revenue:0,repeat:0};
    if(Math.random()<willing){
      g.roomId=room.id;g.arrHour=sampleHour(prop);
      g.depDay=G.day+g.nights;g.depHour=clamp((prop.policies.checkoutTime||11)+ri(-1,1),6,14);
      g.price=rate;
      if(g.loyalty){const L=LOYALTY.find(x=>x.name===g.loyalty);if(L)g.price=Math.round(g.price*(1-L.disc));}
      const depFrac=prop.policies.payment==='full'?1:prop.policies.payment==='partial'?.3:0;
      g.deposit=Math.round(g.price*g.nights*depFrac);g.bookingAmt=g.price*g.nights;
      const cancelP=CHANNELS[g.channel].cancel*(prop.policies.cancelType==='nonref'?.5:prop.policies.cancelType==='flexible'?1.15:1);
      if(Math.random()<cancelP){
        prop.cancellations=(prop.cancellations||0)+1;st.cancels++;
        const keepFr=prop.policies.cancelType==='flexible'?0:prop.policies.cancelType==='partial'?.5:1;
        if(keepFr>0&&g.deposit>0){const keep=Math.round(g.deposit*keepFr);G.cash+=keep;prop.revToday+=keep;logEvent(prop,'finance',g.name+' cancelled — deposit '+cr0(keep)+' retained.');}
        else logEvent(prop,'booking',g.name+' cancelled (refundable).');
        continue;
      }
      st.bookings++;if(g.returning)st.repeat++;
      (prop.marketing.campaigns||[]).forEach(cm=>{const M=MKT[cm.type];if(M&&((M.ch&&M.ch===g.channel)||(M.seg&&M.seg===g.type)))cm.bookings=(cm.bookings||0)+1;});
      g._propIdx=G.active;
      if(g.deposit>0){G.cash+=g.deposit;g.depositPaid=true;prop.depositsHeld=(prop.depositsHeld||0)+g.deposit;} // deposit collected at booking, held as a liability (audit B7)
      g.checkedIn=false;arrivals.push(g);booked++;chCount[g.channel]=(chCount[g.channel]||0)+1;
    }
  }
  G.pendingArrivals=arrivals;prop.expectedToday=arrivals.length;prop.chCountToday=chCount;
  ensureIntel(prop);
}

/* ---------------- SATISFACTION INTEGRATOR (weighted touchpoints, override) ---------------- */
function finalizeStay(prop,room,g){
  const gt=GUEST_TYPES[g.type],cls=hotelClass(prop);
  const q=roomQ(room);
  const rate=g.price,ref=marketRate(prop,room.type)||rate,gst=gstRate(rate),tot=rate*(1+gst),refTot=ref*(1+gst);
  const hkStrain=prop.hkStrain||0;
  // --- component scores (0-100) ---
  let cleanScore=clamp(88 - hkStrain*45 + (avgSkill(prop,'housekeeping')-65)*.25 + ((prop.hk&&prop.hk.inspection)?6:0),0,100);
  if(prop.invShort&&(prop.invShort.amenities||prop.invShort.linen||prop.invShort.cleaning))cleanScore=clamp(cleanScore-25,0,100);
  const fd=(prop.staff.frontdesk||[]);const fdFat=fd.length?fd.reduce((a,s)=>a+(s.fatigue||0),0)/fd.length:60;
  let serviceScore=clamp(62+(avgSkill(prop,'frontdesk')-65)*.6 - fdFat*.12 - (g.queued?12:0),0,100);
  let valueScore=clamp(82 - clamp(tot/refTot-1,-.4,1.4)*60,0,100);
  let locScore=clamp(48+prop.loc.conv*45,0,100);
  let comfortScore=clamp(q - (room.cond<70?(70-room.cond)*.8:0) - clamp(prop.loc.noise-(room.comp&&room.comp.soundproof?.3:0)-g.quiet,0,1)*18,0,100);
  let fnbScore=(prop.facilities.includes('restaurant')||prop.facilities.includes('breakfast'))?clamp(fnbQuality(prop),0,100):58;
  let techScore=clamp((prop.facilities.includes('wifi')||(room.comp&&room.comp.fastwifi))?82:42,0,100);
  const wnt=gt.prefer.filter(f=>prop.facilities.includes(f)).length;
  const w=cls.w;
  let experience=cleanScore*w.clean+serviceScore*w.service+valueScore*w.value+locScore*w.location+comfortScore*w.comfort+fnbScore*w.fnb+techScore*w.tech;
  experience+=wnt*1.2+facBoost(prop,'sat')*.1;
  if(prop.maintBacklog&&prop.maintBacklog.some(is=>is.roomId===room.id))experience-=6;
  // --- expectation (class, price-fairness, memory) ---
  let expectation=64*cls.exp*(g.expM||1);
  if(g.loyalty)expectation+=(g.prior||0)*1.2;
  expectation+=clamp(tot/refTot-1,0,1.2)*14;                         // pay more, expect more
  if(g.returning){const e=G.guestDB[g.name+'|'+g.type];if(e)expectation+=clamp(e.avgSat-70,-8,12)*.3;}
  // --- satisfaction ---
  let sat=65+(experience-expectation);
  if((g.complaints||0)>0){ if((prop.policies.generosity||.5)>.55&&avgSkill(prop,'frontdesk')>60){sat+=6;g.recovered=true;} else sat-=4; } // service-recovery paradox
  g.sat=clamp(sat,0,100);
  prop._satSum=(prop._satSum||0)+g.sat;prop._satN=(prop._satN||0)+1;   // feed analytics + daily-report satisfaction
  if(g.sat<45)g.complaints=(g.complaints||0)+1;
  g.satComponents={clean:cleanScore,service:serviceScore,value:valueScore,location:locScore,comfort:comfortScore,fnb:fnbScore,tech:techScore,experience:Math.round(experience),expectation:Math.round(expectation)};
  if(!prop.compAvg)prop.compAvg={};['clean','service','value','location','comfort','fnb','tech'].forEach(k=>{prop.compAvg[k]=prop.compAvg[k]==null?g.satComponents[k]:prop.compAvg[k]*.9+g.satComponents[k]*.1;});
  // --- ancillary revenue: charged per use during the stay via the department
  // model (guestRoutine → deptPrice). The old checkout lump-sums duplicated
  // that money and are removed (audit B8). Parking fees keep their own path.
  g.extraRev=0;
  prop._deptDay=prop._deptDay||{fnb:0,other:0};prop._deptDay.other+=(g.extraPark||0);
  g.aspects=buildAspects(prop,room,g,cleanScore);
  const st=prop.channelStats[g.channel];if(st){st.satSum=(st.satSum||0)+g.sat;st.satN=(st.satN||0)+1;st.revenue=(st.revenue||0)+(rate*g.nights*(1-(CHANNELS[g.channel].comm||0)));}
  const reviewChance=g.reviewT*(.4+Math.abs(g.sat-65)/65)*G.D.harsh*.55; // ~15-20% of guests review, matching real OTA rates
  if(Math.random()<clamp(reviewChance,.05,.95))leaveReview(prop,g,room);
  feed((g.sat>75?'😊':g.sat>50?'😐':'😞')+' '+g.name+' checked out — '+Math.round(g.sat)+'% ('+cls.name+' expectations).',g.sat>70?'pos':g.sat>45?'info':'neg');
}

/* component phrasings (positive / negative), used only when consistent with the star band */
const REV_POS={clean:"the room was spotlessly clean",service:"the staff were warm and genuinely helpful",value:"it was excellent value for money",location:"the location was superb and convenient",comfort:"the room was comfortable and restful",fnb:"the food was delicious",tech:"the Wi-Fi was fast and reliable"};
const REV_NEG={clean:"the room simply wasn't clean enough",service:"the front desk was slow and unhelpful",value:"it felt overpriced for what you get",location:"the location was inconvenient",comfort:"the room was tired and uncomfortable",fnb:"the food was disappointing",tech:"the Wi-Fi was unreliable"};

/* ---------------- REVIEW GENERATOR (override) ---------------- */
function reviewText(stars,g,room,prop){
  const C=g.satComponents||{}, U=g.used||{};
  const keys=Object.keys(REV_POS).filter(k=>C[k]!=null);
  const sorted=keys.slice().sort((a,b)=>C[b]-C[a]);
  const best=sorted.slice(0,2), worst=sorted.slice(-2).reverse();
  // facility clauses strictly from what the guest actually used
  const facPos=[],facNeg=[];
  if(U.breakfast||g.hadBreakfast)facPos.push("breakfast was a lovely start to the day");
  if(U.restaurant)facPos.push("the in-house restaurant was a real highlight");
  if(U.spa)facPos.push("the spa was pure indulgence");
  if(U.pool)facPos.push("the pool was a wonderful way to unwind");
  if(U.gym)facPos.push("the gym was well equipped");
  if(U.roomsvc)facPos.push("room service was prompt and courteous");
  if(g.vehicle&&g.parked&&g.parked!=='none')facPos.push("the on-site parking was very convenient");
  if(g.vehicle&&g.parked==='none')facNeg.push("there was nowhere to park when I arrived");
  if(g.queued)facNeg.push("check-in took far too long");
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  const title=pick(REV_TITLES[stars]||REV_TITLES[3]);
  let body=pick(REV_BODIES[stars]||REV_BODIES[3]);
  const add=[];
  if(stars>=5){
    best.forEach(k=>{if(C[k]>=60&&Math.random()<.7)add.push(REV_POS[k]);});
    facPos.slice(0,2).forEach(f=>{if(Math.random()<.7)add.push(f);});
  }else if(stars===4){
    best.forEach(k=>{if(C[k]>=58&&Math.random()<.65)add.push(REV_POS[k]);});
    facPos.slice(0,1).forEach(f=>{if(Math.random()<.6)add.push(f);});
    if(Math.random()<.22&&worst[0]&&C[worst[0]]<58)add.push("the only small letdown was that "+REV_NEG[worst[0]]);
  }else if(stars===3){
    if(best[0]&&C[best[0]]>=56)add.push(REV_POS[best[0]]);
    if(worst[0]&&C[worst[0]]<56)add.push("that said, "+REV_NEG[worst[0]]);
    if(facPos[0]&&Math.random()<.4)add.push(facPos[0]);
  }else if(stars===2){
    worst.forEach(k=>{if(C[k]<58&&Math.random()<.75)add.push(REV_NEG[k]);});
    facNeg.slice(0,1).forEach(f=>add.push(f));
    if(best[0]&&C[best[0]]>=62&&Math.random()<.35)add.push("on the plus side, "+REV_POS[best[0]]);
  }else{
    worst.forEach(k=>{if(C[k]<60&&Math.random()<.8)add.push(REV_NEG[k]);});
    facNeg.slice(0,2).forEach(f=>add.push(f));
  }
  const uniq=[];add.forEach(x=>{if(x&&uniq.indexOf(x)<0)uniq.push(x);});
  let sentence=body;
  if(uniq.length)sentence+=" "+cap(uniq.slice(0,3).join("; "))+".";
  if(g.returning&&Math.random()<.45)sentence="A return visit — "+sentence.charAt(0).toLowerCase()+sentence.slice(1);
  if(g.upgraded&&stars>=4&&Math.random()<.5)sentence+=" The complimentary upgrade was a kind touch.";
  if(g.recovered&&stars>=3&&Math.random()<.5)sentence+=" A small issue was sorted out quickly and graciously.";
  return {title,body:sentence};
}

/* ---------------- DEPARTMENT CONFIG ---------------- */
const DEPTS={
 breakfast :{name:'Breakfast',ic:'🥐',base:350,costUse:120,sat:5,defComp:true,meal:true,external:false},
 restaurant:{name:'Restaurant',ic:'🍽️',base:650,costUse:200,sat:6,strat:true,external:true,meal:true},
 roomsvc   :{name:'Room Service',ic:'🛎️',base:520,costUse:170,sat:4,external:false},
 gym       :{name:'Fitness Centre',ic:'🏋️',base:300,costUse:70,sat:4,defComp:true,external:false},
 pool      :{name:'Swimming Pool',ic:'🏊',base:400,costUse:130,sat:5,defComp:true,external:false},
 spa       :{name:'Spa & Wellness',ic:'💆',base:1800,costUse:600,sat:6,external:true},
 laundry   :{name:'Laundry',ic:'🧺',base:420,costUse:130,sat:3,laundry:true,external:false},
 traveldesk:{name:'Travel Desk',ic:'🧭',base:800,costUse:160,sat:3,defComp:true,external:false},
 conf      :{name:'Conference Hall',ic:'🪑',base:16000,costUse:4500,sat:2,external:true},
 banquet   :{name:'Banquet Hall',ic:'🎉',base:65000,costUse:20000,sat:2,external:true},
 lounge    :{name:'Executive Lounge',ic:'🥂',base:900,costUse:250,sat:6,defComp:true,external:false}
};
function defaultDept(key){const d=DEPTS[key];return {mode:'manager',service:d.defComp?'comp':'paid',pricing:'standard',strategy:'balanced',express:false,outsource:false,machines:0,daily:{rev:0,cost:0,profit:0,cust:0,util:0,sat:0},mRev:0,mCost:0,mProfit:0,mCust:0,mDays:0,pRev:null,pCost:null,pProfit:null,pCust:null};}
function deptPrice(prop,key){const d=DEPTS[key],st=(prop.dept||{})[key];if(!st||st.service==='comp')return 0;
  const clsK=hotelClass(prop).k;const clsMult={budget:.8,midscale:1,upscale:1.3,luxury:1.7}[clsK]||1;
  const preMult={budget:.75,standard:1,premium:1.45}[st.pricing]||1;
  return Math.round(d.base*(prop.city.spend||1)*(prop.loc.rate||1)*clsMult*preMult/10)*10;}
function deptCapacity(prop,key){
  if(key==='restaurant')return 30+(prop.staff.fnb||[]).length*22;
  if(key==='spa')return 5+(prop.staff.fnb||[]).length*3;
  if(key==='banquet')return 2;if(key==='conf')return 4;
  if(key==='laundry')return 8+(prop.staff.housekeeping||[]).length*4+((prop.dept.laundry&&prop.dept.laundry.machines)||0)*6;
  return Math.max(6,Math.round(10+occupied(prop)*.6));}
function ensureDepts(prop){if(!prop.dept)prop.dept={};Object.keys(DEPTS).forEach(k=>{if(prop.facilities.includes(k)&&!prop.dept[k])prop.dept[k]=defaultDept(k);});}

  });
};

/* ---------------- LIVING FRONT OFFICE ---------------- */
function runFrontOffice(prop){
  const fd=(prop.staff.frontdesk||[]);
  const arr=prop.expectedToday||0;
  const perRecep=fd.reduce((s,r)=>s+(2+(r.skill/100)*2)*(1-(r.fatigue||0)/220)*(1-(r.burnout||0)/300),0);
  const dailyCap=Math.max(0,perRecep*10);
  const occ=occupied(prop)/Math.max(1,prop.rooms.length);
  const dirtyFrac=prop.rooms.length?prop.rooms.filter(r=>r.status==='dirty').length/prop.rooms.length:0;
  const complexity=1+occ*.3+dirtyFrac*.4;
  const effArr=arr*complexity;
  const avgWait=fd.length?clamp((effArr-dailyCap)/Math.max(1,fd.length)*4,0,45):45;
  const avgFriend=fd.length?Math.round(fd.reduce((s,r)=>s+(r.friendliness||60),0)/fd.length):0;
  fd.forEach(r=>{const overloaded=effArr>dailyCap;r.burnout=clamp((r.burnout||0)+(overloaded?1.3:-0.8),0,100);});
  prop.fo={recep:fd.length,cap:Math.round(dailyCap),arrivals:arr,effArr:Math.round(effArr),avgWait:Math.round(avgWait),
    bottleneck:effArr>dailyCap*1.05,throughput:Math.min(arr,Math.round(dailyCap)),
    avgFriend,avgStress:fd.length?Math.round(fd.reduce((s,r)=>s+(r.burnout||0),0)/fd.length):0,readiness:Math.round((1-dirtyFrac)*100)};
}

/* checkInGuest — friendliness + experience + VIP + stress (override) */
function checkInGuest(prop,a,waiting){
  let room=prop.rooms.find(r=>r.id===a.roomId);
  if(!(room&&room.status==='clean')){
    const alt=prop.rooms.find(r=>r.status==='clean');
    if(alt){room=alt;a.roomId=alt.id;a.sat-=6;feed('⚠️ Room not ready — '+a.name+' moved to Room '+alt.id+'.','warn');}
    else{a.checkedIn='lost';prop.incidents++;a.sat=20;prop._compToday=(prop._compToday||0)+1;
      if(a.depositPaid&&a.deposit>0){G.cash-=a.deposit;prop.depositsHeld=Math.max(0,(prop.depositsHeld||0)-a.deposit);a.depositPaid=false;}
      feed('❌ No clean room for '+a.name+' — walked out.','neg');prop.reputation=clamp(prop.reputation-1.2,0,100);
      logEvent(prop,'service','Walkout: no clean room for '+a.name+'.');return;}
  }
  room.status='occupied';room.guest=a;a.checkedIn=true;prop.lifetimeGuests++;prop._arrToday=(prop._arrToday||0)+1;
  const fd=avgSkill(prop,'frontdesk');a.sat+=(fd-65)*.15;
  const fdArr=(prop.staff.frontdesk||[]);const friend=fdArr.length?fdArr.reduce((s,r)=>s+(r.friendliness||60),0)/fdArr.length:55;
  a.sat+=(friend-55)*.06;
  const vip=(a.type==='vip'||a.loyalty)||chkPrio(a)>=3;
  if(waiting>0&&!vip){a.sat-=clamp(waiting*rnd(3,6),0,22);a.queued=waiting;}
  else if(waiting>0&&vip){a.sat-=clamp(waiting*rnd(1,2),0,8);} // VIPs fast-tracked
  fdArr.forEach(r=>{if(waiting>0)r.burnout=clamp((r.burnout||0)+.4,0,100);r.exp=(r.exp||0)+1;});
  if(a.loyalty){const L=LOYALTY.find(x=>x.name===a.loyalty);if(L&&L.upg&&Math.random()<L.upg){a.sat+=4;a.upgraded=true;}if(L&&L.brk)a.sat+=2;}
  assignParking(prop,a);
  if(prop.policies.breakfast==='included'||prop.policies.breakfast==='buffet')a.sat+=2;
  feed('🛎️ '+a.name+' ('+(a.returning?'returning ':'')+GUEST_TYPES[a.type].name+(a.loyalty?', '+a.loyalty:'')+') checked into Room '+room.id+(a.queued?' after a wait':'')+'.',a.returning?'gold':'info');
  if(a.returning)logEvent(prop,'guest',a.name+' returned for stay #'+(a.prior+1)+'.');
}

/* ---------------- GUEST ROUTINE — route spend through department pricing (override) ---------------- */
function guestRoutine(prop,room,g){
  const h=G.hour,has=f=>prop.facilities.includes(f),weekend=(G.dow>=5),rainy=(G.weather==='Rainy');
  g.used=g.used||{};ensureDepts(prop);
  if(g.out){ if(h>=18&&Math.random()<.4){g.out=false;g.act='returned';} return; }
  if(Math.random()>.5)return;
  const use=(key,cat,ic)=>{const st=prop.dept[key];if(!st)return;g.used[key]=1;st._cust=(st._cust||0)+1;
    if(st.service==='comp'){st._comp=(st._comp||0)+1;g.sat=clamp(g.sat+(DEPTS[key].sat||3)*.15,0,100);}
    else{const amt=deptPrice(prop,key);if(amt>0){g.spendIn+=amt;prop.revToday+=amt;G.cash+=amt;G.totalRevenue+=amt;prop.lifetimeRev+=amt;st._rev=(st._rev||0)+amt;prop._deptDay=prop._deptDay||{fnb:0,other:0};if(cat==='fnb')prop._deptDay.fnb+=amt;else prop._deptDay.other+=amt;
      if(cat==='fnb'&&prop.fnbRev){const hh=G.hour;if(hh<=10)prop.fnbRev.breakfast+=amt;else if(hh<=15)prop.fnbRev.lunch+=amt;else prop.fnbRev.dinner+=amt;}
      const cls=hotelClass(prop);g.sat=clamp(g.sat-clamp(amt/(g.budget*.35)-1,-.3,1)*3,0,100);}}};
  const _chefs=(typeof onDuty==='function')?onDuty(prop,'fnb'):((prop.staff.fnb||[]).length?1:0);
  if(h>=7&&h<=10&&!g.hadBreakfast&&(has('breakfast')||has('restaurant'))&&(_chefs>0||(typeof onDuty==='function'&&onDuty(prop,'housekeeping')>0))){g.hadBreakfast=true;g.act='breakfast';use(has('breakfast')?'breakfast':'restaurant','fnb');routineFeed(prop,g,'is having breakfast');return;}
  if(h>=9&&h<=16){const biz=(g.type==='business'||g.type==='corporate');if((biz&&!weekend&&Math.random()<.5)||(['tourist','family','wedding'].includes(g.type)&&!rainy&&Math.random()<.5)){g.out=true;g.act=biz?'at a meeting':'out sightseeing';routineFeed(prop,g,biz?'left for a meeting':'left to explore '+prop.city.name);return;}}
  if(h>=12&&h<=14&&!g._lunch&&has('restaurant')&&_chefs>0&&Math.random()<.4){g._lunch=true;g.act='lunch';use('restaurant','fnb');return;}
  if(h>=19&&h<=22&&!g._dinner&&has('restaurant')&&_chefs>0&&Math.random()<.5){g._dinner=true;g.act='dinner';use('restaurant','fnb');routineFeed(prop,g,'is dining in the restaurant');return;}
  if(has('gym')&&['business','premium','corporate','vip'].includes(g.type)&&Math.random()<.2){g.act='gym';use('gym','other');return;}
  if(has('spa')&&Math.random()<.12){g.act='spa';use('spa','other');routineFeed(prop,g,'visited the spa');return;}
  if(has('pool')&&(rainy?false:Math.random()<.15)){g.act='pool';use('pool','other');return;}
  if(has('lounge')&&['business','corporate','vip','premium'].includes(g.type)&&Math.random()<.15){g.act='lounge';use('lounge','other');return;}
  if(h===20&&has('restaurant')&&!_chefs&&!g._kc){g._kc=1;g.sat=clamp(g.sat-1,0,100);} // kitchen dark at dinner time — guests notice
  if(has('roomsvc')&&Math.random()<.18){g.act='room service';use('roomsvc','other');return;}
  if(has('traveldesk')&&['tourist','family','wedding'].includes(g.type)&&Math.random()<.1){g.act='travel desk';use('traveldesk','other');return;}
  if(has('laundry')&&(g.type==='longstay'||g.type==='business')&&Math.random()<.12){g.act='laundry';use('laundry','other');prop._laundryQueue=(prop._laundryQueue||0)+1;return;}
}

/* ---------------- DEPARTMENT SIMULATION (daily) ---------------- */
function runDepartments(prop){
  ensureDepts(prop);
  const mgrSkill=avgSkill(prop,'manager')||45, eff=.8+mgrSkill/100*.45;
  const clsK=hotelClass(prop).k;
  Object.keys(prop.dept).forEach(key=>{
    if(!prop.facilities.includes(key)){delete prop.dept[key];return;}
    const st=prop.dept[key],d=DEPTS[key];
    if(st.mode==='manager'){
      st.service=d.defComp&&(clsK==='upscale'||clsK==='luxury')?'comp':(d.defComp&&clsK==='midscale'&&Math.random()<.3?'comp':'paid');
      st.pricing=clsK==='luxury'?'premium':clsK==='budget'?'budget':'standard';
      if(d.strat)st.strategy='balanced';
      if(key==='laundry'){st.express=(clsK==='luxury');st.outsource=false;}
    }
    const guestCust=st._cust||0,guestRev=st._rev||0,compCust=st._comp||0;
    let extCust=0,extRev=0;
    if(d.external&&st.service!=='comp'){
      const price=deptPrice(prop,key)||d.base;
      let base= d.base>=16000 ? rnd(0,1.1) : (occupied(prop)*.35+(prop.city.tour||.3)*6);
      if(key==='restaurant'){const s=st.strategy||'balanced';base*= s==='external'?1.8:s==='guest'?.35:1;}
      base*=(.45+(prop.rating||3)/5*.75)*(prop.city.spend||1)*eff; // a no-name 2.5-star draws few outside covers
      extCust=Math.max(0,Math.round(base*rnd(.7,1.3)));
      extRev=extCust*price;
      if(extRev){prop.revToday+=extRev;G.cash+=extRev;G.totalRevenue+=extRev;prop.lifetimeRev+=extRev;prop._deptDay=prop._deptDay||{fnb:0,other:0};if(d.meal)prop._deptDay.fnb+=extRev;else prop._deptDay.other+=extRev;}
    }
    const totalCust=guestCust+extCust+compCust;
    const rev=guestRev+extRev;
    const fixed=(FACILITIES[key]?FACILITIES[key].daily:0)*(1+((G.macro&&G.macro.inflation)||0));
    let cost=Math.round(totalCust*d.costUse/eff+fixed);
    if(key==='laundry'){
      const cap=deptCapacity(prop,key),q=prop._laundryQueue||0;
      if(st.outsource){cost+=Math.round(q*90);prop._laundryDelay=0;}
      else{const done=cap*(st.express?1.5:1);prop._laundryDelay=Math.max(0,q-done);if(st.express)cost+=Math.round(q*40);}
      if(prop._laundryDelay>0){prop.hkStrain=clamp((prop.hkStrain||0)+prop._laundryDelay*.02,0,1);if(Math.random()<.3)logEvent(prop,'maintenance','Laundry backlog of '+Math.round(prop._laundryDelay)+' is delaying room readiness.');}
      prop._laundryQueue=0;
    }
    G.cash-=cost;prop.expToday+=cost;prop._opExToday=(prop._opExToday||0)+cost;
    const cap=deptCapacity(prop,key),util=clamp(totalCust/Math.max(1,cap)*100,0,145);
    if((key==='restaurant'||key==='spa')&&util>100&&st.service!=='comp'){prop.reputation=clamp(prop.reputation-(util-100)*.008,0,100);if(Math.random()<.25)logEvent(prop,'service',d.name+' was over capacity — guests faced longer waits.');}
    const satC=st.service==='comp'?(d.sat*.8):clamp(6-({budget:0,standard:1.5,premium:3}[st.pricing]||0),0,8);
    st.daily={rev:Math.round(rev),cost:Math.round(cost),profit:Math.round(rev-cost),cust:totalCust,util:Math.round(util),sat:+satC.toFixed(1)};
    st.mRev=(st.mRev||0)+rev;st.mCost=(st.mCost||0)+cost;st.mProfit=(st.mProfit||0)+(rev-cost);st.mCust=(st.mCust||0)+totalCust;st.mDays=(st.mDays||0)+1;
    if(st.mDays>=30){st.pRev=Math.round(st.mRev);st.pCost=Math.round(st.mCost);st.pProfit=Math.round(st.mProfit);st.pCust=st.mCust;st.mRev=0;st.mCost=0;st.mProfit=0;st.mCust=0;st.mDays=0;}
    st._cust=0;st._rev=0;st._comp=0;
  });
}

/* ---------------- ADVANCED HR (daily) ---------------- */
function runHR(prop){
  const load=workload(prop);
  Object.entries(prop.staff).forEach(([role,arr])=>arr.forEach(s=>{
    if(s.ambition==null)s.ambition=+rnd(.3,.9).toFixed(2);
    if(s.friendliness==null)s.friendliness=ri(45,88);
    if(s.burnout==null)s.burnout=ri(5,20);
    if(!s.name)s.name=pick(FNAMES)+' '+pick(LNAMES);
    s.exp=(s.exp||0)+1;
    if(s.exp>0&&s.exp%75===0)s.skill=clamp(s.skill+1,0,99);            // slow on-the-job learning
    s.burnout=clamp((s.burnout||0)+((s.fatigue||0)>70?1.2:load>1.15?.6:-1.0)+rnd(-.3,.3),0,100);
    const amb=s.ambition||.5;
    s.resignProb=clamp(s.burnout/100*.45+(60-s.morale)/100*.4+amb*.08,0,.9);
  }));
  if(Math.random()<.06){
    const all=Object.entries(prop.staff).flatMap(([r,a])=>a.map(s=>({r,s})));
    const risky=all.filter(x=>Math.random()<(x.s.resignProb||0)*.35);
    if(risky.length){const {r,s}=risky[0];if((prop.staff[r]||[]).length>1||Math.random()<.4){prop.staff[r]=prop.staff[r].filter(x=>x!==s);
      logEvent(prop,'staff',s.name+' ('+ROLES[r].name+') resigned — burnout '+Math.round(s.burnout)+', morale '+Math.round(s.morale)+'.');
      feed('👋 '+s.name+' resigned from '+ROLES[r].name+'. Efficiency dips until a replacement is trained.','warn');}}
  }
}
window.raiseTeam=role=>{const p=P(),arr=p.staff[role]||[];if(!arr.length)return;const cost=Math.round(arr.reduce((s,x)=>s+x.sal*.08,0));if(G.cash<cost*3){toast('Not enough cash for the ongoing cost.','neg');return;}arr.forEach(s=>{s.sal=Math.round(s.sal*1.08);s.morale=clamp(s.morale+10,0,100);s.burnout=clamp(s.burnout-8,0,100);});logDecision('Salary revision — '+ROLES[role].name,0,'Raise pay 8%','Morale up, attrition down','Higher monthly payroll',['staff']);toast(ROLES[role].name+' given an 8% raise.','pos');renderTab();};
window.promoteTop=role=>{const p=P(),arr=p.staff[role]||[];if(!arr.length)return;const s=arr.slice().sort((a,b)=>(b.exp||0)-(a.exp||0))[0];s.skill=clamp(s.skill+6,0,99);s.sal=Math.round(s.sal*1.15);s.morale=clamp(s.morale+12,0,100);s.burnout=clamp(s.burnout-12,0,100);s.tier='Senior';logEvent(p,'staff',s.name+' promoted within '+ROLES[role].name+'.');logDecision('Promotion — '+s.name,0,'Promote top performer','Skill & morale up','Higher salary',['staff']);toast(s.name+' promoted.','pos');renderTab();};
window.approveLeave=role=>{const p=P(),arr=p.staff[role]||[];if(!arr.length)return;arr.forEach(s=>{s.burnout=clamp(s.burnout-18,0,100);s.fatigue=clamp((s.fatigue||0)-30,0,100);s.morale=clamp(s.morale+5,0,100);});logDecision('Approved leave — '+ROLES[role].name,0,'Rest the team','Burnout & fatigue drop','Brief capacity dip',['staff']);toast(ROLES[role].name+' team rested.','pos');renderTab();};
window.transferStaff=(fromRole,toRole)=>{const p=P();if(!(p.staff[fromRole]||[]).length){toast('No one to transfer.','warn');return;}const s=p.staff[fromRole].pop();s.role=toRole;s.skill=clamp(Math.round(s.skill*.7),30,99);s.exp=Math.round((s.exp||0)*.5);if(!p.staff[toRole])p.staff[toRole]=[];p.staff[toRole].push(s);logEvent(p,'staff',s.name+' transferred from '+ROLES[fromRole].name+' to '+ROLES[toRole].name+'.');toast(s.name+' transferred (skills partly transfer).','pos');renderTab();};

  const d=DEPTS[key],st=(p.dept||{})[key];

  const price=deptPrice(p,key),player=st.mode==='player',dis=player?'':'disabled';
  const day=st.daily||{rev:0,cost:0,profit:0,cust:0,util:0,sat:0};
  const mR=st.pRev!=null?st.pRev:Math.round(st.mRev||0),mC=st.pCost!=null?st.pCost:Math.round(st.mCost||0),mP=st.pProfit!=null?st.pProfit:Math.round(st.mProfit||0);
  return `<div class="page-head"><div><h2>${d.ic} ${d.name}</h2><div class="desc">Independent department — manage it yourself or delegate. <a onclick="go('facilities')" style="cursor:pointer;color:var(--gold)">← All facilities</a></div></div></div>

    <div class="muted sm" style="margin-top:6px">${st.mode==='manager'?'Your manager (skill '+Math.round(avgSkill(p,'manager'))+'/100) auto-optimises pricing, strategy and cost efficiency. Detailed controls are locked.':'You have full manual control of this department.'}</div>
  </div>
  <div class="cards cols-2">
   <div class="card"><h3>Service Model & Pricing</h3>
     <div class="row"><span class="lab">Model</span><span class="val"><button class="tag ${st.service==='comp'?'on':''}" ${dis} onclick="deptService('${key}','comp')">Complimentary</button> <button class="tag ${st.service!=='comp'?'on':''}" ${dis} onclick="deptService('${key}','paid')">Paid</button></span></div>
     ${st.service!=='comp'?`<div class="row"><span class="lab">Pricing strategy</span><span class="val">${['budget','standard','premium'].map(x=>`<button class="tag ${st.pricing===x?'on':''}" ${dis} onclick="deptPricing('${key}','${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join(' ')}</span></div>
     <div class="row"><span class="lab">Auto-calculated price</span><span class="val gold">${cr(price)} / use</span></div>

function netWorthV8(){try{return (typeof assetValue==='function'?assetValue():0)+G.cash-(typeof totalDebt==='function'?totalDebt():0);}catch(e){return G.cash;}}
function computeScore(){const p=P();if(!p)return 0;const nw=netWorthV8();
  const compAvg=p.compAvg?(Object.values(p.compAvg).reduce((s,v)=>s+v,0)/Math.max(1,Object.keys(p.compAvg).length)):60;
  let s=0;
  s+=clamp(nw/2e7,0,1.3)*230;
  s+=clamp(p.reputation/100,0,1)*190;
  s+=clamp((p.rating||0)/5,0,1)*150;
  s+=clamp((p._gopparToday||0)/8000,0,1.2)*150;
  s+=clamp(G.properties.length/5,0,1)*90;
  s+=clamp(compAvg/100,0,1)*120;
  s+=clamp((p.lifetimeGuests||0)/2000,0,1)*70;
  return Math.round(s);}

  const dirty=p.rooms.filter(r=>r.status==='dirty').length;if(dirty>Math.max(4,p.rooms.length*.45))it.push({s:2,t:dirty+' rooms awaiting cleaning',tab:'operations'});
  if(p.fo&&p.fo.bottleneck)it.push({s:2,t:'Front-desk bottleneck — queues building',tab:'frontoffice'});

  Object.keys(p.dept||{}).forEach(k=>{if(p.facilities.includes(k)&&p.dept[k].service!=='comp'&&((p.dept[k].daily||{}).profit||0)<-500)it.push({s:1,t:(DEPTS[k]?DEPTS[k].name:k)+' is losing money',tab:'fac:'+k});});

/* ---------------- MARKET: 7-day outlook + booking pace (wrap) ---------------- */
function projDemand(p,off){const day=G.day+off;
  const seas=seasonFactor(day,p.city,p.loc);
  const doy=((day-1)%360),month=Math.floor(doy/30)+1;let fest=1;
  if([10,11,12,1,2].includes(month))fest*=1.15;
  [315,300,250,75].forEach(fd=>{const dist=Math.min(Math.abs(doy-fd),360-Math.abs(doy-fd));if(dist<4)fest*=1.5-dist*0.1;});
  const weekend=((G.dow+off)%7)>=5;
  const macro=(G.macro?(G.macro.airTraffic||1)/(G.macro.supply||1):1);
  let d=p.city.dem*p.loc.dem*seas*fest*weatherDemand()*repFactor(p)*compFactor(p)*(1+facBoost(p,'dem'))*(1+(G.chain?G.chain.brand:0)/100*.5)*(1+(p.awareness||0)/100*.3)*macro*(weekend?1.15:1)*G.D.demM;
  return clamp(d,.15,2.6);}
const _v8Mkt=tabMarket;
tabMarket=function(p){
  let rows='';for(let i=1;i<=7;i++){const d=projDemand(p,i);const occ=Math.round(clamp(d*42+22,10,100));rows+=`<div class="row"><span class="lab">Day +${i}${((G.dow+i)%7)>=5?' · wknd':''}</span><span class="val" style="min-width:150px">demand ${d.toFixed(2)} · ~${occ}% ${barInline(occ,occ>75?'#46c06a':occ>45?'#e6b450':'#ef6a6a')}</span></div>`;}
  let pace='building history';const a=(p.analytics||[]).slice(-30);
  if(a.length>=5){const avg=a.reduce((s,x)=>s+x.occ,0)/a.length;const cur=a.slice(-3).reduce((s,x)=>s+x.occ,0)/Math.min(3,a.length);pace=(cur>avg*1.05?'ahead of':cur<avg*0.95?'behind':'on')+' your 30-day pace';}
  const card=`<div class="card" style="margin-top:12px"><h3>7-Day Outlook & Booking Pace</h3><div class="muted sm" style="margin-bottom:6px">Projected from season, festivals, weather, reputation and competition. You are currently <b>${pace}</b>.</div>${rows}</div>`;

const R_ROLES=['frontdesk','housekeeping','maintenance','security','fnb'];
const R_MAXWK=56; // absolute weekly cap (contract + overtime)
function rNeed(p,role,dow,h){
  const rms=p.rooms.length;if(!rms)return 0;
  if(role==='frontdesk')return 1+(rms>=16&&h>=8&&h<=22?1:0)+(rms>=34?1:0);
  if(role==='housekeeping')return (h>=8&&h<=17)?Math.max(1,Math.ceil(rms/10)):(rms>=20&&h>=18&&h<=20?1:0);
  if(role==='maintenance')return (h>=9&&h<=18&&rms>=8)?1:0;
  if(role==='security')return (rms>=12&&(h>=20||h<=5))?1:0;
  if(role==='fnb')return p.facilities.includes('restaurant')&&((h>=7&&h<=10)||(h>=12&&h<=15)||(h>=19&&h<=23))?Math.max(1,Math.ceil((p.fnb?p.fnb.seats:24)/26)):0;
  return 0;
}
function rHead(p,role){return (p.staff[role]||[]).length;}
function rWeekHours(p,role){return p.roster[role].reduce((s,d)=>s+d.reduce((a,b)=>a+b,0),0);}
function coverage(p,role,dow,h){const need=rNeed(p,role,dow,h);if(!need)return 1;const asg=Math.min((p.roster[role]||[[]])[dow]?p.roster[role][dow][h]:0,rHead(p,role));return clamp(asg/need,0,1.5);}
function covDay(p,role){let s=0,n=0;for(let h=0;h<24;h++){if(rNeed(p,role,G.dow,h)){s+=coverage(p,role,G.dow,h);n++;}}return n?s/n:1;}
function autoFillRoster(p){
  R_ROLES.forEach(role=>{const head=rHead(p,role);let budget=head*R_MAXWK;
    for(let d=0;d<7;d++)for(let h=0;h<24;h++){const want=Math.min(rNeed(p,role,d,h),head);const use=Math.min(want,budget);p.roster[role][d][h]=use;budget-=use;}});
}
window.rosterCell=(role,d,h)=>{const p=P();const head=rHead(p,role);if(!head){toast('Hire '+ROLES[role].name+' staff first.','warn');return;}

  p.roster[role][d][h]=nxt;renderTab();};

function onDuty(p,role){try{const head=(p.staff[role]||[]).length;if(!head)return 0;const c=p.roster&&p.roster[role]?p.roster[role][G.dow][G.hour]:0;return Math.min(c,head);}catch(e){return (p.staff[role]||[]).length?1:0;}}

/* housekeeping: only rostered staff clean */
cleanCapacity=function(prop){
  const crew=dutyList(prop,'housekeeping');if(!crew.length)return 0;
  let perHour=0;
  crew.forEach(a=>{const rooms8=12+(a.skill/100)*6;perHour+=rooms8/8*((a.morale||70)/100)*(1-(a.fatigue||0)/200);});

/* front office: capacity from rostered coverage, not headcount */
runFrontOffice=function(prop){
  const fd=(prop.staff.frontdesk||[]);

  const skill=fd.length?fd.reduce((s,r)=>s+r.skill,0)/fd.length:0;
  const perRecep=(2+(skill/100)*2)*(1-((prop.fat&&prop.fat.frontdesk)||0)/220);
  const dailyCap=Math.max(0,perRecep*effHeads*10);
  const occ=occupied(prop)/Math.max(1,prop.rooms.length);
  const dirtyFrac=prop.rooms.length?prop.rooms.filter(r=>r.status==='dirty').length/prop.rooms.length:0;
  const effArr=arr*(1+occ*.3+dirtyFrac*.4);
  const avgWait=effHeads>0?clamp((effArr-dailyCap)/Math.max(.5,effHeads)*4,0,45):45;
  const avgFriend=fd.length?Math.round(fd.reduce((s,r)=>s+(r.friendliness||60),0)/fd.length):0;
  fd.forEach(r=>{r.burnout=clamp((r.burnout||0)+(effArr>dailyCap?1.1:-0.8),0,100);});
  prop.fo={recep:fd.length,onNow:onDuty(prop,'frontdesk'),cap:Math.round(dailyCap),arrivals:arr,effArr:Math.round(effArr),

  if(a.loyalty){const L=LOYALTY.find(x=>x.name===a.loyalty);if(L&&L.upg&&Math.random()<L.upg){a.sat+=4;a.upgraded=true;}if(L&&L.brk)a.sat+=2;

  cand.push(['Airport Hotel',(p.loc.transW||0)*1.4+(p.facilities.includes('shuttle')?.6:0)+sh('transit')*1.5]);

function finExplain(p){
  const a=p.analytics;if(a.length<2)return [];
  const cur=a[a.length-1],prev=a[a.length-2];const out=[];
  const d=(x,y)=>Math.round((x||0)-(y||0));
  const revD=d(cur.rev,prev.rev),expD=d(cur.exp,prev.exp);
  if(Math.abs(revD)>500){
    const why=[];
    const occD=Math.round((cur.occ||0)-(prev.occ||0)),adrD=d(cur.adr,prev.adr);
    if(Math.abs(occD)>=3)why.push((occD>0?'+':'')+occD+'pt occupancy');
    if(Math.abs(adrD)>=50)why.push('ADR '+(adrD>0?'+':'')+cr0(adrD));
    const arrD=d(cur.arrivals,prev.arrivals);if(Math.abs(arrD)>=2)why.push((arrD>0?'+':'')+arrD+' arrivals');
    if(p._fnbInfo&&p._fnbPrev){const cd=(p._fnbInfo.covers||0)-(p._fnbPrev.covers||0);if(Math.abs(cd)>=4)why.push((cd>0?'+':'')+cd+' restaurant covers');}
    out.push({k:'Revenue',v:revD,why:why.length?why:['normal daily variance']});
  }
  if(Math.abs(expD)>500){
    const why=[];
    if((G._otYest||0)>200)why.push('overtime & night premiums '+cr0(G._otYest));
    const mD=d(cur.maintCost,prev.maintCost);if(Math.abs(mD)>800)why.push('maintenance '+(mD>0?'+':'')+cr0(mD));
    if((p.joins||[]).length===0&&(p._joinYest||0)>0)why.push((p._joinYest)+' new joiner(s) on payroll');
    const camp=(p.marketing&&p.marketing.campaigns||[]).length;if(camp)why.push(camp+' marketing campaign(s) running');
    if(Object.keys(p.invShort||{}).length)why.push('emergency procurement (stock-outs)');
    if((p.assets&&Object.values(p.assets).some(x=>x.down))?1:0)why.push('facility breakdown downtime');
    out.push({k:'Expenses',v:expD,why:why.length?why:['payroll & running costs']});
  }
  if(p._fnbInfo&&p._fnbPrev&&p.dept&&p.dept.restaurant){
    const pd=(p.dept.restaurant.daily||{}).profit||0,pp=p._prevDaily.restaurant||0;
    if(Math.abs(pd-pp)>800){const why=[];
      const cd=(p._fnbInfo.covers||0)-(p._fnbPrev.covers||0);if(cd)why.push((cd>0?'+':'')+cd+' covers');
      const ck=(p._fnbInfo.check||0)-(p._fnbPrev.check||0);if(Math.abs(ck)>20)why.push('avg check '+(ck>0?'+':'')+cr0(ck));
      if(p.invShort&&p.invShort.foodstock)why.push('ingredient stock-out');
      out.push({k:'Restaurant profit',v:Math.round(pd-pp),why:why.length?why:['menu & demand mix']});}
  }
  return out;
}

  const w={};

  CH_ORDER.forEach(k=>{w[k]=Math.max(.005,w[k]||.005);});

/* ---------- (1) ROSTER OVERHAUL ---------- */
const R_MAXDAY=8;
function dayHours(p,role,d){return p.roster[role][d].reduce((a,b)=>a+b,0);}
rNeed=function(p,role,dow,h){
  const rms=p.rooms.length;if(!rms)return 0;
  if(role==='frontdesk')return 1+(rms>=16&&h>=8&&h<=22?1:0)+(rms>=34?1:0);
  if(role==='housekeeping'){
    if(h>=8&&h<=17)return Math.max(1,Math.ceil(rms/10));
    if(h>=18&&h<=22)return rms>=8?1:0;
    return rms>=18?1:0; /* overnight turndown/laundry desk for larger hotels */
  }
  if(role==='maintenance')return (h>=9&&h<=18&&rms>=8)?1:0;
  if(role==='security'){
    if(h>=20||h<=5)return rms>=6?1:0;
    return (rms>=24||p.facilities.includes('banquet'))?1:0; /* big or event hotels keep day security */
  }
  if(role==='fnb'){const F=p.facilities,meal=(h>=7&&h<=10)||(h>=12&&h<=15)||(h>=19&&h<=23);
    if(F.includes('restaurant')&&meal)return Math.max(1,Math.ceil((p.fnb?p.fnb.seats:24)/26));
    if(F.includes('breakfast')&&h>=6&&h<=10)return 1;
    if(F.includes('lounge')&&h>=17&&h<=22)return 1;
    if(F.includes('banquet')&&h>=18&&h<=22)return 1;
    if(F.includes('roomsvc')&&meal)return 1;
    return 0;}
  return 0;
};
autoFillRoster=function(p){
  p._rosterGap={};
  R_ROLES.forEach(role=>{
    const head=rHead(p,role);
    p.roster[role]=Array.from({length:7},()=>Array(24).fill(0));
    if(!head){let miss=0;for(let d=0;d<7;d++)for(let h=0;h<24;h++)miss+=rNeed(p,role,d,h);if(miss)p._rosterGap[role]={miss,why:'No '+ROLES[role].name.toLowerCase()+' on payroll — hire first.'};return;}
    let weekBudget=head*R_MAXWK;
    const dayBudget=Array(7).fill(head*R_MAXDAY);
    let missed=0;
    /* two passes: cover 1 person everywhere first, then top up to full need */
    for(let pass=0;pass<2;pass++){
      for(let d=0;d<7;d++)for(let h=0;h<24;h++){
        const need=Math.min(rNeed(p,role,d,h),head);
        const want=pass===0?Math.min(1,need):need;
        const cur=p.roster[role][d][h];
        let add=Math.max(0,want-cur);
        add=Math.min(add,weekBudget,dayBudget[d]);
        if(add>0){p.roster[role][d][h]=cur+add;weekBudget-=add;dayBudget[d]-=add;}
        if(pass===1)missed+=Math.max(0,need-p.roster[role][d][h]);
      }
    }
    if(missed>0){
      const per=R_MAXWK, needHeads=Math.ceil(missed/per);
      p._rosterGap[role]={miss:missed,why:head+' × '+ROLES[role].name.toLowerCase()+' can legally work '+(head*R_MAXWK)+'h/week ('+R_MAXWK+'h cap, '+R_MAXDAY+'h/day). Coverage needs '+missed+'h more — hire ~'+needHeads+' more.'};
    }
  });
};

/* ---------- (B7) settle unresolved same-day bookings ----------
   Walkouts get their collected deposit refunded; guests who never showed
   forfeit it per the cancellation policy. Runs before every scheduleDay
   (day rollover, property switch, new hotel) so paid arrivals can no
   longer be discarded with their deposit stuck in the liability. */
function v15SettleArrivals(){
  try{
    (G.pendingArrivals||[]).forEach(a=>{
      if(a.checkedIn===true||a._settled||!a.depositPaid)return;
      a._settled=true;
      const prop=G.properties[a._propIdx!=null?a._propIdx:G.active]||P();
      const dep=a.deposit||0;if(dep<=0||!prop)return;
      if(a.checkedIn==='lost'){
        G.cash-=dep;prop.depositsHeld=Math.max(0,(prop.depositsHeld||0)-dep);
        logEvent(prop,'finance','Deposit '+cr0(dep)+' refunded to '+a.name+' (walkout).');
        return;
      }
      const keepFr=prop.policies.cancelType==='flexible'?0:prop.policies.cancelType==='partial'?.5:1;
      const keep=Math.round(dep*keepFr),refund=dep-keep;
      if(refund>0)G.cash-=refund;
      if(keep>0)prop.revToday+=keep;
      prop.depositsHeld=Math.max(0,(prop.depositsHeld||0)-dep);

runDepartments=function(prop){
  ensureDepts(prop);
  const mgrSkill=avgSkill(prop,'manager')||45, eff=.8+mgrSkill/100*.45;
  const clsK=hotelClass(prop).k;
  Object.keys(prop.dept).forEach(key=>{
    if(!prop.facilities.includes(key)){delete prop.dept[key];return;}
    const st=prop.dept[key],d=DEPTS[key];
    if(st.mode==='manager'){
      st.service=d.defComp&&(clsK==='upscale'||clsK==='luxury')?'comp':(d.defComp&&clsK==='midscale'&&Math.random()<.3?'comp':'paid');
      st.pricing=clsK==='luxury'?'premium':clsK==='budget'?'budget':'standard';
      if(d.strat)st.strategy='balanced';
      if(key==='laundry'){st.express=(clsK==='luxury');st.outsource=false;}
      if(key==='restaurant'&&prop.fnb)prop.fnb.menu=clsK==='luxury'?2:clsK==='budget'?0:1;
    }
    const guestCust=st._cust||0,guestRev=st._rev||0,compCust=st._comp||0;
    let extCust=0,extRev=0;
    if(d.external&&st.service!=='comp'){
      const price=deptPrice(prop,key)||d.base;
      let base= d.base>=16000 ? rnd(0,1.1) : (occupied(prop)*.35+(prop.city.tour||.3)*6);
      if(key==='restaurant'){const s=st.strategy||'balanced';base*= s==='external'?1.8:s==='guest'?.35:1;
        base*=[.7,1,1.25][(prop.fnb&&prop.fnb.menu)||0];          // finer menus draw more walk-in covers
        if(!(prop.staff.fnb||[]).length||(typeof rWeekHours==='function'&&rWeekHours(prop,'fnb')===0))base=0;} // no kitchen crew rostered — no covers
      base*=(.7+(prop.rating||3)/5*.6)*(prop.city.spend||1)*eff;
      extCust=Math.max(0,Math.round(base*rnd(.7,1.3)));
      if(key==='restaurant'&&prop.fnb){                             // seats × table-turns capacity gate
        const seatCap=Math.round((prop.fnb.seats||24)*2.8);
        extCust=Math.max(0,Math.min(extCust,seatCap-guestCust));

        if(key==='restaurant'&&prop.fnbRev){prop.fnbRev.lunch+=Math.round(extRev*.35);prop.fnbRev.dinner+=Math.round(extRev*.65);}}
    }
    const totalCust=guestCust+extCust+compCust;
    const rev=guestRev+extRev;
    const fixed=(FACILITIES[key]?FACILITIES[key].daily:0)*(1+((G.macro&&G.macro.inflation)||0));
    let cost=Math.round(totalCust*d.costUse/eff+fixed);
    if(key==='laundry'){
      const cap=deptCapacity(prop,key),q=prop._laundryQueue||0;
      if(st.outsource){cost+=Math.round(q*90);prop._laundryDelay=0;}
      else{const done=cap*(st.express?1.5:1);prop._laundryDelay=Math.max(0,q-done);if(st.express)cost+=Math.round(q*40);}
      if(prop._laundryDelay>0){prop.hkStrain=clamp((prop.hkStrain||0)+prop._laundryDelay*.02,0,1);if(Math.random()<.3)logEvent(prop,'maintenance','Laundry backlog of '+Math.round(prop._laundryDelay)+' is delaying room readiness.');}
      prop._laundryQueue=0;
    }
    G.cash-=cost;prop.expToday+=cost;prop._opExToday=(prop._opExToday||0)+cost;
    const cap=deptCapacity(prop,key),util=clamp(totalCust/Math.max(1,cap)*100,0,145);
    if((key==='restaurant'||key==='spa')&&util>100&&st.service!=='comp'){prop.reputation=clamp(prop.reputation-(util-100)*.008,0,100);if(Math.random()<.25)logEvent(prop,'service',d.name+' was over capacity — guests faced longer waits.');}
    const satC=st.service==='comp'?(d.sat*.8):clamp(6-({budget:0,standard:1.5,premium:3}[st.pricing]||0),0,8);
    st.daily={rev:Math.round(rev),cost:Math.round(cost),profit:Math.round(rev-cost),cust:totalCust,util:Math.round(util),sat:+satC.toFixed(1),inh:guestCust,ext:extCust};
    st.mRev=(st.mRev||0)+rev;st.mCost=(st.mCost||0)+cost;st.mProfit=(st.mProfit||0)+(rev-cost);st.mCust=(st.mCust||0)+totalCust;st.mDays=(st.mDays||0)+1;

function v18Blocks(h){ // split rendered HTML into top-level <div> blocks (depth-scanned)
  const out=[];let i=0,n=h.length;
  while(i<n){
    const s=h.indexOf('<div',i);
    if(s<0){if(i<n)out.push({t:h.slice(i)});break;}
    if(s>i)out.push({t:h.slice(i,s)});
    let d=0,j=s;
    while(j<n){
      if(h.startsWith('<div',j)){d++;j+=4;continue;}
      if(h.startsWith('</div>',j)){d--;j+=6;if(d===0)break;continue;}
      j++;

    out.push({t:h.slice(s,j),block:1});
    i=j;
  }

}

const SHIFTS=[{k:'M',n:'Morning',h:[6,7,8,9,10,11,12,13]},{k:'A',n:'Afternoon',h:[14,15,16,17,18,19,20,21]},{k:'N',n:'Night',h:[22,23,0,1,2,3,4,5]}];
function shiftCells(role,d,sh){ // [day,hour] pairs — night shift spills into the next day
  return sh.h.map(h=>sh.k==='N'&&h<6?[(d+1)%7,h]:[d,h]);
}
function shiftLevel(p,role,d,sh){ // guaranteed staffing across the hours that actually need cover
  const cells=shiftCells(role,d,sh);
  const needed=cells.filter(([dd,h])=>rNeed(p,role,dd,h)>0);
  return Math.min(...(needed.length?needed:cells).map(([dd,h])=>p.roster[role][dd][h]));
}
function shiftNeed(p,role,d,sh){
  return Math.max(...shiftCells(role,d,sh).map(([dd,h])=>rNeed(p,role,dd,h)),0);
}
window.rosterShift=(role,d,si)=>{
  const p=P();const head=rHead(p,role);const sh=SHIFTS[si];
  if(!head){toast('Hire '+ROLES[role].name+' staff first.','warn');return;}
  const cur=shiftLevel(p,role,d,sh);

  const delta=(nxt-cur)*sh.h.length;
  if(nxt>cur&&rWeekHours(p,role)+delta>head*R_MAXWK){toast('⚠ Weekly cap: '+head+' staff × '+R_MAXWK+'h = '+(head*R_MAXWK)+' staff-hours.','neg');return;}

/* auto-roster: coverage first, contracted hours before overtime, no waste */
autoFillRoster=function(p){
  p._rosterGap={};
  R_ROLES.forEach(role=>{
    const head=rHead(p,role);
    p.roster[role]=Array.from({length:7},()=>Array(24).fill(0));
    if(!head){let miss=0;for(let d=0;d<7;d++)for(let h=0;h<24;h++)miss+=rNeed(p,role,d,h);
      if(miss)p._rosterGap[role]={miss,why:'No '+ROLES[role].name.toLowerCase()+' on payroll — hire first.'};return;}
    let std=head*(p.contract||46);              // contracted staff-hours
    let ot=head*R_MAXWK-std;                    // overtime pool — used only when coverage demands it
    let missed=0;
    for(let pass=0;pass<2;pass++){              // pass 0: one person on every needed hour; pass 1: full need
      for(let d=0;d<7;d++)SHIFTS.forEach(sh=>{
        const cells=shiftCells(role,d,sh).filter(([dd,h])=>rNeed(p,role,dd,h)>0); // skeleton crew: pay only needed hours
        if(!cells.length)return;
        const need=Math.min(shiftNeed(p,role,d,sh),head);
        const want=pass===0?Math.min(1,need):need;
        const cur=shiftLevel(p,role,d,sh);
        let addN=Math.max(0,want-cur);
        if(!addN)return;
        const cost=addN*cells.length;
        let grant=0;
        if(std>=cost){std-=cost;grant=addN;}
        else if(std+ot>=cost){ot-=(cost-std);std=0;grant=addN;}
        else{grant=Math.floor((std+ot)/cells.length);ot=Math.max(0,std+ot-grant*cells.length);std=0;}
        if(pass===1)missed+=(addN-grant)*cells.length;
        if(grant>0)cells.forEach(([dd,h])=>{p.roster[role][dd][h]=Math.max(p.roster[role][dd][h],cur+grant);});
      });
    }
    if(missed>0)p._rosterGap[role]={miss:missed,why:head+' × '+ROLES[role].name.toLowerCase()+' cannot cover '+missed+' more staff-hours within the '+R_MAXWK+'h/week cap — hire ~'+Math.ceil(missed/R_MAXWK)+' more.'};
  });
};
function v21Workforce(p){

    const sal=(p.staff[role]||[]).reduce((s,x)=>s+x.sal,0);

  });
  return {rows,totCost:Math.round(totCost),totGap,totOT,perOcc:Math.round(totCost/occ)};

/* ---------------- currency-literal localiser for static label strings ---------------- */
function locStr(str){ if(str==null)return str;
  return (''+str).replace(/₹\s?([\d,]+(?:\.\d+)?)(?:\s*(Crore|Cr|Lakh|L))?/g,(m,num,unit)=>{
    let v=parseFloat((num||'0').replace(/,/g,''))||0;
    if(unit){v*= unit.charAt(0)==='C'?1e7:1e5;}
    return cr(v);
  });
}

  for(const k in COMPONENTS)COMPONENTS[k].cost=Math.round(_BASE.comp[k]*C.capex);
  for(const k in INV)INV[k].cost=Math.round(_BASE.invc[k]*(1+(C.capex-1)*.6));
  for(const r in ROLES)ROLES[r].sal=Math.round(_BASE.sal[r]*C.wage/1000)*1000;

}

/* =======================================================================
   v27 — STREAMLINING PASS (spec items 5-9 + 7)
   5) Remove the random Events/Situations system (organic-only gameplay)
   6) Pricing: two modes only — Player Managed / Manager Managed, with five
      market-positioning options; one authoritative daily repricer
   7) Construction costs reduced ~20% (rooms/quality/facilities/components
      via _BASE; floors & parking edited at source)
   8) Contract hours removed — one standard 56h/week, 8h/day schedule
   9) Manager-controlled rostering toggle (auto-roster once a GM is hired)
   No simulation depth removed; existing systems preserved.
   ======================================================================= */

/* ---------- (5) organic-only: kill the random event spawner ---------- */

/* ---------- (7) construction -20% at the cost source ---------- */
try{
  const K=0.8;
  for(const rt in _BASE.build)_BASE.build[rt]=Math.round(_BASE.build[rt]*K);
  for(let i=0;i<_BASE.qcost.length;i++)_BASE.qcost[i]=Math.round(_BASE.qcost[i]*K);
  for(const f in _BASE.fbuild)_BASE.fbuild[f]=Math.round(_BASE.fbuild[f]*K);
  for(const k in _BASE.comp)_BASE.comp[k]=Math.round(_BASE.comp[k]*K);
  applyCountry((typeof _cc!=='undefined'&&_cc)||(G&&G.country)||'india'); // re-derive live constants
}catch(e){}

/* ---------- (8) one standard schedule: 56h/week, 8h/day, no contracts ---------- */
/* payroll: full salary buys 56h availability; OT only past 56h (never, given the cap) */
v12Payroll=function(p){
  const out={ot:0,night:0,rows:[]};
  R_ROLES.forEach(role=>{const head=(p.staff[role]||[]).length;if(!head)return;
    const wk=rWeekHours(p,role);const perHead=wk/head;
    const sal=(p.staff[role]||[]).reduce((s,x)=>s+x.sal,0)/head;
    const hourly=sal/(4.33*R_MAXWK);
    const otH=Math.max(0,perHead-R_MAXWK);            // 56h standard availability
    let night=0;for(let d=0;d<7;d++)for(let h=0;h<24;h++){if((h>=22||h<6)&&p.roster[role][d][h])night+=p.roster[role][d][h];}
    const otPay=Math.round(otH*hourly*1.5*head/7);
    const nightPay=Math.round(night*hourly*.15/7);
    out.ot+=otPay;out.night+=nightPay;
    out.rows.push({role,perHead:Math.round(perHead),otH:Math.round(otH),otPay,nightPay});
  });
  return out;
