  const w={business:c.biz*1.0+l.bizW,corporate:c.biz*.6+l.bizW*.5,tourist:c.tour*1.0+l.tourW,
    family:c.tour*.5+.15,budget:(1-c.spend*.5)+.25,transit:l.transW+.1,premium:c.prem*.8,
    wedding:c.tour*.25+.05,longstay:.12,vip:c.prem*.3};
  for(const k in w){w[k]=Math.max(.02,w[k]);if(CH.arche.includes(k))w[k]*=2.4;if(prop.segBoost&&prop.segBoost[k])w[k]*=(1+prop.segBoost[k]);}
  let tot=0;for(const k in w)tot+=w[k];
  let r=Math.random()*tot,type='tourist';
  for(const k in w){r-=w[k];if(r<=0){type=k;break;}}
  let returning=null,prior=0,favRT=null,loyalty=null;
  const poolT=G.returnPool&&G.returnPool[type];
  if(poolT&&poolT.length&&Math.random()<clamp(.12+prop.reputation/100*.25,0,.5)){
    returning=pick(poolT);prior=returning.stays;favRT=returning.favRT;type=returning.type;loyalty=loyaltyTier(prior);
  }
  const gt=GUEST_TYPES[type];
  const budget=c.baseRate*c.spend*gt.budgetF*rnd(.8,1.3)*(ch==='ota'?.95:ch==='corp'?1.08:1);
  const veh=Math.random()<vehProb(type,l);
  const ev=veh&&Math.random()<(['premium','business','corporate','vip'].includes(type)?.3:.08);
  return {id:'g'+(roomSeq++)+''+ri(10,99),name:returning?returning.name:regionalName(prop),type,
    channel:ch,budget,sens:gt.sens*c.sens*G.D.sensM,quiet:gt.quiet,clean:gt.clean,
    patience:gt.patience,reviewT:gt.review*CH.reviewM,expM:CH.expM*(loyalty?1.06:1),
    returning:!!returning,prior,favRT,loyalty:loyalty?loyalty.name:null,
    vehicle:veh,ev,sat:72+(returning?4:0),requests:[],complaints:0,served:0,
    out:false,hadBreakfast:false,spendIn:0,act:null};
}

/* ---------------- DAY SCHEDULING (override: awareness, weather, marketing bookings) ---------------- */
function scheduleDay(){
  const prop=P();
  buildReturnPool();
  G.seasonNow=seasonFactor(G.day,prop.city,prop.loc);
  prop.channelStats=prop.channelStats||{};
  const total=prop.rooms.length||1;
  let demandIdx=prop.city.dem*prop.loc.dem*G.seasonNow*repFactor(prop)*compFactor(prop)*G.D.demM;
  demandIdx*=(1+facBoost(prop,'dem'));
  demandIdx*=(1+(G.chain?G.chain.brand:0)/100*.5);
  demandIdx*=(1+(prop.awareness||0)/100*.3);
  demandIdx*=weatherDemand();
  const weekend=(G.dow>=5);
  demandIdx*=weekend?(1+prop.city.tour*.25):(1+prop.city.biz*.12);
  let attempts=Math.round(total*1.6*clamp(demandIdx,.2,2.3)*rnd(.8,1.2));
  attempts=clamp(attempts,prop.rooms.length?1:0,total*3);
  const arrivals=[],chCount={};const overbook=prop.policies.overbook||0;let booked=0;
  for(let i=0;i<attempts;i++){
    const g=genGuest(prop);
    g.nights=clamp(ri(GUEST_TYPES[g.type].nights[0],GUEST_TYPES[g.type].nights[1]),prop.policies.minStay||1,prop.policies.maxStay||30);
    let cand=prop.rooms.filter(r=>r.status==='clean'&&priceOK(prop,r,g)&&!arrivals.find(a=>a.roomId===r.id));
    if(!cand.length){if(overbook>0&&booked<total+overbook){cand=prop.rooms.filter(r=>!arrivals.find(a=>a.roomId===r.id)&&priceOK(prop,r,g));}if(!cand.length)continue;}
    if(g.returning&&g.favRT){const same=cand.filter(r=>r.type===g.favRT);if(same.length)cand=same;}
    cand.sort((a,b)=>scoreFor(g,b)-scoreFor(g,a));
    const room=cand[0];
    let willing=bookWillingness(prop,room,g);
    if(prop.policies.cancelType==='nonref')willing*=.9;
    if(prop.policies.payment==='full')willing*=.92;
    if(prop.policies.cancelType==='flexible')willing*=1.04;
    if(g.loyalty)willing*=1.08;
    const st=prop.channelStats[g.channel]=prop.channelStats[g.channel]||{bookings:0,cancels:0,satSum:0,satN:0,revenue:0,repeat:0};
    if(Math.random()<willing){
      g.roomId=room.id;g.arrHour=sampleHour(prop);
      g.depDay=G.day+g.nights;g.depHour=clamp((prop.policies.checkoutTime||11)+ri(-1,1),6,14);
      g.price=prop.prices[room.type];
      if(g.loyalty){const L=LOYALTY.find(x=>x.name===g.loyalty);if(L)g.price=Math.round(g.price*(1-L.disc));}
      const depFrac=prop.policies.payment==='full'?1:prop.policies.payment==='partial'?.3:0;
      g.deposit=Math.round(g.price*g.nights*depFrac);g.bookingAmt=g.price*g.nights;
      const cancelP=CHANNELS[g.channel].cancel*(prop.policies.cancelType==='nonref'?.5:prop.policies.cancelType==='flexible'?1.15:1);
      if(Math.random()<cancelP){
        prop.cancellations=(prop.cancellations||0)+1;st.cancels++;
        const keepFr=prop.policies.cancelType==='flexible'?0:prop.policies.cancelType==='partial'?.5:1;
        if(keepFr>0&&g.deposit>0){const keep=Math.round(g.deposit*keepFr);G.cash+=keep;prop.revToday+=keep;logEvent(prop,'finance',g.name+' cancelled — deposit '+cr0(keep)+' retained.');}
        else logEvent(prop,'booking',g.name+' cancelled (refundable).');
        continue;
      }
      st.bookings++;if(g.returning)st.repeat++;
      // attribute booking to active marketing campaign of same channel/segment
      (prop.marketing.campaigns||[]).forEach(cm=>{const M=MKT[cm.type];if(M&&((M.ch&&M.ch===g.channel)||(M.seg&&M.seg===g.type)))cm.bookings=(cm.bookings||0)+1;});
      g.checkedIn=false;arrivals.push(g);booked++;chCount[g.channel]=(chCount[g.channel]||0)+1;
    }
  }
  G.pendingArrivals=arrivals;prop.expectedToday=arrivals.length;prop.chCountToday=chCount;
  ensureIntel(prop);
}

/* ---------------- LIVE GUEST ROUTINES ---------------- */
function guestRoutine(prop,room,g){
  const h=G.hour,has=f=>prop.facilities.includes(f),weekend=(G.dow>=5),rainy=(G.weather==='Rainy');
  if(g.out){ if(h>=18&&Math.random()<.4){g.out=false;g.act='returned';} return; }
  if(Math.random()>.5)return; // not every guest acts every hour
  const spend=v=>{const a=Math.round(v);g.spendIn+=a;prop.revToday+=a;G.cash+=a;G.totalRevenue+=a;prop.lifetimeRev+=a;};
  // breakfast
  if(h>=7&&h<=10&&!g.hadBreakfast&&(has('breakfast')||has('restaurant'))){g.hadBreakfast=true;g.act='breakfast';if(prop.policies.breakfast!=='included')spend(rnd(120,360));routineFeed(prop,g,'is having breakfast');return;}
  // leave hotel for sightseeing/meetings (daytime)
  if(h>=9&&h<=16){
    const biz=(g.type==='business'||g.type==='corporate');
    if((biz&&!weekend&&Math.random()<.5)||(['tourist','family','wedding'].includes(g.type)&&!rainy&&Math.random()<.5)){g.out=true;g.act=biz?'at a meeting':'out sightseeing';routineFeed(prop,g,biz?'left for a meeting':'left to explore '+prop.city.name);return;}
  }
  // lunch / dinner
  if(h>=12&&h<=14&&has('restaurant')&&Math.random()<.4){g.act='lunch';spend(rnd(200,520));return;}
  if(h>=19&&h<=22&&has('restaurant')&&Math.random()<.5){g.act='dinner';spend(rnd(300,800));routineFeed(prop,g,'is dining in the restaurant');return;}
  // amenities
  if(has('gym')&&['business','premium','corporate','vip'].includes(g.type)&&Math.random()<.2){g.act='gym';g.sat=clamp(g.sat+.5,0,100);return;}
  if(has('spa')&&Math.random()<.12){g.act='spa';spend(rnd(800,2500));g.sat=clamp(g.sat+1,0,100);routineFeed(prop,g,'booked the spa');return;}
  if(has('pool')&&(rainy?false:Math.random()<.15)){g.act='pool';g.sat=clamp(g.sat+.5,0,100);return;}
  if(has('roomsvc')&&Math.random()<.18){g.act='room service';spend(rnd(250,900));return;}
  if(has('laundry')&&(g.type==='longstay'||g.type==='business')&&Math.random()<.12){g.act='laundry';if(prop.policies.laundry==='paid')spend(rnd(200,600));return;}
}
function routineFeed(prop,g,txt){ if(prop!==P())return; if(G._rfeed==null)G._rfeed=0; if(G._rfeed>=3)return; G._rfeed++; feed('• '+g.name+' '+txt+'.','info'); }

/* ---------------- SIM TICK (override: queue fatigue, housekeeping priority, routines) ---------------- */
function tickHour(){
  const prop=P();G._rfeed=0;
  G.hour++;
  if(G.hour>=24){G.hour=0;G.day++;G.dow=(G.dow+1)%7;dayRollover();}
  // arrivals + front-desk queue with fatigue
  const due=G.pendingArrivals.filter(a=>!a.checkedIn&&a.checkedIn!=='lost'&&a.arrHour===G.hour);
  if(due.length){
    due.sort((x,y)=>chkPrio(y)-chkPrio(x));
    const fd=(prop.staff.frontdesk||[]);fd.forEach(s=>{if(s.fatigue==null)s.fatigue=0;});
    const fatAvg=fd.length?fd.reduce((a,s)=>a+s.fatigue,0)/fd.length:60;
    const fdCap=Math.max(1,Math.round(fd.length*(avgSkill(prop,'frontdesk')/100*1.4+.6)*2*(1-fatAvg/220)));
    prop.queuePeak=Math.max(prop.queuePeak||0,due.length);
    due.forEach((a,idx)=>checkInGuest(prop,a,Math.max(0,idx+1-fdCap)));
    fd.forEach(s=>s.fatigue=clamp(s.fatigue+due.length*1.4,0,100));
    if(due.length>fdCap){prop._compToday=(prop._compToday||0)+1;logEvent(prop,'service','Front-desk queue of '+due.length+' exceeded capacity '+fdCap+'.');if(Math.random()<.3)prop.reputation=clamp(prop.reputation-.4,0,100);}
  }
  // check-outs
  prop.rooms.forEach(room=>{
    const g=room.guest;
    if(g&&g.checkedIn===true&&G.day>=g.depDay&&G.hour>=g.depHour){
      finalizeStay(prop,room,g);
      prop.channelRev=prop.channelRev||{};
      const gross=g.price*g.nights+(g.extraRev||0)+(g.extraPark||0);
      const comm=Math.round((g.price*g.nights)*((CHANNELS[g.channel]&&CHANNELS[g.channel].comm)||0));
      const rev=gross-comm;
      prop.commToday=(prop.commToday||0)+comm;
      prop.channelRev[g.channel]=(prop.channelRev[g.channel]||0)+rev;
      prop.revToday+=rev;prop.lifetimeRev+=rev;G.totalRevenue+=rev;G.cash+=rev;
      writeGuestDB(prop,g);
      if(g.parked==='ev'&&prop.parking)prop.parking.evOccupied=Math.max(0,prop.parking.evOccupied-1);
      else if(g.parked==='std'&&prop.parking)prop.parking.occupied=Math.max(0,prop.parking.occupied-1);
      prop._depToday=(prop._depToday||0)+1;
      room.guest=null;room.status='dirty';room.dirtyT=ri(1,3);room.cond=clamp(room.cond-rnd(.5,2.2),40,100);
    }
  });
  // housekeeping with intelligent priority
  let hk=Math.round(cleanCapacity(prop));
  const arrIds=new Set(G.pendingArrivals.filter(a=>!a.checkedIn).map(a=>a.roomId));
  let dirty=prop.rooms.filter(r=>r.status==='dirty');
  const pr=prop.hk?prop.hk.priority:'balanced';
  if(pr==='checkouts')dirty.sort((a,b)=>a.dirtyT-b.dirtyT);
  else if(pr==='occupied')dirty.sort((a,b)=>((arrIds.has(b.id)?1:0)-(arrIds.has(a.id)?1:0))||a.dirtyT-b.dirtyT);
  else dirty.sort((a,b)=>((arrIds.has(b.id)?1:0)-(arrIds.has(a.id)?1:0))||a.dirtyT-b.dirtyT);
  dirty.forEach(r=>{if(hk>0){r.dirtyT--;if(r.dirtyT<=0){r.status='clean';if(prop.hk&&prop.hk.inspection&&Math.random()<.15)r.cond=clamp(r.cond+3,0,100);}hk--;}});
  // maintenance recovery
  prop.rooms.filter(r=>r.status==='maintenance').forEach(r=>{r.maintT-=maintSpeed(prop);if(r.maintT<=0){r.status='dirty';r.dirtyT=1;r.cond=clamp(r.cond+rnd(10,25),0,100);feed('🔧 Room '+r.id+' maintenance complete.','pos');}});
  // mood drift + live routines
  prop.rooms.filter(r=>r.status==='occupied').forEach(r=>{const g=r.guest;if(!g)return;
    const noise=prop.loc.noise*(1-facBoost(prop,'sat')*.01)-(r.comp&&r.comp.soundproof?.25:0);
    if(noise>g.quiet+.15&&Math.random()<.04)g.sat-=rnd(.5,2);
    if(r.cond<60&&Math.random()<.05)g.sat-=rnd(.5,1.5);
    guestRoutine(prop,r,g);
  });
  // events
  G.eventCooldown--;
  if(G.eventCooldown<=0&&!G.paused){if(Math.random()<.14){triggerEvent(prop);G.eventCooldown=ri(8,18);}else G.eventCooldown=ri(3,7);}
  accrueHourlyCost(prop);
}

/* ---------------- SATISFACTION (override: inventory shortages, dining wait) ---------------- */
function fnbQuality(prop){const s=prop.staff.fnb||[];let q=s.length?clamp(s.reduce((a,x)=>a+x.skill*(x.morale/100),0)/s.length,30,98):42;if(prop.invShort&&(prop.invShort.foodstock||prop.invShort.beverages))q-=22;return clamp(q,10,98);}
function finalizeStay(prop,room,g){
  const gt=GUEST_TYPES[g.type];let sat=g.sat;
  const q=roomQ(room);
  let exp=ROOMTYPES[room.type].exp*gt.clean*G.D.exp*(g.expM||1);
  if(g.loyalty)exp+=(g.prior||0)*.6;
  sat+=(q-exp)*.5;
  const mkt=marketRate(prop,room.type);
  sat-=clamp((g.price/mkt-1),-.4,1.2)*22*g.sens*.6;
  let hkv=clamp(cleanCapacity(prop)/Math.max(1,prop.rooms.length)*100,30,100);
  if(prop.hk&&prop.hk.inspection)hkv=clamp(hkv+8,30,100);
  if(prop.invShort&&(prop.invShort.amenities||prop.invShort.linen||prop.invShort.cleaning))hkv=clamp(hkv-18,10,100);
  sat+=(hkv-65)*.18*g.clean;
  sat+=(avgSkill(prop,'frontdesk')-65)*.16;
  const wants=gt.prefer.filter(f=>prop.facilities.includes(f)).length;
  sat+=wants*3+facBoost(prop,'sat')*.15;
  let compVal=0;for(const k in (room.comp||{}))if(room.comp[k]&&COMPONENTS[k]&&COMPONENTS[k].val.includes(g.type))compVal+=2.4;
  sat+=Math.min(compVal,16);
  let noise=prop.loc.noise-(room.comp&&room.comp.soundproof?.3:0);
  sat-=clamp(noise-g.quiet,0,1)*14;
  if(prop.maintBacklog&&prop.maintBacklog.some(is=>is.roomId===room.id))sat-=rnd(3,8);
  if(prop.facilities.includes('restaurant')||prop.facilities.includes('breakfast')){
    const fq=fnbQuality(prop);sat+=(fq-60)*.1;
    if(fq<50&&Math.random()<.45){prop.foodComplaints=(prop.foodComplaints||0)+1;sat-=rnd(1,4);}
  }
  if(g.type==='longstay'&&prop.facilities.includes('laundry')&&prop.policies.laundry!=='unavailable'){sat+= (prop.invShort&&prop.invShort.detergent)?-2:3;}
  if(g.returning){const e=G.guestDB[g.name+'|'+g.type];if(e&&g.sat<e.avgSat-8){sat-=3;g.declined=true;}else if(e&&g.sat>e.avgSat+8){sat+=2;g.improved=true;}}
  g.sat=clamp(sat,0,100);
  if(g.sat<45)g.complaints=(g.complaints||0)+1;
  let extra=0;
  prop.facilities.forEach(f=>{if(FACILITIES[f].rev&&Math.random()<.5)extra+=rnd(300,1500)*(gt.budgetF);});
  if((prop.facilities.includes('restaurant')||prop.facilities.includes('breakfast'))&&!(prop.invShort&&(prop.invShort.foodstock||prop.invShort.beverages))){
    const b=rnd(120,420)*g.nights,l=prop.facilities.includes('restaurant')?rnd(0,500)*g.nights:0,dn=prop.facilities.includes('restaurant')?rnd(150,700)*g.nights:0;
    prop.fnbRev.breakfast+=b;prop.fnbRev.lunch+=l;prop.fnbRev.dinner+=dn;extra+=b+l+dn;
  }
  if(prop.policies.laundry==='paid'&&prop.facilities.includes('laundry')&&Math.random()<.4)extra+=rnd(200,700);
  if(prop.policies.roomsvc24&&prop.facilities.includes('roomsvc')&&Math.random()<.3)extra+=rnd(250,900);
  g.extraRev=Math.round(extra);
  g.aspects=buildAspects(prop,room,g,hkv);
  const st=prop.channelStats[g.channel];
  if(st){st.satSum=(st.satSum||0)+g.sat;st.satN=(st.satN||0)+1;st.revenue=(st.revenue||0)+(g.price*g.nights*(1-(CHANNELS[g.channel].comm||0)));}
  const reviewChance=g.reviewT*(.4+Math.abs(g.sat-65)/65)*G.D.harsh*.9;
  if(Math.random()<clamp(reviewChance,.05,.95))leaveReview(prop,g,room);
  feed((g.sat>75?'😊':g.sat>50?'😐':'😞')+' '+g.name+' checked out — satisfaction '+Math.round(g.sat)+'%.',g.sat>70?'pos':g.sat>45?'info':'neg');
}

/* ---------------- INVENTORY CONSUMPTION & PROCUREMENT ---------------- */
function consumeInventory(prop){
  const occ=occupied(prop),meals=(prop.facilities.includes('restaurant')||prop.facilities.includes('breakfast'))?occ:0,
    loads=prop.facilities.includes('laundry')?occ*.5:0,maintActs=prop.maintBacklog.length;
  INV_ORDER.forEach(k=>{const it=prop.inv[k],I=INV[k];
    let use=I.base*occ*.6;
    if(I.fnb)use=I.base*meals;if(I.laundry)use=I.base*loads;if(I.maint)use=I.base*(1+maintActs*.5);
    use*=rnd(.8,1.2);it.use=use;it.stock=Math.max(0,it.stock-use);
    if(it.incDays>0){it.incDays--;if(it.incDays<=0){it.stock=Math.min(I.cap,it.stock+it.incoming);logEvent(prop,'finance',I.name+' delivery received.');it.incoming=0;}}
  });
  if(prop.procAuto&&(prop.staff.procurement||[]).length>0)autoProcure(prop);
  prop.invShort={};INV_ORDER.forEach(k=>{if(prop.inv[k].stock<=0){prop.invShort[k]=true;}});
  if(Object.keys(prop.invShort).length&&Math.random()<.6)logEvent(prop,'maintenance','Stock-out: '+Object.keys(prop.invShort).map(k=>INV[k].name).join(', ')+'.');
}
function autoProcure(prop){
  const eff=avgSkill(prop,'procurement')/100;
  INV_ORDER.forEach(k=>{const it=prop.inv[k],I=INV[k];
    if(it.stock<=it.reorder&&it.incDays<=0){const qty=Math.round((I.cap-it.stock)*(.7+eff*.3));const cost=Math.round(qty*I.cost*(1.1-eff*.2));if(G.cash>=cost){G.cash-=cost;prop.expToday+=cost;it.incoming=qty;it.incDays=Math.max(1,Math.round(I.lead*(1.1-eff*.2)));}}
  });
}
window.reorderInv=k=>{const p=P(),it=p.inv[k],I=INV[k];const qty=I.cap-it.stock;const cost=Math.round(qty*I.cost);if(qty<=0){toast('Already full.');return;}if(G.cash<cost){toast('Not enough cash.','neg');return;}G.cash-=cost;p.expToday+=cost;it.incoming=qty;it.incDays=I.lead;logEvent(p,'finance','Ordered '+I.name+' ('+cr0(cost)+').');logDecision('Reorder '+I.name,cost,'Replenish stock','Stock inbound in '+I.lead+'d','Avoid shortages',['costs']);toast(I.name+' ordered — arrives in '+I.lead+'d.','pos');renderTab();};
window.toggleProcAuto=()=>{const p=P();p.procAuto=!p.procAuto;toast('Procurement: '+(p.procAuto?'manager-controlled':'manual'));renderTab();};

/* ---------------- CONSTRUCTION PROJECTS ---------------- */
const PROJECT_STAGES=['Planning','Approval','Construction','Interior','Furnishing','Inspection'];
let projSeq=1;
function projStage(pr){const done=1-pr.left/pr.total;return PROJECT_STAGES[Math.min(PROJECT_STAGES.length-1,Math.floor(done*PROJECT_STAGES.length))];}
function enqueueProject(prop,kind,spec,days,cost,label){
  if(G.cash<cost){toast('Not enough cash for '+label+'.','neg');return false;}
  G.cash-=cost;prop.expToday+=cost;
  const rel=rnd(.85,1.18),total=Math.max(1,Math.round(days*rel));
  prop.projects.push({id:projSeq++,kind,spec,total,left:total,cost,label});
  logEvent(prop,'expansion','Project started: '+label+' (~'+total+'d).');
  logDecision(label,cost,'Capital project','Build in ~'+total+'d','Adds capacity/appeal',['expansion']);
  toast('Project started: '+label+' (~'+total+' days).','pos');renderAll();return true;
}
function processProjects(prop){
  if(!prop.projects.length)return;
  prop.projects.forEach(pr=>pr.left--);
  const done=prop.projects.filter(pr=>pr.left<=0);
  prop.projects=prop.projects.filter(pr=>pr.left>0);
  done.forEach(pr=>materializeProject(prop,pr));
}
function materializeProject(prop,pr){
  const s=pr.spec;
  if(pr.kind==='room'){let floor=1;for(let f=1;f<=prop.floors;f++){if(prop.rooms.filter(r=>r.floor===f).length<prop.capPerFloor){floor=f;break;}}prop.rooms.push(makeRoom(prop,s.rt,floor,QUALITY[s.qi||0]));feed('🏗️ '+ROOMTYPES[s.rt].name+' room ready (floor '+floor+').','pos');}
  else if(pr.kind==='floor'){prop.floors++;feed('🏗️ Floor '+prop.floors+' opened.','pos');}
  else if(pr.kind==='facility'){const f=s.f,fc=FACILITIES[f];prop.facilities.push(f);if(f==='parking')prop.parking.spaces+=8;if(f==='evcharge')prop.parking.ev+=4;if(fc.staff){if(!prop.staff.fnb)prop.staff.fnb=[];for(let i=0;i<fc.staff;i++)prop.staff.fnb.push(mkStaff('fnb',0));}prop.reputation=clamp(prop.reputation+fc.rep*.4,0,100);feed('🏗️ '+fc.name+' now open.','pos');}
  else if(pr.kind==='parking'){prop.parking.spaces+=s.n;feed('🏗️ '+s.n+' parking spaces ready.','pos');}
  else if(pr.kind==='ev'){prop.parking.ev+=s.n;feed('🏗️ '+s.n+' EV bays ready.','pos');}
  logEvent(prop,'expansion',pr.label+' completed.');
}
/* build handlers now create projects */
window.buildRoom=rt=>{const p=P();const el=document.getElementById('q_'+rt);const qi=+((el&&el.value)||0);

/* ---------------- MARKETING ---------------- */
window.runMarketing=type=>{const p=P(),M=MKT[type];if(G.cash<M.cost){toast('Not enough cash.','neg');return;}G.cash-=M.cost;p.expToday+=M.cost;
  p.marketing.campaigns.push({type,left:M.days,total:M.days,impressions:0,bookings:0,spend:M.cost});

  if(M.seg){p.segBoost[M.seg]=Math.min(1.5,(p.segBoost[M.seg]||0)+.4);}
  logEvent(p,'finance',M.name+' campaign launched.');logDecision(M.name,M.cost,'Marketing campaign','Awareness & bookings up','Shifts channel mix toward direct',['revenue','channels','demand']);
  toast(M.name+' launched.','pos');renderAll();};
function processMarketing(prop){
  prop.marketing.campaigns.forEach(cm=>{cm.left--;cm.impressions+=ri(8000,40000);});
  const done=prop.marketing.campaigns.filter(cm=>cm.left<=0);
  prop.marketing.campaigns=prop.marketing.campaigns.filter(cm=>cm.left>0);
  done.forEach(cm=>{const M=MKT[cm.type];const est=cm.bookings*avgPrice(prop)*2.2;prop.marketing.hist.unshift({type:cm.type,spend:cm.spend,impressions:cm.impressions,bookings:cm.bookings,roi:Math.round(est-cm.spend),day:G.day});if(prop.marketing.hist.length>20)prop.marketing.hist.pop();logEvent(prop,'finance',M.name+' campaign ended ('+cm.bookings+' attributed bookings).');});
  // awareness & seg boosts decay
  prop.awareness=Math.max(0,(prop.awareness||0)-.4);
  for(const k in prop.segBoost){prop.segBoost[k]=Math.max(0,prop.segBoost[k]-.03);if(prop.segBoost[k]<=0)delete prop.segBoost[k];}
  if(prop.directBoost)prop.directBoost=Math.max(0,prop.directBoost-.02);
}

/* ---------------- FINANCING ---------------- */
function assetValue(){const p=P();let v=p.rooms.length*900000+p.facilities.length*1500000;return v;}
function totalDebt(){return G.loans.reduce((s,l)=>s+l.balance,0);}
function creditRating(){const debt=totalDebt(),base=assetValue()+G.cash;const dr=debt/Math.max(1,base);if(dr<.1)return 'AAA';if(dr<.25)return 'AA';if(dr<.4)return 'A';if(dr<.55)return 'BBB';if(dr<.7)return 'BB';return 'B';}
function maxLoan(){return Math.max(0,Math.round(assetValue()*.6-totalDebt()));}
window.takeLoan=(amt,n)=>{amt=+amt;n=+n;if(!amt||amt<=0){toast('Enter an amount.','neg');return;}if(amt>maxLoan()){toast('Exceeds borrowing capacity ('+cr(maxLoan())+').','neg');return;}
  const annual=creditRating()==='AAA'?.09:creditRating()==='AA'?.105:creditRating()==='A'?.12:creditRating()==='BBB'?.14:.16;const r=annual/12;
  const emi=Math.round(amt*r/(1-Math.pow(1+r,-n)));G.loans.push({principal:amt,balance:amt,rate:r,emi,termLeft:n,annual});G.cash+=amt;
  logEvent(P(),'finance','Loan drawn: '+cr(amt)+' over '+n+' months.');logDecision('Take loan '+cr(amt),0,'Finance expansion','Cash now, EMI '+cr0(emi)+'/mo','Interest cost over '+n+'mo',['costs']);toast('Loan approved: '+cr(amt)+'.','pos');renderTab();};
window.investorRaise=amt=>{amt=+amt;if(!amt||amt<=0)return;const share=Math.min(.4,(amt/30000000)*.1);G.investorShare=Math.min(.4,G.investorShare+share);G.cash+=amt;logEvent(P(),'finance','Investor capital raised: '+cr(amt)+' for '+Math.round(share*100)+'% profit share.');logDecision('Investor raise '+cr(amt),0,'Equity funding','Cash now','Permanent '+Math.round(share*100)+'% profit share',['costs']);toast('Investor capital: '+cr(amt)+'.','pos');renderTab();};
function payEMIs(){G.loans.forEach(l=>{const interest=l.balance*l.rate;const principal=Math.max(0,l.emi-interest);G.cash-=l.emi;P().expToday+=l.emi;l.balance=Math.max(0,l.balance-principal);l.termLeft--;});const before=G.loans.length;G.loans=G.loans.filter(l=>l.balance>500&&l.termLeft>0);if(G.loans.length<before)logEvent(P(),'finance','A loan has been fully repaid.');}

/* ---------------- DAY ROLLOVER (override: inventory, projects, marketing, EMI, weather) ---------------- */
function dayRollover(){
  const prop=P();
  prop.revYest=prop.revToday;prop.expYest=prop.expToday;
  G.finHist.push({day:G.day-1,rev:prop.revToday,exp:prop.expToday,cash:G.cash});
  if(G.finHist.length>120)G.finHist.shift();
  if(prop.reviews.length){const recent=prop.reviews.slice(-12);const avgR=recent.reduce((s,r)=>s+r.stars,0)/recent.length;const target=avgR*20;prop.reputation+=(target-prop.reputation)*.12-prop.incidents*.3;prop.reputation=clamp(prop.reputation,0,100);}
  prop.incidents=Math.max(0,prop.incidents-1);
  competitorAI(prop);
  for(const role in prop.staff)prop.staff[role].forEach(s=>{const load=workload(prop);s.morale=clamp(s.morale+(load>1.1?-1.5:.6)+rnd(-.5,.5),20,100);if(s.fatigue)s.fatigue=Math.max(0,s.fatigue*.5-10);});
  prop.rooms.forEach(r=>{if(r.status==='renovation'){r.renoT--;if(r.renoT<=0){r.status='clean';r.cond=100;if(r._renoGain>=26){const qi=QUALITY.findIndex(q=>q.name===r.q.name);if(qi<QUALITY.length-1)r.q=QUALITY[qi+1];}logEvent(prop,'maintenance','Room '+r.id+' reopened after renovation.');feed('✨ Room '+r.id+' reopened after renovation.','pos');}}});
  // maintenance spawn/process (spares shortage slows repairs)
  const cashBefore=G.cash;
  prop.rooms.forEach(r=>{const used=r.status==='occupied'||r.cond<70;if(Math.random()<(used?.05:.015)+(r.cond<55?.04:0))spawnMaintIssue(prop,r);});
  if(prop.rooms.length&&Math.random()<.08)spawnMaintIssue(prop,null);
  processMaintenance(prop);
  prop._maintCostToday=Math.max(0,cashBefore-G.cash);
  // inventory, projects, marketing
  consumeInventory(prop);
  processProjects(prop);
  processMarketing(prop);
  // financing: monthly EMIs + investor dividend
  G._loanDay=(G._loanDay||0)+1;
  if(G._loanDay%30===0&&G.loans.length)payEMIs();
  const net=prop.revYest-prop.expYest;if(net>0&&G.investorShare>0){const div=Math.round(net*G.investorShare);G.cash-=div;}
  // direct boost natural fade handled in processMarketing
  // reset daily flags
  prop.rooms.forEach(r=>{if(r.guest){r.guest.hadBreakfast=false;}});
  G.weather=rollWeather();
  captureAnalytics(prop);buildDailyReport(prop);updateChain();bookingConfidenceDrift(prop);
  prop.revToday=0;prop.expToday=0;
  prop._arrToday=0;prop._depToday=0;prop._compToday=0;prop._satSum=0;prop._satN=0;prop.commToday=0;
  scheduleDay();
  feed('— Day '+G.day+' begins · '+G.weather+' · '+prop.expectedToday+' bookings expected. —','gold');
  if(G.cash<-500000)gameOver();
}

/* ---------------- ANALYTICS (override: + channel mix) ---------------- */
function captureAnalytics(prop){
  const total=prop.rooms.length||1;
  const occR=occupied(prop)/total*100;
  const sold=prop.rooms.filter(r=>r.status==='occupied'&&r.guest);
  const adrV=sold.length?sold.reduce((s,r)=>s+r.guest.price,0)/sold.length:avgPrice(prop);
  const sat=prop._satN?prop._satSum/prop._satN:(prop.analytics.length?prop.analytics[prop.analytics.length-1].sat:70);
  const staffN=Object.values(prop.staff).reduce((s,a)=>s+a.length,0)||1;
  const chTot=Object.values(prop.channelRev).reduce((s,v)=>s+v,0)||1;
  const cm=prop.chCountToday||{},cmTot=Object.values(cm).reduce((s,v)=>s+v,0)||1;
  prop.analytics.push({day:G.day-1,occ:occR,adr:adrV,revpar:adrV*occR/100,rev:prop.revYest,exp:prop.expYest,
    profit:prop.revYest-prop.expYest,cashflow:prop.revYest-prop.expYest,sat,rep:prop.reputation,rating:prop.rating||0,
    complaints:prop._compToday||0,arrivals:prop._arrToday||0,staffProd:occupied(prop)/staffN,maintCost:prop._maintCostToday||0,
    directMix:(cm.direct||0)/cmTot*100,otaMix:(cm.ota||0)/cmTot*100,facUtil:Math.min(100,prop.facilities.length*7)});
  if(prop.analytics.length>500)prop.analytics.shift();
}

/* ---------------- COMPETITOR AI (override: open/close hotels) ---------------- */
function competitorAI(prop){
  ensureIntel(prop);
  prop.comps.forEach(co=>{
    co.cash+=rnd(-.04,.05);
    const gap=(prop.rating||3)-co.rating;let act=null;
    if(Math.random()<.2){const roll=Math.random();
      if(gap>.35&&roll<.4&&co.cash>.5){co.rating=clamp(co.rating+rnd(.04,.12),2.4,4.9);co.cash-=.14;act='renovated rooms';}
      else if(roll<.56){co.priceIdx=clamp(co.priceIdx+(gap>0?-.05:.04),.55,2);act=gap>0?'cut prices':'raised rates';}
      else if(roll<.68){co.strength=clamp((co.strength||1)+.05,.6,1.7);co.cash-=.07;act='hired staff';}
      else if(roll<.78){co.promo=ri(2,5);co.priceIdx=clamp(co.priceIdx-.08,.55,2);act='launched a promo';}
      else if(roll<.86){co.rating=clamp(co.rating+.04,2.4,4.9);co.cash-=.06;act='advertised heavily';}
      else if(roll<.93&&co.cash>1.1){co.rating=clamp(co.rating+.05,2.4,4.9);co.facN=(co.facN||3)+1;co.cash-=.22;act='added a facility';}
      else if(co.cash<.35){co.rating=clamp(co.rating-rnd(.04,.1),2.2,4.9);act='cut back amid losses';}
    }
    if(co.promo){co.promo--;if(co.promo<=0)co.priceIdx=clamp(co.priceIdx+.08,.55,2);}
    co.occ=clamp(co.occ+rnd(-.06,.06),.2,.98);
    if(act){co.lastAct=act;co.lastActDay=G.day;if(knows(co,'rating')||knows(co,'price'))feed('🏨 '+co.name+' '+act+'.','warn');}
  });
  // market entry / exit (rare)
  if(Math.random()<.02&&prop.comps.length<7){const nm=pick(['Skyline','Greenview','Citygate','Pinnacle','Crestwood','Parkside'])+' '+pick(['Hotel','Suites','Residency']);prop.comps.push({name:nm,seg:pick(['Budget','Midscale','Upscale']),rating:rnd(3.4,4.2),priceIdx:rnd(.8,1.2),occ:rnd(.4,.7),facN:ri(2,4),cash:rnd(.8,1.2),strength:1,viz:{}});ensureIntel(prop);logEvent(prop,'competition','New competitor entered the market: '+nm+'.');feed('🏨 New rival opened nearby: '+nm+'.','warn');}
  else if(Math.random()<.012&&prop.comps.length>2){const weak=prop.comps.slice().sort((a,b)=>(a.rating+a.cash)-(b.rating+b.cash))[0];if(weak&&weak.cash<.4){prop.comps=prop.comps.filter(c=>c!==weak);logEvent(prop,'competition',weak.name+' shut down after sustained losses.');feed('🏨 Rival '+weak.name+' closed down.','pos');}}
}

function autoResolveEvent(prop,ev){
  const r=G.autoRules[ev.id];if(!r)return false;
  let idx=r.choice;
  if(r.cond==='occLow'){const occN=occupied(prop)/Math.max(1,prop.rooms.length)*100;idx=(occN<(r.val||50))?r.choice:(ev.ch.length-1);}
  idx=clamp(idx,0,ev.ch.length-1);
  ev.ch[idx].f(prop);
  G.autoLog.unshift({d:G.day,h:G.hour,event:ev.title,choice:ev.ch[idx].t});if(G.autoLog.length>120)G.autoLog.pop();
  logEvent(prop,'service','[Auto] '+ev.title+' — '+ev.ch[idx].t);
  return true;
}
function showEvent(ev,prop){
  if(autoResolveEvent(prop,ev)){renderAll();return;}
  const wasPaused=G.paused;G.autoResume=!wasPaused;setPause(true);

  box.innerHTML=`<div class="mhead"><div class="mic" style="background:${ev.cl}22;color:${ev.cl}">${ev.ic}</div><div><h3>${ev.title}</h3><div class="ms">${ev.sub} · <span class="gold">decision required</span></div></div></div>
    <div class="mbody"><div class="desc">${ev.desc}</div>${ev.ch.map((c,i)=>`<button class="choice" data-i="${i}"><div class="ct">${c.t}</div><div class="cc">${c.c}</div></button>`).join('')}

    <div class="wrapf">${ev.ch.map((c,i)=>`<button class="tag" onclick="autoRuleFromEvent('${ev.id}',${i})">Always: ${c.t.length>22?c.t.slice(0,20)+'…':c.t}</button>`).join('')}</div></div>`;
  $('#modal').style.display='flex';$('#modal').onclick=null;
  $$('.choice',box).forEach(b=>b.onclick=()=>{
    const ci=+b.dataset.i;ev.ch[ci].f(prop);

}
window.autoRuleFromEvent=(id,choice)=>{G.autoRules[id]={choice,cond:'always'};const ev=EVENTS.find(e=>e.id===id);if(ev){ev.ch[choice].f(P());G.autoLog.unshift({d:G.day,h:G.hour,event:ev.title,choice:ev.ch[choice].t});logEvent(P(),'decision','Automation rule set: '+ev.title+' → always '+ev.ch[choice].t);}$('#modal').style.display='none';$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').style.display='none';};if(G.autoResume)setPause(false);toast('Automation rule saved.','pos');renderAll();};
window.setAutoRule=(id,choice,cond,val)=>{if(choice===null||choice==='null'){delete G.autoRules[id];}else{G.autoRules[id]={choice:+choice,cond:cond||'always',val:+val||50};}logEvent(P(),'decision','Automation updated for '+(EVENTS.find(e=>e.id===id)||{}).title);renderTab();};

  let payroll=0;for(const role in p.staff)p.staff[role].forEach(s=>payroll+=s.sal);
  const utilities=p.rooms.length*250*30,maintC=p.rooms.reduce((s,r)=>s+ROOMTYPES[r.type].dmaint,0)*30,facC=p.facilities.reduce((s,f)=>s+FACILITIES[f].daily,0)*30;
  const max=Math.max(1,...src.map(d=>Math.max(d.rev,d.exp)));

    ${ovCard('Debt',cr(debt),'credit '+creditRating(),' ')}
    ${ovCard('30d Net',(totRev-totExp>=0?'+':'')+cr(totRev-totExp),'profit',' ')}
    ${ovCard('30d Forecast',cr(forecast),'after EMIs',' ')}
  </div>
  <div class="split">
    <div class="card"><h3>Revenue vs Expenses (${src.length} days)</h3>
      <div style="display:flex;align-items:flex-end;gap:3px;height:170px;margin-top:8px">
        ${src.map(d=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1px" title="D${d.day}: +${cr0(d.rev)} / -${cr0(d.exp)}"><div style="height:${d.rev/max*140}px;background:#46c06a;border-radius:2px 2px 0 0;min-height:1px"></div><div style="height:${d.exp/max*140}px;background:#ef6a6a55;border-radius:0 0 2px 2px;min-height:1px"></div></div>`).join('')||'<div class="muted sm">Run a few days to see trends.</div>'}
      </div>
      <div class="flex" style="gap:14px;margin-top:8px"><span class="sm"><span style="color:#46c06a">■</span> Revenue</span><span class="sm"><span style="color:#ef6a6a">■</span> Expenses</span></div>
    </div>
    <div class="card"><h3>Financing</h3>
      <div class="muted sm" style="margin-bottom:6px">Credit rating <b>${creditRating()}</b> · borrowing capacity <b>${cr(maxLoan())}</b></div>
      <div class="wrapf" style="margin-bottom:8px">
        <button class="btn" onclick="takeLoan(2000000,24)">Loan ₹20L / 24mo</button>
        <button class="btn" onclick="takeLoan(5000000,36)">Loan ₹50L / 36mo</button>
        <button class="btn" onclick="takeLoan(15000000,60)">Loan ₹1.5Cr / 60mo</button>
        <button class="btn" onclick="investorRaise(10000000)">Investor ₹1Cr</button>
      </div>
      ${G.loans.length?G.loans.map(l=>`<div class="row"><span class="lab">Loan ${cr0(l.principal)} @ ${(l.annual*100).toFixed(1)}%</span><span class="val">EMI ${cr0(l.emi)} · ${l.termLeft}mo · bal ${cr0(l.balance)}</span></div>`).join(''):'<div class="muted sm">No active loans.</div>'}
      ${G.investorShare>0?`<div class="row"><span class="lab">Investor profit share</span><span class="val">${Math.round(G.investorShare*100)}%</span></div>`:''}
      <div class="muted sm" style="margin-top:6px">EMIs auto-deduct monthly. Large expansions are best financed.</div>
    </div>
  </div>
  <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Channel</th><th>Bookings</th><th>Cancel %</th><th>Avg Sat</th><th>Repeat %</th><th>Net Revenue</th><th>Comm</th></tr></thead><tbody>
    ${CH_ORDER.map(k=>{const st=p.channelStats[k];if(!st||!st.bookings)return '';const cr_=Math.round(st.cancels/(st.bookings+st.cancels)*100);const sat=st.satN?Math.round(st.satSum/st.satN):'—';const rep=Math.round(st.repeat/st.bookings*100);return `<tr><td class="b">${CHANNELS[k].ic} ${CHANNELS[k].name}</td><td>${st.bookings}</td><td>${cr_}%</td><td>${sat}${sat==='—'?'':'%'}</td><td>${rep}%</td><td>${cr(p.channelRev[k]||0)}</td><td>${Math.round(CHANNELS[k].comm*100)}%</td></tr>`;}).join('')||'<tr><td colspan="7" class="muted">Channel performance appears after guests check out.</td></tr>'}
  </tbody></table></div>
  <div class="cards cols-2" style="margin-top:12px">
    <div class="card"><h3>Profit &amp; Loss (30d)</h3>${row('Room & ancillary revenue',cr(totRev))}${row('Operating expenses',cr(totExp))}${row('Interest (EMI/mo)',cr(emiTot))}<div class="row"><span class="b">Net profit</span><span class="b ${totRev-totExp>=0?'up':'down'}">${cr(totRev-totExp)}</span></div></div>
    <div class="card"><h3>Balance Sheet</h3>${row('Estimated assets',cr(assetValue()))}${row('Cash',cr(G.cash))}${row('Total debt',cr(debt))}<div class="row"><span class="b">Net worth (est)</span><span class="b">${cr(assetValue()+G.cash-debt)}</span></div></div>

    <div class="row" style="border-top:1px solid var(--line2);margin-top:4px"><span class="b">Total monthly burn</span><span class="b">${cr(payroll+utilities+maintC+facC+emiTot)}</span></div>
  </div>`;
}

/* =======================================================================
   AATITHYA v5 — Phase 6: Research-Driven Realism.
   Implements a unified demand engine, derived hotel class, credit-based
   housekeeping capacity, a weighted-touchpoint satisfaction integrator
   (price-fairness + memory + service-recovery paradox), a lagged
   training->skill flywheel, a slow macro layer (inflation/salary/air
   traffic/supply + GST fence), and a USALI departmental P&L. Uses
   function-wrapping to extend without rewriting. Plus a full mobile layout.
   ======================================================================= */

/* ---------------- HELPERS: CLASS, GST, FESTIVAL, DEMAND ---------------- */
function hotelClass(prop){
  const adr=avgPrice(prop)||0;
  const facN=prop.facilities.length;
  const fq=prop.rooms.length?prop.rooms.reduce((s,r)=>s+(r.q&&r.q.q||0),0)/prop.rooms.length:0;
  let s=clamp(adr/12000,0,1)*40 + clamp(facN/10,0,1)*30 + clamp(fq/18,0,1)*30;
  if(s<25)return {k:'budget',name:'Budget',exp:0.90,elast:1.40,foodCost:.30,staffPerRoom:.5,w:{clean:.28,service:.16,value:.24,location:.10,comfort:.10,fnb:.06,tech:.06}};
  if(s<50)return {k:'midscale',name:'Midscale',exp:1.00,elast:1.10,foodCost:.32,staffPerRoom:1.0,w:{clean:.25,service:.20,value:.20,location:.11,comfort:.10,fnb:.08,tech:.06}};
  if(s<75)return {k:'upscale',name:'Upscale',exp:1.12,elast:.85,foodCost:.33,staffPerRoom:1.6,w:{clean:.24,service:.23,value:.16,location:.12,comfort:.11,fnb:.09,tech:.05}};
  return {k:'luxury',name:'Luxury',exp:1.25,elast:.70,foodCost:.34,staffPerRoom:2.5,w:{clean:.23,service:.25,value:.14,location:.12,comfort:.12,fnb:.09,tech:.05}};
}
function gstRate(rate){const m=G.macro||{};return rate>(m.gstFence||7500)?(m.gstStd||.18):(m.gstLow||.05);}
function festivalMultiplier(){
  const doy=((G.day-1)%360), month=Math.floor(doy/30)+1;
  let m=1;
  if([10,11,12,1,2].includes(month))m*=1.15;                 // winter leisure + wedding season
  [315,300,250,75].forEach(fd=>{const dist=Math.min(Math.abs(doy-fd),360-Math.abs(doy-fd));if(dist<4)m*=1.5-dist*0.1;}); // Diwali/Dussehra/Eid/Holi spikes
  return m;
}
function computeDemand(prop){
  const seas=seasonFactor(G.day,prop.city,prop.loc), fest=festivalMultiplier(), wthr=weatherDemand();
  const rep=repFactor(prop), comp=compFactor(prop), weekend=(G.dow>=5);
  const m=G.macro||{airTraffic:1,supply:1};
  const macro=(m.airTraffic||1)/(m.supply||1);
  const base=prop.city.dem*prop.loc.dem;
  let d=base*seas*fest*wthr*rep*comp;
  d*=(1+facBoost(prop,'dem'));
  d*=(1+(G.chain?G.chain.brand:0)/100*.5);
  d*=(1+(prop.awareness||0)/100*.3);
  d*=macro;
  d*=weekend?(1+prop.city.tour*.25):(1+prop.city.biz*.12);
  d*=G.D.demM;
  prop._demandBreak={base,season:seas,festival:fest,weather:wthr,reputation:rep,competition:comp,macro,total:clamp(d,.15,2.6)};
  return clamp(d,.15,2.6);
}

/* ---------------- HOUSEKEEPING CAPACITY (credit-based, override) ---------------- */
function cleanCapacity(prop){
  const hk=(prop.staff.housekeeping||[]);if(!hk.length)return 0;
  let perHour=0;
  hk.forEach(a=>{const rooms8=12+(a.skill/100)*6;perHour+=rooms8/8*(a.morale/100)*(1-(a.fatigue||0)/200);});
  if(prop.invShort&&(prop.invShort.linen||prop.invShort.cleaning||prop.invShort.amenities))perHour*=.6;
  return perHour;
}

/* ---------------- OPERATING COSTS (energy + macro, override) ---------------- */
function accrueHourlyCost(prop){
  let payroll=0;for(const role in prop.staff)prop.staff[role].forEach(s=>payroll+=s.sal);
  const m=G.macro||{}, sIdx=m.salary||1, inf=1+(m.inflation||0);
  const util=prop.rooms.length*250*inf;
  const energy=occupied(prop)*70*inf;                    // energy per occupied room/day (research: ~25kWh/room)
  const maint=prop.rooms.reduce((s,r)=>s+ROOMTYPES[r.type].dmaint,0)*inf;
  const fac=prop.facilities.reduce((s,f)=>s+FACILITIES[f].daily,0)*inf;
  const hourly=(payroll*sIdx/30 + util + energy + maint + fac)/24;
  G.cash-=hourly; prop.expToday+=hourly; prop._opExToday=(prop._opExToday||0)+hourly;
}

/* ---------------- DAY SCHEDULING (demand engine + GST + class elasticity, override) ---------------- */
function scheduleDay(){
  const prop=P();
  buildReturnPool();
  G.seasonNow=seasonFactor(G.day,prop.city,prop.loc);
  prop.channelStats=prop.channelStats||{};
  const total=prop.rooms.length||1;
  const demandIdx=computeDemand(prop);
  let attempts=Math.round(total*1.6*demandIdx*rnd(.8,1.2));
  attempts=clamp(attempts,prop.rooms.length?1:0,total*3);
  const cls=hotelClass(prop);
  const arrivals=[],chCount={};const overbook=prop.policies.overbook||0;let booked=0;
  for(let i=0;i<attempts;i++){
    const g=genGuest(prop);
    g.nights=clamp(ri(GUEST_TYPES[g.type].nights[0],GUEST_TYPES[g.type].nights[1]),prop.policies.minStay||1,prop.policies.maxStay||30);
    let cand=prop.rooms.filter(r=>r.status==='clean'&&priceOK(prop,r,g)&&!arrivals.find(a=>a.roomId===r.id));
    if(!cand.length){if(overbook>0&&booked<total+overbook){cand=prop.rooms.filter(r=>!arrivals.find(a=>a.roomId===r.id)&&priceOK(prop,r,g));}if(!cand.length)continue;}
    if(g.returning&&g.favRT){const same=cand.filter(r=>r.type===g.favRT);if(same.length)cand=same;}
    cand.sort((a,b)=>scoreFor(g,b)-scoreFor(g,a));
    const room=cand[0];
    const rate=prop.prices[room.type];
    let willing=bookWillingness(prop,room,g);
    // GST fence + class price-elasticity (guests feel the tax-inclusive total)
    const gst=gstRate(rate), tot=rate*(1+gst);
    willing*=clamp(Math.pow((g.budget*1.15)/tot,cls.elast),0.35,1.35);
    if(prop.policies.cancelType==='nonref')willing*=.9;
    if(prop.policies.payment==='full')willing*=.92;
    if(prop.policies.cancelType==='flexible')willing*=1.04;
    if(g.loyalty)willing*=1.08;
    const st=prop.channelStats[g.channel]=prop.channelStats[g.channel]||{bookings:0,cancels:0,satSum:0,satN:0,revenue:0,repeat:0};
    if(Math.random()<willing){
      g.roomId=room.id;g.arrHour=sampleHour(prop);
      g.depDay=G.day+g.nights;g.depHour=clamp((prop.policies.checkoutTime||11)+ri(-1,1),6,14);
      g.price=rate;
      if(g.loyalty){const L=LOYALTY.find(x=>x.name===g.loyalty);if(L)g.price=Math.round(g.price*(1-L.disc));}
      const depFrac=prop.policies.payment==='full'?1:prop.policies.payment==='partial'?.3:0;
      g.deposit=Math.round(g.price*g.nights*depFrac);g.bookingAmt=g.price*g.nights;
      const cancelP=CHANNELS[g.channel].cancel*(prop.policies.cancelType==='nonref'?.5:prop.policies.cancelType==='flexible'?1.15:1);
      if(Math.random()<cancelP){
        prop.cancellations=(prop.cancellations||0)+1;st.cancels++;
        const keepFr=prop.policies.cancelType==='flexible'?0:prop.policies.cancelType==='partial'?.5:1;
        if(keepFr>0&&g.deposit>0){const keep=Math.round(g.deposit*keepFr);G.cash+=keep;prop.revToday+=keep;logEvent(prop,'finance',g.name+' cancelled — deposit '+cr0(keep)+' retained.');}
        else logEvent(prop,'booking',g.name+' cancelled (refundable).');
        continue;
      }
      st.bookings++;if(g.returning)st.repeat++;
      (prop.marketing.campaigns||[]).forEach(cm=>{const M=MKT[cm.type];if(M&&((M.ch&&M.ch===g.channel)||(M.seg&&M.seg===g.type)))cm.bookings=(cm.bookings||0)+1;});
      g.checkedIn=false;arrivals.push(g);booked++;chCount[g.channel]=(chCount[g.channel]||0)+1;
    }
  }
  G.pendingArrivals=arrivals;prop.expectedToday=arrivals.length;prop.chCountToday=chCount;
  ensureIntel(prop);
}

/* ---------------- SATISFACTION INTEGRATOR (weighted touchpoints, override) ---------------- */
function finalizeStay(prop,room,g){
  const gt=GUEST_TYPES[g.type],cls=hotelClass(prop);
  const q=roomQ(room);
  const rate=g.price,ref=marketRate(prop,room.type)||rate,gst=gstRate(rate),tot=rate*(1+gst),refTot=ref*(1+gst);
  const hkStrain=prop.hkStrain||0;
  // --- component scores (0-100) ---
  let cleanScore=clamp(88 - hkStrain*45 + (avgSkill(prop,'housekeeping')-65)*.25 + ((prop.hk&&prop.hk.inspection)?6:0),0,100);
  if(prop.invShort&&(prop.invShort.amenities||prop.invShort.linen||prop.invShort.cleaning))cleanScore=clamp(cleanScore-25,0,100);
  const fd=(prop.staff.frontdesk||[]);const fdFat=fd.length?fd.reduce((a,s)=>a+(s.fatigue||0),0)/fd.length:60;
  let serviceScore=clamp(62+(avgSkill(prop,'frontdesk')-65)*.6 - fdFat*.12 - (g.queued?12:0),0,100);
  let valueScore=clamp(82 - clamp(tot/refTot-1,-.4,1.4)*60,0,100);
  let locScore=clamp(48+prop.loc.conv*45,0,100);
  let comfortScore=clamp(q - (room.cond<70?(70-room.cond)*.8:0) - clamp(prop.loc.noise-(room.comp&&room.comp.soundproof?.3:0)-g.quiet,0,1)*18,0,100);
  let fnbScore=(prop.facilities.includes('restaurant')||prop.facilities.includes('breakfast'))?clamp(fnbQuality(prop),0,100):58;
  let techScore=clamp((prop.facilities.includes('wifi')||(room.comp&&room.comp.fastwifi))?82:42,0,100);
  const wnt=gt.prefer.filter(f=>prop.facilities.includes(f)).length;
  const w=cls.w;
  let experience=cleanScore*w.clean+serviceScore*w.service+valueScore*w.value+locScore*w.location+comfortScore*w.comfort+fnbScore*w.fnb+techScore*w.tech;
  experience+=wnt*1.2+facBoost(prop,'sat')*.1;
  if(prop.maintBacklog&&prop.maintBacklog.some(is=>is.roomId===room.id))experience-=6;
  // --- expectation (class, price-fairness, memory) ---
  let expectation=64*cls.exp*(g.expM||1);
  if(g.loyalty)expectation+=(g.prior||0)*1.2;
  expectation+=clamp(tot/refTot-1,0,1.2)*14;                         // pay more, expect more
  if(g.returning){const e=G.guestDB[g.name+'|'+g.type];if(e)expectation+=clamp(e.avgSat-70,-8,12)*.3;}
  // --- satisfaction ---
  let sat=65+(experience-expectation);
  if((g.complaints||0)>0){ if((prop.policies.generosity||.5)>.55&&avgSkill(prop,'frontdesk')>60){sat+=6;g.recovered=true;} else sat-=4; } // service-recovery paradox
  g.sat=clamp(sat,0,100);
  prop._satSum=(prop._satSum||0)+g.sat;prop._satN=(prop._satN||0)+1;   // feed analytics + daily-report satisfaction
  if(g.sat<45)g.complaints=(g.complaints||0)+1;
  g.satComponents={clean:cleanScore,service:serviceScore,value:valueScore,location:locScore,comfort:comfortScore,fnb:fnbScore,tech:techScore,experience:Math.round(experience),expectation:Math.round(expectation)};
  if(!prop.compAvg)prop.compAvg={};['clean','service','value','location','comfort','fnb','tech'].forEach(k=>{prop.compAvg[k]=prop.compAvg[k]==null?g.satComponents[k]:prop.compAvg[k]*.9+g.satComponents[k]*.1;});
  // --- ancillary revenue + USALI department tagging ---
  let extra=0,fnbExtra=0,otherExtra=0;
  prop.facilities.forEach(f=>{if(FACILITIES[f].rev&&Math.random()<.5){const v=rnd(300,1500)*gt.budgetF;extra+=v;otherExtra+=v;}});
  if((prop.facilities.includes('restaurant')||prop.facilities.includes('breakfast'))&&!(prop.invShort&&(prop.invShort.foodstock||prop.invShort.beverages))){
    const b=rnd(120,420)*g.nights,l=prop.facilities.includes('restaurant')?rnd(0,500)*g.nights:0,dn=prop.facilities.includes('restaurant')?rnd(150,700)*g.nights:0;
    prop.fnbRev.breakfast+=b;prop.fnbRev.lunch+=l;prop.fnbRev.dinner+=dn;const fv=b+l+dn;extra+=fv;fnbExtra+=fv;
  }
  if(prop.policies.laundry==='paid'&&prop.facilities.includes('laundry')&&Math.random()<.4){const v=rnd(200,700);extra+=v;otherExtra+=v;}
  if(prop.policies.roomsvc24&&prop.facilities.includes('roomsvc')&&Math.random()<.3){const v=rnd(250,900);extra+=v;otherExtra+=v;}
  g.extraRev=Math.round(extra);
  prop._deptDay=prop._deptDay||{fnb:0,other:0};prop._deptDay.fnb+=fnbExtra;prop._deptDay.other+=otherExtra+(g.extraPark||0);
  g.aspects=buildAspects(prop,room,g,cleanScore);
  const st=prop.channelStats[g.channel];if(st){st.satSum=(st.satSum||0)+g.sat;st.satN=(st.satN||0)+1;st.revenue=(st.revenue||0)+(rate*g.nights*(1-(CHANNELS[g.channel].comm||0)));}
  const reviewChance=g.reviewT*(.4+Math.abs(g.sat-65)/65)*G.D.harsh*.9;
  if(Math.random()<clamp(reviewChance,.05,.95))leaveReview(prop,g,room);
  feed((g.sat>75?'😊':g.sat>50?'😐':'😞')+' '+g.name+' checked out — '+Math.round(g.sat)+'% ('+cls.name+' expectations).',g.sat>70?'pos':g.sat>45?'info':'neg');
}

/* ---------------- GUEST ROUTINES (dept-tagged spend, override) ---------------- */
function guestRoutine(prop,room,g){
  const h=G.hour,has=f=>prop.facilities.includes(f),weekend=(G.dow>=5),rainy=(G.weather==='Rainy');
  if(g.out){ if(h>=18&&Math.random()<.4){g.out=false;g.act='returned';} return; }
  if(Math.random()>.5)return;
  const spend=(v,cat)=>{const a=Math.round(v);g.spendIn+=a;prop.revToday+=a;G.cash+=a;G.totalRevenue+=a;prop.lifetimeRev+=a;prop._deptDay=prop._deptDay||{fnb:0,other:0};if(cat==='fnb')prop._deptDay.fnb+=a;else prop._deptDay.other+=a;};
  if(h>=7&&h<=10&&!g.hadBreakfast&&(has('breakfast')||has('restaurant'))){g.hadBreakfast=true;g.act='breakfast';if(prop.policies.breakfast!=='included')spend(rnd(120,360),'fnb');routineFeed(prop,g,'is having breakfast');return;}
  if(h>=9&&h<=16){const biz=(g.type==='business'||g.type==='corporate');if((biz&&!weekend&&Math.random()<.5)||(['tourist','family','wedding'].includes(g.type)&&!rainy&&Math.random()<.5)){g.out=true;g.act=biz?'at a meeting':'out sightseeing';routineFeed(prop,g,biz?'left for a meeting':'left to explore '+prop.city.name);return;}}
  if(h>=12&&h<=14&&has('restaurant')&&Math.random()<.4){g.act='lunch';spend(rnd(200,520),'fnb');return;}
  if(h>=19&&h<=22&&has('restaurant')&&Math.random()<.5){g.act='dinner';spend(rnd(300,800),'fnb');routineFeed(prop,g,'is dining in the restaurant');return;}
  if(has('gym')&&['business','premium','corporate','vip'].includes(g.type)&&Math.random()<.2){g.act='gym';g.sat=clamp(g.sat+.5,0,100);return;}
  if(has('spa')&&Math.random()<.12){g.act='spa';spend(rnd(800,2500),'other');g.sat=clamp(g.sat+1,0,100);routineFeed(prop,g,'booked the spa');return;}
  if(has('pool')&&(rainy?false:Math.random()<.15)){g.act='pool';g.sat=clamp(g.sat+.5,0,100);return;}
  if(has('roomsvc')&&Math.random()<.18){g.act='room service';spend(rnd(250,900),'other');return;}
  if(has('laundry')&&(g.type==='longstay'||g.type==='business')&&Math.random()<.12){g.act='laundry';if(prop.policies.laundry==='paid')spend(rnd(200,600),'other');return;}
}

/* ---------------- WRAP: dayRollover (USALI, hkStrain, training ramp, macro drift) ---------------- */
function _v5PreRoll(prop){
  // USALI departmental view for the day just ended (reporting only; does not alter cash)
  const dd=prop._deptDay||{fnb:0,other:0};
  const cls=hotelClass(prop);
  const roomsRev=Math.max(0,(prop.revToday||0)-dd.fnb-dd.other);
  const gop=(prop.revToday||0)-(prop._opExToday||0);        // GOP excludes capex/financing/training
  prop._usaliToday={roomsRev:Math.round(roomsRev),fnbRev:Math.round(dd.fnb),otherRev:Math.round(dd.other),
    roomsCost:Math.round(roomsRev*.28),fnbCost:Math.round(dd.fnb*(cls.foodCost+0.20)),
    gop:Math.round(gop),ffe:Math.round((prop.revToday||0)*.04),goppar:prop.rooms.length?Math.round(gop/prop.rooms.length):0};
  prop._gopparToday=prop._usaliToday.goppar;
  // hkStrain: cleaning demand (credits) vs daily capacity — powers rushed-clean quality loss
  const demandCredits=(prop._depToday||0)*2+occupied(prop)*1;
  const capDaily=cleanCapacity(prop)*24;
  prop.hkStrain=clamp(capDaily>0?(demandCredits-capDaily)/Math.max(1,capDaily):(demandCredits>0?1:0),0,1);
  // training ramp (skill rises gradually over weeks -> service -> reviews -> demand)
  if(prop.trainDays>0&&prop.trainPending>0){const step=prop.trainPending/prop.trainDays;Object.values(prop.staff).flat().forEach(s=>s.skill=clamp(s.skill+step*0.15,0,99));prop.trainPending-=step;prop.trainDays--;}
  // macro drift (monthly) — inflation, salary growth, air traffic, competitive supply
  if(G.day%30===0){const m=G.macro;m.inflation=clamp(m.inflation+rnd(-0.0005,0.0015),0,.12);m.salary*=1+rnd(0,0.003);m.airTraffic=clamp(m.airTraffic*(1+rnd(-0.008,0.014)),.7,1.6);m.supply*=1+rnd(0,0.004);}
  prop._deptDay={fnb:0,other:0};prop._opExToday=0;
}
const _v5Roll=dayRollover;
dayRollover=function(){const prop=P();_v5PreRoll(prop);_v5Roll();};

/* ---------------- GUEST FACILITY-USAGE TRACKING (override guestRoutine) ---------------- */
function guestRoutine(prop,room,g){
  const h=G.hour,has=f=>prop.facilities.includes(f),weekend=(G.dow>=5),rainy=(G.weather==='Rainy');
  g.used=g.used||{};
  if(g.out){ if(h>=18&&Math.random()<.4){g.out=false;g.act='returned';} return; }
  if(Math.random()>.5)return;
  const spend=(v,cat)=>{const a=Math.round(v);g.spendIn+=a;prop.revToday+=a;G.cash+=a;G.totalRevenue+=a;prop.lifetimeRev+=a;prop._deptDay=prop._deptDay||{fnb:0,other:0};if(cat==='fnb')prop._deptDay.fnb+=a;else prop._deptDay.other+=a;};
  const mark=k=>{g.used[k]=1;};
  if(h>=7&&h<=10&&!g.hadBreakfast&&(has('breakfast')||has('restaurant'))){g.hadBreakfast=true;g.act='breakfast';mark('breakfast');if(prop.policies.breakfast!=='included')spend(rnd(120,360),'fnb');routineFeed(prop,g,'is having breakfast');return;}
  if(h>=9&&h<=16){const biz=(g.type==='business'||g.type==='corporate');if((biz&&!weekend&&Math.random()<.5)||(['tourist','family','wedding'].includes(g.type)&&!rainy&&Math.random()<.5)){g.out=true;g.act=biz?'at a meeting':'out sightseeing';routineFeed(prop,g,biz?'left for a meeting':'left to explore '+prop.city.name);return;}}
  if(h>=12&&h<=14&&has('restaurant')&&Math.random()<.4){g.act='lunch';mark('restaurant');spend(rnd(200,520),'fnb');return;}
  if(h>=19&&h<=22&&has('restaurant')&&Math.random()<.5){g.act='dinner';mark('restaurant');spend(rnd(300,800),'fnb');routineFeed(prop,g,'is dining in the restaurant');return;}
  if(has('gym')&&['business','premium','corporate','vip'].includes(g.type)&&Math.random()<.2){g.act='gym';mark('gym');g.sat=clamp(g.sat+.5,0,100);return;}
  if(has('spa')&&Math.random()<.12){g.act='spa';mark('spa');spend(rnd(800,2500),'other');g.sat=clamp(g.sat+1,0,100);routineFeed(prop,g,'booked the spa');return;}
  if(has('pool')&&(rainy?false:Math.random()<.15)){g.act='pool';mark('pool');g.sat=clamp(g.sat+.5,0,100);return;}
  if(has('roomsvc')&&Math.random()<.18){g.act='room service';mark('roomsvc');spend(rnd(250,900),'other');return;}
  if(has('laundry')&&(g.type==='longstay'||g.type==='business')&&Math.random()<.12){g.act='laundry';mark('laundry');if(prop.policies.laundry==='paid')spend(rnd(200,600),'other');return;}
}

/* component phrasings (positive / negative), used only when consistent with the star band */
const REV_POS={clean:"the room was spotlessly clean",service:"the staff were warm and genuinely helpful",value:"it was excellent value for money",location:"the location was superb and convenient",comfort:"the room was comfortable and restful",fnb:"the food was delicious",tech:"the Wi-Fi was fast and reliable"};
const REV_NEG={clean:"the room simply wasn't clean enough",service:"the front desk was slow and unhelpful",value:"it felt overpriced for what you get",location:"the location was inconvenient",comfort:"the room was tired and uncomfortable",fnb:"the food was disappointing",tech:"the Wi-Fi was unreliable"};

/* ---------------- REVIEW GENERATOR (override) ---------------- */
function reviewText(stars,g,room,prop){
  const C=g.satComponents||{}, U=g.used||{};
  const keys=Object.keys(REV_POS).filter(k=>C[k]!=null);
  const sorted=keys.slice().sort((a,b)=>C[b]-C[a]);
  const best=sorted.slice(0,2), worst=sorted.slice(-2).reverse();
  // facility clauses strictly from what the guest actually used
  const facPos=[],facNeg=[];
  if(U.breakfast||g.hadBreakfast)facPos.push("breakfast was a lovely start to the day");
  if(U.restaurant)facPos.push("the in-house restaurant was a real highlight");
  if(U.spa)facPos.push("the spa was pure indulgence");
  if(U.pool)facPos.push("the pool was a wonderful way to unwind");
  if(U.gym)facPos.push("the gym was well equipped");
  if(U.roomsvc)facPos.push("room service was prompt and courteous");
  if(g.vehicle&&g.parked&&g.parked!=='none')facPos.push("the on-site parking was very convenient");
  if(g.vehicle&&g.parked==='none')facNeg.push("there was nowhere to park when I arrived");
  if(g.queued)facNeg.push("check-in took far too long");
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  const title=pick(REV_TITLES[stars]||REV_TITLES[3]);
  let body=pick(REV_BODIES[stars]||REV_BODIES[3]);
  const add=[];
  if(stars>=5){
    best.forEach(k=>{if(C[k]>=60&&Math.random()<.7)add.push(REV_POS[k]);});
    facPos.slice(0,2).forEach(f=>{if(Math.random()<.7)add.push(f);});
  }else if(stars===4){
    best.forEach(k=>{if(C[k]>=58&&Math.random()<.65)add.push(REV_POS[k]);});
    facPos.slice(0,1).forEach(f=>{if(Math.random()<.6)add.push(f);});
    if(Math.random()<.22&&worst[0]&&C[worst[0]]<58)add.push("the only small letdown was that "+REV_NEG[worst[0]]);
  }else if(stars===3){
    if(best[0]&&C[best[0]]>=56)add.push(REV_POS[best[0]]);
    if(worst[0]&&C[worst[0]]<56)add.push("that said, "+REV_NEG[worst[0]]);
    if(facPos[0]&&Math.random()<.4)add.push(facPos[0]);
  }else if(stars===2){
    worst.forEach(k=>{if(C[k]<58&&Math.random()<.75)add.push(REV_NEG[k]);});
    facNeg.slice(0,1).forEach(f=>add.push(f));
    if(best[0]&&C[best[0]]>=62&&Math.random()<.35)add.push("on the plus side, "+REV_POS[best[0]]);
  }else{
    worst.forEach(k=>{if(C[k]<60&&Math.random()<.8)add.push(REV_NEG[k]);});
    facNeg.slice(0,2).forEach(f=>add.push(f));
  }
  const uniq=[];add.forEach(x=>{if(x&&uniq.indexOf(x)<0)uniq.push(x);});
  let sentence=body;
  if(uniq.length)sentence+=" "+cap(uniq.slice(0,3).join("; "))+".";
  if(g.returning&&Math.random()<.45)sentence="A return visit — "+sentence.charAt(0).toLowerCase()+sentence.slice(1);
  if(g.upgraded&&stars>=4&&Math.random()<.5)sentence+=" The complimentary upgrade was a kind touch.";
  if(g.recovered&&stars>=3&&Math.random()<.5)sentence+=" A small issue was sorted out quickly and graciously.";
  return {title,body:sentence};
}

const DEPTS={

 restaurant:{name:'Restaurant',ic:'🍽️',base:650,costUse:200,sat:6,strat:true,external:true,meal:true},

 spa       :{name:'Spa & Wellness',ic:'💆',base:1800,costUse:600,sat:6,external:true},
 laundry   :{name:'Laundry',ic:'🧺',base:420,costUse:130,sat:3,laundry:true,external:false},
 traveldesk:{name:'Travel Desk',ic:'🧭',base:800,costUse:160,sat:3,defComp:true,external:false},

function defaultDept(key){const d=DEPTS[key];return {mode:'manager',service:d.defComp?'comp':'paid',pricing:'standard',strategy:'balanced',express:false,outsource:false,machines:0,daily:{rev:0,cost:0,profit:0,cust:0,util:0,sat:0},mRev:0,mCost:0,mProfit:0,mCust:0,mDays:0,pRev:null,pCost:null,pProfit:null,pCust:null};}
function deptPrice(prop,key){const d=DEPTS[key],st=(prop.dept||{})[key];if(!st||st.service==='comp')return 0;
  const clsK=hotelClass(prop).k;const clsMult={budget:.8,midscale:1,upscale:1.3,luxury:1.7}[clsK]||1;
  const preMult={budget:.75,standard:1,premium:1.45}[st.pricing]||1;
  return Math.round(d.base*(prop.city.spend||1)*(prop.loc.rate||1)*clsMult*preMult/10)*10;}
function deptCapacity(prop,key){
  if(key==='restaurant')return 30+(prop.staff.fnb||[]).length*22;
  if(key==='spa')return 5+(prop.staff.fnb||[]).length*3;
  if(key==='banquet')return 2;if(key==='conf')return 4;
  if(key==='laundry')return 8+(prop.staff.housekeeping||[]).length*4+((prop.dept.laundry&&prop.dept.laundry.machines)||0)*6;
  return Math.max(6,Math.round(10+occupied(prop)*.6));}
function ensureDepts(prop){if(!prop.dept)prop.dept={};Object.keys(DEPTS).forEach(k=>{if(prop.facilities.includes(k)&&!prop.dept[k])prop.dept[k]=defaultDept(k);});}

/* ---------------- LIVING FRONT OFFICE ---------------- */
function runFrontOffice(prop){
  const fd=(prop.staff.frontdesk||[]);
  const arr=prop.expectedToday||0;
  const perRecep=fd.reduce((s,r)=>s+(2+(r.skill/100)*2)*(1-(r.fatigue||0)/220)*(1-(r.burnout||0)/300),0);
  const dailyCap=Math.max(0,perRecep*10);
  const occ=occupied(prop)/Math.max(1,prop.rooms.length);
  const dirtyFrac=prop.rooms.length?prop.rooms.filter(r=>r.status==='dirty').length/prop.rooms.length:0;
  const complexity=1+occ*.3+dirtyFrac*.4;
  const effArr=arr*complexity;
  const avgWait=fd.length?clamp((effArr-dailyCap)/Math.max(1,fd.length)*4,0,45):45;
  const avgFriend=fd.length?Math.round(fd.reduce((s,r)=>s+(r.friendliness||60),0)/fd.length):0;
  fd.forEach(r=>{const overloaded=effArr>dailyCap;r.burnout=clamp((r.burnout||0)+(overloaded?1.3:-0.8),0,100);});
  prop.fo={recep:fd.length,cap:Math.round(dailyCap),arrivals:arr,effArr:Math.round(effArr),avgWait:Math.round(avgWait),
    bottleneck:effArr>dailyCap*1.05,throughput:Math.min(arr,Math.round(dailyCap)),
    avgFriend,avgStress:fd.length?Math.round(fd.reduce((s,r)=>s+(r.burnout||0),0)/fd.length):0,readiness:Math.round((1-dirtyFrac)*100)};
}

/* checkInGuest — friendliness + experience + VIP + stress (override) */
function checkInGuest(prop,a,waiting){
  let room=prop.rooms.find(r=>r.id===a.roomId);
  if(!(room&&room.status==='clean')){
    const alt=prop.rooms.find(r=>r.status==='clean');
    if(alt){room=alt;a.roomId=alt.id;a.sat-=6;feed('⚠️ Room not ready — '+a.name+' moved to Room '+alt.id+'.','warn');}
    else{a.checkedIn='lost';prop.incidents++;a.sat=20;prop._compToday=(prop._compToday||0)+1;
      feed('❌ No clean room for '+a.name+' — walked out.','neg');prop.reputation=clamp(prop.reputation-1.2,0,100);
      logEvent(prop,'service','Walkout: no clean room for '+a.name+'.');return;}
  }
  room.status='occupied';room.guest=a;a.checkedIn=true;prop.lifetimeGuests++;prop._arrToday=(prop._arrToday||0)+1;
  const fd=avgSkill(prop,'frontdesk');a.sat+=(fd-65)*.15;
  const fdArr=(prop.staff.frontdesk||[]);const friend=fdArr.length?fdArr.reduce((s,r)=>s+(r.friendliness||60),0)/fdArr.length:55;
  a.sat+=(friend-55)*.06;
  const vip=(a.type==='vip'||a.loyalty)||chkPrio(a)>=3;
  if(waiting>0&&!vip){a.sat-=clamp(waiting*rnd(3,6),0,22);a.queued=waiting;}
  else if(waiting>0&&vip){a.sat-=clamp(waiting*rnd(1,2),0,8);} // VIPs fast-tracked
  fdArr.forEach(r=>{if(waiting>0)r.burnout=clamp((r.burnout||0)+.4,0,100);r.exp=(r.exp||0)+1;});
  if(a.loyalty){const L=LOYALTY.find(x=>x.name===a.loyalty);if(L&&L.upg&&Math.random()<L.upg){a.sat+=4;a.upgraded=true;}if(L&&L.brk)a.sat+=2;}
  assignParking(prop,a);
  if(prop.policies.breakfast==='included'||prop.policies.breakfast==='buffet')a.sat+=2;
  feed('🛎️ '+a.name+' ('+(a.returning?'returning ':'')+GUEST_TYPES[a.type].name+(a.loyalty?', '+a.loyalty:'')+') checked into Room '+room.id+(a.queued?' after a wait':'')+'.',a.returning?'gold':'info');
  if(a.returning)logEvent(prop,'guest',a.name+' returned for stay #'+(a.prior+1)+'.');
}

/* ---------------- GUEST ROUTINE — route spend through department pricing (override) ---------------- */
function guestRoutine(prop,room,g){
  const h=G.hour,has=f=>prop.facilities.includes(f),weekend=(G.dow>=5),rainy=(G.weather==='Rainy');
  g.used=g.used||{};ensureDepts(prop);
  if(g.out){ if(h>=18&&Math.random()<.4){g.out=false;g.act='returned';} return; }
  if(Math.random()>.5)return;
  const use=(key,cat,ic)=>{const st=prop.dept[key];if(!st)return;g.used[key]=1;st._cust=(st._cust||0)+1;
    if(st.service==='comp'){st._comp=(st._comp||0)+1;g.sat=clamp(g.sat+(DEPTS[key].sat||3)*.15,0,100);}
    else{const amt=deptPrice(prop,key);if(amt>0){g.spendIn+=amt;prop.revToday+=amt;G.cash+=amt;G.totalRevenue+=amt;prop.lifetimeRev+=amt;st._rev=(st._rev||0)+amt;prop._deptDay=prop._deptDay||{fnb:0,other:0};if(cat==='fnb')prop._deptDay.fnb+=amt;else prop._deptDay.other+=amt;
      const cls=hotelClass(prop);g.sat=clamp(g.sat-clamp(amt/(g.budget*.35)-1,-.3,1)*3,0,100);}}};
  if(h>=7&&h<=10&&!g.hadBreakfast&&(has('breakfast')||has('restaurant'))){g.hadBreakfast=true;g.act='breakfast';use(has('breakfast')?'breakfast':'restaurant','fnb');routineFeed(prop,g,'is having breakfast');return;}
  if(h>=9&&h<=16){const biz=(g.type==='business'||g.type==='corporate');if((biz&&!weekend&&Math.random()<.5)||(['tourist','family','wedding'].includes(g.type)&&!rainy&&Math.random()<.5)){g.out=true;g.act=biz?'at a meeting':'out sightseeing';routineFeed(prop,g,biz?'left for a meeting':'left to explore '+prop.city.name);return;}}
  if(h>=12&&h<=14&&has('restaurant')&&Math.random()<.4){g.act='lunch';use('restaurant','fnb');return;}
  if(h>=19&&h<=22&&has('restaurant')&&Math.random()<.5){g.act='dinner';use('restaurant','fnb');routineFeed(prop,g,'is dining in the restaurant');return;}
  if(has('gym')&&['business','premium','corporate','vip'].includes(g.type)&&Math.random()<.2){g.act='gym';use('gym','other');return;}
  if(has('spa')&&Math.random()<.12){g.act='spa';use('spa','other');routineFeed(prop,g,'visited the spa');return;}
  if(has('pool')&&(rainy?false:Math.random()<.15)){g.act='pool';use('pool','other');return;}
  if(has('lounge')&&['business','corporate','vip','premium'].includes(g.type)&&Math.random()<.15){g.act='lounge';use('lounge','other');return;}
  if(has('roomsvc')&&Math.random()<.18){g.act='room service';use('roomsvc','other');return;}
  if(has('traveldesk')&&['tourist','family','wedding'].includes(g.type)&&Math.random()<.1){g.act='travel desk';use('traveldesk','other');return;}
  if(has('laundry')&&(g.type==='longstay'||g.type==='business')&&Math.random()<.12){g.act='laundry';use('laundry','other');prop._laundryQueue=(prop._laundryQueue||0)+1;return;}
}

/* ---------------- DEPARTMENT SIMULATION (daily) ---------------- */
function runDepartments(prop){
  ensureDepts(prop);
  const mgrSkill=avgSkill(prop,'manager')||45, eff=.8+mgrSkill/100*.45;
  const clsK=hotelClass(prop).k;
  Object.keys(prop.dept).forEach(key=>{
    if(!prop.facilities.includes(key)){delete prop.dept[key];return;}
    const st=prop.dept[key],d=DEPTS[key];
    if(st.mode==='manager'){
      st.service=d.defComp&&(clsK==='upscale'||clsK==='luxury')?'comp':(d.defComp&&clsK==='midscale'&&Math.random()<.3?'comp':'paid');
      st.pricing=clsK==='luxury'?'premium':clsK==='budget'?'budget':'standard';
      if(d.strat)st.strategy='balanced';
      if(key==='laundry'){st.express=(clsK==='luxury');st.outsource=false;}
    }
    const guestCust=st._cust||0,guestRev=st._rev||0,compCust=st._comp||0;
    let extCust=0,extRev=0;
    if(d.external&&st.service!=='comp'){
      const price=deptPrice(prop,key)||d.base;
      let base= d.base>=16000 ? rnd(0,1.1) : (occupied(prop)*.35+(prop.city.tour||.3)*6);
      if(key==='restaurant'){const s=st.strategy||'balanced';base*= s==='external'?1.8:s==='guest'?.35:1;}
      base*=(.7+(prop.rating||3)/5*.6)*(prop.city.spend||1)*eff;
      extCust=Math.max(0,Math.round(base*rnd(.7,1.3)));
      extRev=extCust*price;
      if(extRev){prop.revToday+=extRev;G.cash+=extRev;G.totalRevenue+=extRev;prop.lifetimeRev+=extRev;prop._deptDay=prop._deptDay||{fnb:0,other:0};if(d.meal)prop._deptDay.fnb+=extRev;else prop._deptDay.other+=extRev;}
    }
    const totalCust=guestCust+extCust+compCust;
    const rev=guestRev+extRev;
    const fixed=(FACILITIES[key]?FACILITIES[key].daily:0)*(1+((G.macro&&G.macro.inflation)||0));
    let cost=Math.round(totalCust*d.costUse/eff+fixed);
    if(key==='laundry'){
      const cap=deptCapacity(prop,key),q=prop._laundryQueue||0;
      if(st.outsource){cost+=Math.round(q*90);prop._laundryDelay=0;}
      else{const done=cap*(st.express?1.5:1);prop._laundryDelay=Math.max(0,q-done);if(st.express)cost+=Math.round(q*40);}
      if(prop._laundryDelay>0){prop.hkStrain=clamp((prop.hkStrain||0)+prop._laundryDelay*.02,0,1);if(Math.random()<.3)logEvent(prop,'maintenance','Laundry backlog of '+Math.round(prop._laundryDelay)+' is delaying room readiness.');}
      prop._laundryQueue=0;
    }
    G.cash-=cost;prop.expToday+=cost;prop._opExToday=(prop._opExToday||0)+cost;
    const cap=deptCapacity(prop,key),util=clamp(totalCust/Math.max(1,cap)*100,0,145);
    if((key==='restaurant'||key==='spa')&&util>100&&st.service!=='comp'){prop.reputation=clamp(prop.reputation-(util-100)*.008,0,100);if(Math.random()<.25)logEvent(prop,'service',d.name+' was over capacity — guests faced longer waits.');}
    const satC=st.service==='comp'?(d.sat*.8):clamp(6-({budget:0,standard:1.5,premium:3}[st.pricing]||0),0,8);
    st.daily={rev:Math.round(rev),cost:Math.round(cost),profit:Math.round(rev-cost),cust:totalCust,util:Math.round(util),sat:+satC.toFixed(1)};
    st.mRev=(st.mRev||0)+rev;st.mCost=(st.mCost||0)+cost;st.mProfit=(st.mProfit||0)+(rev-cost);st.mCust=(st.mCust||0)+totalCust;st.mDays=(st.mDays||0)+1;
    if(st.mDays>=30){st.pRev=Math.round(st.mRev);st.pCost=Math.round(st.mCost);st.pProfit=Math.round(st.mProfit);st.pCust=st.mCust;st.mRev=0;st.mCost=0;st.mProfit=0;st.mCust=0;st.mDays=0;}
    st._cust=0;st._rev=0;st._comp=0;
  });
}

/* ---------------- ADVANCED HR (daily) ---------------- */
function runHR(prop){
  const load=workload(prop);
  Object.entries(prop.staff).forEach(([role,arr])=>arr.forEach(s=>{
    if(s.ambition==null)s.ambition=+rnd(.3,.9).toFixed(2);
    if(s.friendliness==null)s.friendliness=ri(45,88);
    if(s.burnout==null)s.burnout=ri(5,20);
    if(!s.name)s.name=pick(FNAMES)+' '+pick(LNAMES);
    s.exp=(s.exp||0)+1;
    if(s.exp>0&&s.exp%75===0)s.skill=clamp(s.skill+1,0,99);            // slow on-the-job learning
    s.burnout=clamp((s.burnout||0)+((s.fatigue||0)>70?1.2:load>1.15?.6:-1.0)+rnd(-.3,.3),0,100);
    const amb=s.ambition||.5;
    s.resignProb=clamp(s.burnout/100*.45+(60-s.morale)/100*.4+amb*.08,0,.9);
  }));
  if(Math.random()<.06){
    const all=Object.entries(prop.staff).flatMap(([r,a])=>a.map(s=>({r,s})));
    const risky=all.filter(x=>Math.random()<(x.s.resignProb||0)*.35);
    if(risky.length){const {r,s}=risky[0];if((prop.staff[r]||[]).length>1||Math.random()<.4){prop.staff[r]=prop.staff[r].filter(x=>x!==s);
      logEvent(prop,'staff',s.name+' ('+ROLES[r].name+') resigned — burnout '+Math.round(s.burnout)+', morale '+Math.round(s.morale)+'.');
      feed('👋 '+s.name+' resigned from '+ROLES[r].name+'. Efficiency dips until a replacement is trained.','warn');}}
  }
}

window.promoteTop=role=>{const p=P(),arr=p.staff[role]||[];if(!arr.length)return;const s=arr.slice().sort((a,b)=>(b.exp||0)-(a.exp||0))[0];s.skill=clamp(s.skill+6,0,99);s.sal=Math.round(s.sal*1.15);s.morale=clamp(s.morale+12,0,100);s.burnout=clamp(s.burnout-12,0,100);s.tier='Senior';logEvent(p,'staff',s.name+' promoted within '+ROLES[role].name+'.');logDecision('Promotion — '+s.name,0,'Promote top performer','Skill & morale up','Higher salary',['staff']);toast(s.name+' promoted.','pos');renderTab();};
window.approveLeave=role=>{const p=P(),arr=p.staff[role]||[];if(!arr.length)return;arr.forEach(s=>{s.burnout=clamp(s.burnout-18,0,100);s.fatigue=clamp((s.fatigue||0)-30,0,100);s.morale=clamp(s.morale+5,0,100);});logDecision('Approved leave — '+ROLES[role].name,0,'Rest the team','Burnout & fatigue drop','Brief capacity dip',['staff']);toast(ROLES[role].name+' team rested.','pos');renderTab();};

function netWorthV8(){try{return (typeof assetValue==='function'?assetValue():0)+G.cash-(typeof totalDebt==='function'?totalDebt():0);}catch(e){return G.cash;}}
function computeScore(){const p=P();if(!p)return 0;const nw=netWorthV8();
  const compAvg=p.compAvg?(Object.values(p.compAvg).reduce((s,v)=>s+v,0)/Math.max(1,Object.keys(p.compAvg).length)):60;
  let s=0;
  s+=clamp(nw/2e7,0,1.3)*230;
  s+=clamp(p.reputation/100,0,1)*190;
  s+=clamp((p.rating||0)/5,0,1)*150;
  s+=clamp((p._gopparToday||0)/8000,0,1.2)*150;
  s+=clamp(G.properties.length/5,0,1)*90;
  s+=clamp(compAvg/100,0,1)*120;
  s+=clamp((p.lifetimeGuests||0)/2000,0,1)*70;
  return Math.round(s);}

function attentionItems(p){const it=[];
  if(G.cash<300000)it.push({s:3,t:'Cash critically low ('+cr(G.cash)+')',tab:'finance'});
  else if(G.cash<1200000)it.push({s:2,t:'Cash running low ('+cr(G.cash)+')',tab:'finance'});
  const net=(p.revYest||0)-(p.expYest||0);if(net<0&&p.revYest!=null)it.push({s:2,t:'Yesterday closed at a loss ('+cr(net)+')',tab:'finance'});
  const shorts=Object.keys(p.invShort||{});if(shorts.length&&typeof INV!=='undefined')it.push({s:2,t:'Stock-out: '+shorts.map(k=>INV[k]?INV[k].name:k).join(', '),tab:'procurement'});
  const crit=(p.maintBacklog||[]).filter(i=>i.sev>=3).length;if(crit)it.push({s:3,t:crit+' critical maintenance issue'+(crit>1?'s':''),tab:'operations'});
  const dirty=p.rooms.filter(r=>r.status==='dirty').length;if(dirty>Math.max(4,p.rooms.length*.45))it.push({s:2,t:dirty+' rooms awaiting cleaning',tab:'operations'});
  if(p.fo&&p.fo.bottleneck)it.push({s:2,t:'Front-desk bottleneck — queues building',tab:'frontoffice'});
  const risky=Object.values(p.staff).flat().filter(s=>(s.resignProb||0)>.5).length;if(risky)it.push({s:2,t:risky+' staff at high resignation risk',tab:'staff'});
  Object.keys(p.dept||{}).forEach(k=>{if(p.facilities.includes(k)&&p.dept[k].service!=='comp'&&((p.dept[k].daily||{}).profit||0)<-500)it.push({s:1,t:(DEPTS[k]?DEPTS[k].name:k)+' is losing money',tab:'fac:'+k});});

  if(Object.values(p.staff).flat().length===0)it.push({s:2,t:'No staff yet — hire your first team',tab:'staff'});
  return it.sort((a,b)=>b.s-a.s);}

/* ---------------- MARKET: 7-day outlook + booking pace (wrap) ---------------- */
function projDemand(p,off){const day=G.day+off;
  const seas=seasonFactor(day,p.city,p.loc);
  const doy=((day-1)%360),month=Math.floor(doy/30)+1;let fest=1;
  if([10,11,12,1,2].includes(month))fest*=1.15;
  [315,300,250,75].forEach(fd=>{const dist=Math.min(Math.abs(doy-fd),360-Math.abs(doy-fd));if(dist<4)fest*=1.5-dist*0.1;});
  const weekend=((G.dow+off)%7)>=5;
  const macro=(G.macro?(G.macro.airTraffic||1)/(G.macro.supply||1):1);
  let d=p.city.dem*p.loc.dem*seas*fest*weatherDemand()*repFactor(p)*compFactor(p)*(1+facBoost(p,'dem'))*(1+(G.chain?G.chain.brand:0)/100*.5)*(1+(p.awareness||0)/100*.3)*macro*(weekend?1.15:1)*G.D.demM;
  return clamp(d,.15,2.6);}
const _v8Mkt=tabMarket;
tabMarket=function(p){
  let rows='';for(let i=1;i<=7;i++){const d=projDemand(p,i);const occ=Math.round(clamp(d*42+22,10,100));rows+=`<div class="row"><span class="lab">Day +${i}${((G.dow+i)%7)>=5?' · wknd':''}</span><span class="val" style="min-width:150px">demand ${d.toFixed(2)} · ~${occ}% ${barInline(occ,occ>75?'#46c06a':occ>45?'#e6b450':'#ef6a6a')}</span></div>`;}
  let pace='building history';const a=(p.analytics||[]).slice(-30);
  if(a.length>=5){const avg=a.reduce((s,x)=>s+x.occ,0)/a.length;const cur=a.slice(-3).reduce((s,x)=>s+x.occ,0)/Math.min(3,a.length);pace=(cur>avg*1.05?'ahead of':cur<avg*0.95?'behind':'on')+' your 30-day pace';}
  const card=`<div class="card" style="margin-top:12px"><h3>7-Day Outlook & Booking Pace</h3><div class="muted sm" style="margin-bottom:6px">Projected from season, festivals, weather, reputation and competition. You are currently <b>${pace}</b>.</div>${rows}</div>`;
  return _v8Mkt(p)+card;};

function hasUpgradeRoom(p){const built=[...new Set(p.rooms.map(r=>r.type))];if(built.length<2)return false;const minRank=Math.min(...built.map(t=>RT_ORDER.indexOf(t)));return p.rooms.some(r=>r.status==='clean'&&RT_ORDER.indexOf(r.type)>minRank);}
function autoResolveEvent(prop,ev){
  const r=G.autoRules[ev.id];if(!r)return false;
  let idx=r.choice;
  if(r.cond==='occLow'){const occN=occupied(prop)/Math.max(1,prop.rooms.length)*100;idx=(occN<(r.val||50))?r.choice:(ev.ch.length-1);}
  idx=clamp(idx,0,ev.ch.length-1);
  const ok=c=>c&&(!c.avail||c.avail(prop))&&!c.noAuto;
  if(!ok(ev.ch[idx])){const alt=ev.ch.findIndex(ok);if(alt<0)return false;idx=alt;}
  ev.ch[idx].f(prop);
  G.autoLog.unshift({d:G.day,h:G.hour,event:ev.title,choice:ev.ch[idx].t});if(G.autoLog.length>120)G.autoLog.pop();
  logEvent(prop,'service','[Auto] '+ev.title+' — '+ev.ch[idx].t);
  return true;
}
function showEvent(ev,prop){
  if(autoResolveEvent(prop,ev)){renderAll();return;}
  const wasPaused=G.paused;G.autoResume=!wasPaused;setPause(true);
  const box=$('#mbox');if(!box)return;
  const choices=ev.ch.map((c,i)=>({c,i})).filter(o=>!o.c.avail||o.c.avail(prop));
  box.innerHTML=`<div class="mhead"><div class="mic" style="background:${ev.cl}22;color:${ev.cl}">${ev.ic}</div><div><h3>${ev.title}</h3><div class="ms">${ev.sub}</div></div></div>
   <div class="mbody"><div class="desc">${ev.desc}</div>
    ${choices.map(o=>`<button class="choice" data-i="${o.i}"><div class="ct">${o.c.t}</div><div class="cc">${o.c.c}</div></button>`).join('')}
   </div>`;
  $('#modal').style.display='flex';
  $$('.choice',box).forEach(b=>b.onclick=()=>{const ci=+b.dataset.i;ev.ch[ci].f(prop);logEvent(prop,'service',ev.title+' — '+ev.ch[ci].t);logDecision(ev.title,0,ev.ch[ci].t,ev.ch[ci].c,'Event outcome',['reputation','satisfaction']);$('#modal').style.display='none';if(G.autoResume)setPause(false);renderAll();});
}

/* ---------- on-duty core (Task 5) ---------- */
function onDuty(p,role){try{const head=(p.staff[role]||[]).length;if(!head)return 0;const c=p.roster&&p.roster[role]?p.roster[role][G.dow][G.hour]:0;return Math.min(c,head);}catch(e){return (p.staff[role]||[]).length?1:0;}}
function dutyList(p,role){const n=onDuty(p,role);return (p.staff[role]||[]).slice(0,n);}
function rosteredHours(p,role){try{return p.roster[role].reduce((s,d)=>s+d.reduce((a,b)=>a+(b?1:0),0),0);}catch(e){return 0;}}

/* housekeeping: only rostered staff clean */
cleanCapacity=function(prop){
  const crew=dutyList(prop,'housekeeping');if(!crew.length)return 0;
  let perHour=0;
  crew.forEach(a=>{const rooms8=12+(a.skill/100)*6;perHour+=rooms8/8*((a.morale||70)/100)*(1-(a.fatigue||0)/200);});
  perHour*=(1-((prop.fat&&prop.fat.housekeeping)||0)*.004);
  if(prop.invShort&&(prop.invShort.linen||prop.invShort.cleaning||prop.invShort.amenities))perHour*=.6;
  return Math.max(0,perHour);
};

/* front office: capacity from rostered coverage, not headcount */
runFrontOffice=function(prop){
  const fd=(prop.staff.frontdesk||[]);
  const arr=prop.expectedToday||0;
  const hrs=rosteredHours(prop,'frontdesk');
  const effHeads=clamp(hrs/ (7*15),0,fd.length||0); // 15 desk-hours/day ≈ full presence
  const skill=fd.length?fd.reduce((s,r)=>s+r.skill,0)/fd.length:0;
  const perRecep=(2+(skill/100)*2)*(1-((prop.fat&&prop.fat.frontdesk)||0)/220);
  const dailyCap=Math.max(0,perRecep*effHeads*10);
  const occ=occupied(prop)/Math.max(1,prop.rooms.length);
  const dirtyFrac=prop.rooms.length?prop.rooms.filter(r=>r.status==='dirty').length/prop.rooms.length:0;
  const effArr=arr*(1+occ*.3+dirtyFrac*.4);
  const avgWait=effHeads>0?clamp((effArr-dailyCap)/Math.max(.5,effHeads)*4,0,45):45;
  const avgFriend=fd.length?Math.round(fd.reduce((s,r)=>s+(r.friendliness||60),0)/fd.length):0;
  fd.forEach(r=>{r.burnout=clamp((r.burnout||0)+(effArr>dailyCap?1.1:-0.8),0,100);});
  prop.fo={recep:fd.length,onNow:onDuty(prop,'frontdesk'),cap:Math.round(dailyCap),arrivals:arr,effArr:Math.round(effArr),
    avgWait:Math.round(avgWait),bottleneck:effArr>dailyCap*1.05,throughput:Math.min(arr,Math.round(dailyCap)),
    avgFriend,avgStress:fd.length?Math.round(fd.reduce((s,r)=>s+(r.burnout||0),0)/fd.length):0,
    readiness:Math.round((1-dirtyFrac)*100)};
};

window.__CH={};
function chRender(id){
  const C=window.__CH[id];if(!C)return '';
  const vis=C.series.filter(s=>!s.off);const all=vis.flatMap(s=>s.vals);
  const w=C.w,h=C.h,pad=8;
  if(!all.length||C.series[0].vals.length<2)return `<div class="chi" data-ch="${id}"><div class="muted sm">Collecting data…</div></div>`;
  const mn=Math.min(...all),mx=Math.max(...all),sp=(mx-mn)||1;
  const n=C.series[0].vals.length;
  const X=i=>pad+i/(n-1)*(w-2*pad),Y=v=>h-pad-((v-mn)/sp)*(h-2*pad-12);
  const grid=[0,.5,1].map(t=>{const v=mn+sp*t;return `<line x1="${pad}" x2="${w-pad}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${w-pad}" y="${Y(v)-2}" text-anchor="end" font-size="9" fill="var(--mut2)">${C.fmt(v)}</text>`;}).join('');
  const paths=vis.map(s=>`<path d="${s.vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="1.8"/>`).join('');
  const dots=vis.map((s,si)=>`<circle class="gd" data-s="${si}" r="3.2" fill="${s.color}" style="display:none"/>`).join('');
  const leg=C.series.map((s,si)=>`<span class="chleg ${s.off?'off':''}" onclick="chToggle('${id}',${si})" style="color:${s.color}">● ${s.name}</span>`).join('');
  return `<div class="chi" data-ch="${id}" style="position:relative">
    <div class="wrapf" style="gap:10px;margin-bottom:2px">${leg}</div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;touch-action:none">${grid}<line class="gl" y1="${pad}" y2="${h-pad}" stroke="var(--mut2)" stroke-dasharray="3 3" style="display:none"/>${paths}${dots}</svg>

function chartI(id,series,fmt,labels,w,h){window.__CH[id]={series,fmt,labels,w:w||340,h:h||120};return chRender(id);}
window.chToggle=(id,si)=>{const C=window.__CH[id];if(!C)return;C.series[si].off=!C.series[si].off;
  const el=document.querySelector(`[data-ch="${id}"]`);if(el){el.outerHTML=chRender(id);wireCharts();}};
function wireCharts(){
  try{$$('.chi').forEach(el=>{
    const id=el.dataset.ch,C=window.__CH[id];if(!C)return;

    if(!svg||!tip)return;

      const n=C.series[0].vals.length;const pad=8*r.width/C.w;
