<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aatithya — Indian Hotel Empire</title>
<style>
:root{
  --bg:#0c111b; --bg2:#0f1623; --panel:#141c2b; --panel2:#1a2435; --line:#243047;
  --line2:#2e3c57; --ink:#e8eef7; --mut:#8a98b2; --mut2:#5e6c86;
  --gold:#d8a24a; --gold2:#eebd6a; --pos:#46c06a; --neg:#ef6a6a; --warn:#e6b450;
  --info:#4fa9c9; --vip:#b27ad6;
  --r:8px; --sh:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 80% -10%,#15203200,#0c111b),var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; overflow:hidden;
}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#26324a;border-radius:6px;border:2px solid var(--bg2)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- SETUP WIZARD ---------- */
#setup{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#0a0f18,#10182a);overflow:auto;display:flex;align-items:center;justify-content:center;padding:32px}
.wiz{width:min(1080px,100%)}
.brandmark{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.logo{width:46px;height:46px;border-radius:11px;background:linear-gradient(145deg,var(--gold2),#9c6f24);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#1a1206;box-shadow:0 6px 18px rgba(216,162,74,.35)}
.brandmark h1{font-size:26px;letter-spacing:.3px;font-weight:700}
.brandmark .tag{color:var(--mut);font-size:12.5px;margin-top:2px;letter-spacing:.3px}
.wizstep{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--sh)}
.wizhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.wizhead h2{font-size:16px;font-weight:650}
.steps{display:flex;gap:8px;margin:18px 0 6px}
.stepdot{flex:1;height:3px;border-radius:3px;background:var(--line2)}
.stepdot.on{background:var(--gold)}
.grid-cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
.pick{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:.13s;position:relative}
.pick:hover{border-color:var(--line2);transform:translateY(-1px)}
.pick.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 8px 22px rgba(216,162,74,.12)}
.pick .ttl{font-weight:650;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.tier{font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:20px;text-transform:uppercase}
.t1{background:#3a2a12;color:var(--gold2)} .t2{background:#15303a;color:#6fc6df} .t3{background:#1d2b1c;color:#88cf86}
.pick .sub{color:var(--mut);font-size:11.5px;margin-top:5px;min-height:30px}
.barrow{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11px;color:var(--mut)}
.barrow .lbl{width:78px;flex:none}
.mtr{flex:1;height:5px;background:#0e1626;border-radius:4px;overflow:hidden}
.mtr i{display:block;height:100%;background:linear-gradient(90deg,#5a7,#7c9);border-radius:4px}
.wizbtns{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;transition:.12s}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(145deg,var(--gold2),#b27e2c);border:none;color:#1a1206}
.btn.primary:hover{filter:brightness(1.07);color:#1a1206}
.diff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.diff-grid .pick .sub{min-height:64px}

/* ---------- APP SHELL ---------- */
#app{display:none;height:100vh;grid-template-rows:auto 1fr;grid-template-columns:212px 1fr}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:0;background:linear-gradient(180deg,#121a29,#0e1521);border-bottom:1px solid var(--line);height:54px;padding:0 14px}
.tb-logo{display:flex;align-items:center;gap:10px;width:198px;flex:none}
.tb-logo .logo{width:32px;height:32px;border-radius:8px;font-size:16px}
.tb-logo b{font-size:14px;letter-spacing:.3px}
.tb-prop{font-size:11px;color:var(--mut);margin-top:1px}
.kpis{display:flex;gap:2px;flex:1;overflow:hidden}
.kpi{padding:5px 14px;border-left:1px solid var(--line);min-width:96px}
.kpi .k{font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:15px;font-weight:700;margin-top:1px}
.kpi .v small{font-size:10px;font-weight:500;color:var(--mut)}
.clockbox{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--line)}
.clock{text-align:right}
.clock .t{font-size:15px;font-weight:700}
.clock .d{font-size:10.5px;color:var(--mut)}
.speeds{display:flex;gap:3px}
.sp{width:30px;height:30px;border-radius:7px;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.sp.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.sp:hover{border-color:var(--gold)}

#side{background:var(--bg2);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;color:var(--mut);font-weight:550;font-size:13px;border:1px solid transparent}
.nav:hover{background:var(--panel);color:var(--ink)}
.nav.on{background:linear-gradient(90deg,#1b2740,#16203200);color:var(--ink);border-color:var(--line2)}
.nav .ic{width:18px;text-align:center;font-size:14px;opacity:.9}
.nav .badge{margin-left:auto;background:var(--neg);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;min-width:18px;text-align:center}
.nav .badge.g{background:var(--gold);color:#1a1206}
.side-sep{height:1px;background:var(--line);margin:8px 4px}
.side-foot{margin-top:auto;display:flex;gap:6px;padding:6px 4px}
.side-foot .btn{flex:1;padding:7px;font-size:11px;text-align:center}

#main{overflow:auto;padding:16px 18px 40px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.page-head h2{font-size:18px;font-weight:680;letter-spacing:.2px}
.page-head .desc{color:var(--mut);font-size:12px;margin-top:2px}

/* cards */
.cards{display:grid;gap:12px}
.cols-4{grid-template-columns:repeat(4,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:650;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.stat{font-size:26px;font-weight:740;letter-spacing:-.5px}
.stat small{font-size:12px;color:var(--mut);font-weight:500;margin-left:4px}
.delta{font-size:11.5px;font-weight:600;margin-top:4px}
.up{color:var(--pos)} .down{color:var(--neg)} .flat{color:var(--mut)}

.row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.row:last-child{border-bottom:none}
.row .lab{color:var(--mut)}
.row .val{font-weight:600}
.pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.3px}
.pill.green{background:#15301f;color:var(--pos)} .pill.red{background:#321618;color:var(--neg)}
.pill.gold{background:#332512;color:var(--gold2)} .pill.blue{background:#142b35;color:#6fc6df}
.pill.gray{background:#1d2536;color:var(--mut)} .pill.vip{background:#26173a;color:var(--vip)}

.bar{height:8px;background:#0e1626;border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--mut2);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:7px 9px;border-bottom:1px solid var(--line2)}
td{padding:8px 9px;border-bottom:1px solid var(--line)}
tr:hover td{background:#161f30}
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

.roomgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.roomcell{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px;cursor:pointer;transition:.12s;position:relative;overflow:hidden}
.roomcell:hover{border-color:var(--line2);transform:translateY(-1px)}
.roomcell .rt{font-weight:680;font-size:13px}
.roomcell .rn{font-size:10.5px;color:var(--mut)}
.roomcell .rstat{font-size:10px;font-weight:700;letter-spacing:.4px;margin-top:8px;text-transform:uppercase}
.roomcell .rprice{position:absolute;top:10px;right:10px;font-size:11px;color:var(--gold2);font-weight:650}
.statline{position:absolute;left:0;top:0;bottom:0;width:3px}
.occ{color:#6fc6df} .clean-ok{color:var(--pos)} .dirty{color:var(--warn)} .maint{color:var(--neg)}
.bg-occ{background:#6fc6df}.bg-clean{background:var(--pos)}.bg-dirty{background:var(--warn)}.bg-maint{background:var(--neg)}

.feed{display:flex;flex-direction:column;gap:0;max-height:340px;overflow:auto}
.fitem{display:flex;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12px}
.fitem .dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none}
.fitem .ft{color:var(--mut2);font-size:10.5px;margin-left:auto;flex:none}
.fitem .txt{color:var(--ink)}

input[type=range]{width:100%;accent-color:var(--gold)}
input[type=number],input[type=text],select{background:#0e1626;border:1px solid var(--line2);color:var(--ink);border-radius:6px;padding:7px 9px;font-family:inherit;font-size:12.5px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--gold)}
label.fl{display:block;font-size:11px;color:var(--mut);margin:10px 0 4px;font-weight:550}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.sw{width:40px;height:22px;border-radius:14px;background:#26324a;position:relative;cursor:pointer;transition:.15s;flex:none}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#cbd5e6;transition:.15s}
.sw.on{background:var(--gold)} .sw.on i{left:20px;background:#1a1206}

.stars{color:var(--gold2);letter-spacing:1px}
.star-dim{color:#3a4051}
.review{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:9px}
.review .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.review .who{font-weight:650;font-size:12.5px}
.review .txt{color:#c8d2e2;font-size:12.5px}
.review .meta{font-size:10.5px;color:var(--mut2);margin-top:5px}

/* MODAL / EVENTS */
#modal{position:fixed;inset:0;z-index:60;background:rgba(6,9,15,.72);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.mbox{width:min(540px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.mhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.mhead .mic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.mhead h3{font-size:16px;font-weight:680}
.mhead .ms{color:var(--mut);font-size:11.5px;margin-top:1px}
.mbody{padding:16px 18px}
.mbody .desc{color:#c8d2e2;font-size:13px;margin-bottom:14px}
.choice{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:11px 13px;margin-bottom:8px;transition:.12s}
.choice:hover{border-color:var(--gold);background:#1d2738}
.choice .ct{font-weight:640;font-size:13px}
.choice .cc{font-size:11px;color:var(--mut);margin-top:3px}
.toast-wrap{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;flex-direction:column;gap:8px;max-width:330px}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--gold);border-radius:8px;padding:10px 13px;font-size:12.5px;box-shadow:var(--sh);animation:sl .25s ease}
@keyframes sl{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.muted{color:var(--mut)} .sm{font-size:11px} .b{font-weight:650} .gold{color:var(--gold2)} .right{text-align:right}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.flex{display:flex;gap:8px;align-items:center}
.wrapf{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:11px;padding:4px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.tag.on{border-color:var(--gold);color:var(--gold2)}
.notice{background:#1a2435;border:1px solid var(--line2);border-radius:8px;padding:11px 13px;font-size:12px;color:var(--mut);margin-bottom:12px}
.kbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 11px;font-size:11.5px}
.mini b{font-size:14px;display:block;margin-top:1px}
.shopitem{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);margin-bottom:8px}
.shopitem .si-ic{width:38px;height:38px;border-radius:9px;background:#1c2740;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.shopitem .si-b{flex:1}
.shopitem .si-t{font-weight:640;font-size:13px}
.shopitem .si-d{font-size:11px;color:var(--mut);margin-top:2px}
</style>
<style id="resp">
@media(max-width:980px){
  #app{grid-template-columns:1fr!important}
  #side{position:fixed;left:0;top:54px;bottom:0;width:230px;z-index:40;transform:translateX(-100%);transition:transform .22s;box-shadow:0 16px 40px rgba(0,0,0,.5);overflow:auto}
  #app.navopen #side{transform:none}
  #navscrim{position:fixed;inset:54px 0 0 0;background:rgba(0,0,0,.5);z-index:35;display:none}
  #app.navopen #navscrim{display:block}
  .cols-4{grid-template-columns:repeat(2,1fr)!important}
  .cols-3{grid-template-columns:repeat(2,1fr)!important}
  .split{grid-template-columns:1fr!important}
  #kpis,.kpis{overflow-x:auto;overflow-y:hidden}
  #hamb{display:flex!important}
}
@media(max-width:620px){
  .cols-4,.cols-3,.cols-2{grid-template-columns:1fr!important}
  .tbl-wrap{overflow-x:auto}
  table{min-width:520px}
  .kpi{min-width:90px}
  .page-head{flex-wrap:wrap;gap:8px}
  #main{padding:12px 12px 48px}
}
#hamb{display:none;width:34px;height:34px;border-radius:8px;background:var(--panel2,#161d2e);border:1px solid var(--line2,#26304a);color:inherit;align-items:center;justify-content:center;font-size:16px;margin-right:8px;flex:none;cursor:pointer}
</style>
</head>
<body>

<!-- ================= SETUP WIZARD ================= -->
<div id="setup">
  <div class="wiz">
    <div class="brandmark">
      <div class="logo">आ</div>
      <div><h1>Aatithya</h1><div class="tag">Indian Hotel Empire · a real-time hospitality simulation</div></div>
    </div>
    <div class="wizstep">
      <div class="steps">
        <div class="stepdot on" data-s="0"></div><div class="stepdot" data-s="1"></div>
        <div class="stepdot" data-s="2"></div><div class="stepdot" data-s="3"></div>
      </div>
      <div id="wizbody"></div>
      <div class="wizbtns">
        <button class="btn" id="wizBack">Back</button>
        <button class="btn primary" id="wizNext">Continue</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div id="topbar">
    <div class="tb-logo">
      <div class="logo" style="width:32px;height:32px;font-size:16px;border-radius:8px">आ</div>
      <div><b>Aatithya</b><div class="tb-prop" id="tbProp">—</div></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="clockbox">
      <div class="clock"><div class="t" id="clkTime">06:00</div><div class="d" id="clkDate">Day 1</div></div>
      <div class="speeds">
        <button class="sp" id="spPause" title="Pause">❚❚</button>
        <button class="sp on" data-sp="1" title="1×">1×</button>
        <button class="sp" data-sp="2" title="2×">2×</button>
        <button class="sp" data-sp="4" title="4×">4×</button>
      </div>
    </div>
  </div>

  <div id="side">
    <div class="nav on" data-tab="overview"><span class="ic">▣</span>Overview</div>
    <div class="nav" data-tab="rooms"><span class="ic">▦</span>Rooms</div>
    <div class="nav" data-tab="guests"><span class="ic">☺</span>Front Desk<span class="badge" id="bgGuests" style="display:none"></span></div>
    <div class="nav" data-tab="pricing"><span class="ic">₹</span>Pricing</div>
    <div class="nav" data-tab="policies"><span class="ic">⚙</span>Policies</div>
    <div class="nav" data-tab="staff"><span class="ic">⚇</span>Staff</div>
    <div class="nav" data-tab="facilities"><span class="ic">◈</span>Facilities</div>
    <div class="nav" data-tab="operations"><span class="ic">⚙</span>Operations</div>
    <div class="nav" data-tab="reviews"><span class="ic">★</span>Reviews</div>
    <div class="side-sep"></div>
    <div class="nav" data-tab="market"><span class="ic">◴</span>Market</div>
    <div class="nav" data-tab="finance"><span class="ic">▤</span>Finance</div>
    <div class="nav" data-tab="analytics"><span class="ic">▥</span>Analytics</div>
    <div class="nav" data-tab="reports"><span class="ic">☰</span>Reports</div>
    <div class="nav" data-tab="log"><span class="ic">≣</span>Log</div>
    <div class="side-sep"></div>
    <div class="nav" data-tab="expand"><span class="ic">⬈</span>Expansion</div>
    <div class="nav" data-tab="hq"><span class="ic">⌂</span>Headquarters</div>
    <div class="side-foot">
      <button class="btn primary" id="btnSave">💾 Save Game</button>
      <button class="btn" id="btnLoad">📂 Load Game</button>
    </div>
  </div>

  <div id="main"></div>
</div>

<div id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast-wrap" id="toasts"></div>

<script>
/* =========================================================================
   AATITHYA — Indian Hotel Management Simulation (offline, single file)
   ========================================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cr=n=>{ // INR formatting
  n=Math.round(n);
  if(Math.abs(n)>=1e7) return '₹'+(n/1e7).toFixed(2)+' Cr';
  if(Math.abs(n)>=1e5) return '₹'+(n/1e5).toFixed(2)+' L';
  return '₹'+n.toLocaleString('en-IN');
};
const cr0=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const pct=n=>Math.round(n)+'%';

/* ---------------- DATA: CITIES ---------------- */
// spend: avg willingness, sens: price sensitivity, dem: base demand, comp: competition,
// biz/tour/prem: market mix shares, seas: seasonality amplitude, baseRate: ref nightly std rate
const CITIES=[

function mkComps(city,loc,d){
  const segs=['Budget chain','Mid-scale','Upscale','Luxury'];
  const n=Math.round(rnd(9,12)+city.comp*2);
  const out=[];
  const brands=['Hotel Surya','InnStay','The Regalia','Comfort Suites','Maple Grand','Imperial Court','Ease Inn','Hotel Mayur','Crown Residency','GreenLeaf','Hotel Ashoka','BlueStone Inn','The Meridian','Sunrise Residency','Palm Court','Hotel Rajhans','Silverline Suites','The Verandah','Lotus Grand','Hotel Chandra','Westgate Inn','The Cascade'];
  const used=new Set();
  for(let i=0;i<n;i++){
    let b; do{b=pick(brands)}while(used.has(b)); used.add(b);
    const seg=ri(0,3);
    out.push({name:b, seg:segs[seg], rating:clamp(rnd(3.2,4.6)-d.compM*.15+seg*.1,2.8,4.8),
      priceIdx:clamp(.7+seg*.25+rnd(-.1,.1),.6,1.9), strength:rnd(.7,1.25)+seg*.05});
  }
  return out;
}
const P=()=>G.properties[G.active];

/* ---------------- DEMAND / SCHEDULING ---------------- */
function seasonFactor(day,city,loc){
  const doy=day%360;
  let s=1+Math.sin((doy/360)*Math.PI*2 - 1)*(city.seas+loc.seas);
  // festival/peak windows
  const peaks=[ [300,340,.35],[80,110,.2],[170,200,-.18] ]; // wedding/winter peak, spring, monsoon trough
  peaks.forEach(([a,b,m])=>{ if(doy>=a&&doy<=b) s+= m*(city.seas+ .25); });
  return clamp(s,.45,1.7);
}
function marketRate(prop,rt){
  return prop.city.baseRate*prop.city.spend*prop.loc.rate*ROOMTYPES[rt].rateF*G.seasonNow;
}
function priceComp(prop,rt){ // demand multiplier from your price vs market
  const mkt=marketRate(prop,rt);
  const r=prop.prices[rt]/mkt;
  const sens=prop.city.sens*G.D.sensM;
  return clamp(1.35 - (r-1)*1.1*sens, .12, 1.5);
}
function repFactor(prop){ return .55+prop.reputation/100*.85; }
function compFactor(prop){
  const avg=prop.comps.reduce((s,c)=>s+c.rating,0)/Math.max(1,prop.comps.length);
  const rel=(prop.rating||avg)-avg;                    // unrated hotel treated as on-par, not 0-star (the real bug)
  const quality=clamp(1+rel*.16,.55,1.5);              // standing vs rivals, centred on 1.0
  const intensity=prop.city.comp*G.D.compM*.7+.35;     // genuine competitive drag (metros high, Tier-3 low)
  return clamp(quality/intensity,.4,1.4);
}
function avgQuality(prop){
  if(!prop.rooms.length) return 50;
  return prop.rooms.reduce((s,r)=>s+roomQ(r),0)/prop.rooms.length;
}
function roomQ(r){ // 0-100 composite room quality
  const base={budget:42,standard:58,deluxe:70,premium:80,suite:88,exec:94}[r.type];
  return clamp(base + r.q.q + (r.cond-100)*.4,0,100);
}
function facBoost(prop,key){ // sum of facility 'key' attribute
  return prop.facilities.reduce((s,f)=>s+(FACILITIES[f][key]||0),0);
}

function scheduleDay(){
  // generate next-day arrivals into pendingArrivals (with arrival hour today)
  const prop=P();
  G.seasonNow=seasonFactor(G.day,prop.city,prop.loc);
  const avail=prop.rooms.filter(r=>r.status==='clean').length;
  const total=prop.rooms.length||1;
  // expected occupancy pressure
  let demandIdx = prop.city.dem*prop.loc.dem*G.seasonNow*repFactor(prop)*compFactor(prop)*G.D.demM;
  demandIdx*= (1+facBoost(prop,'dem'));
  // weekend lift for leisure-heavy
  const weekend=(G.dow>=5);
  demandIdx*= weekend? (1+prop.city.tour*.25):(1+prop.city.biz*.12);
  // number of booking attempts ~ proportional to room count & demand
  let attempts=Math.round(total*1.5*clamp(demandIdx,.2,2.2)*rnd(.8,1.2));
  attempts=clamp(attempts,1,total*3);
  const arrivals=[];
  for(let i=0;i<attempts;i++){
    const g=genGuest(prop);
    // pick a room type the guest prefers and can afford, that is available
    const cand=prop.rooms.filter(r=>(r.status==='clean')&&priceOK(prop,r,g)&&!arrivals.find(a=>a.roomId===r.id));
    if(!cand.length) continue;
    // prefer type
    cand.sort((a,b)=>scoreFor(g,b)-scoreFor(g,a));
    const room=cand[0];
    // willingness check
    const willing=bookWillingness(prop,room,g);
    if(Math.random()<willing){
      g.roomId=room.id; g.arrHour=clamp(Math.round(rnd(12,22)),11,23);
      g.nights=ri(GUEST_TYPES[g.type].nights[0],GUEST_TYPES[g.type].nights[1]);
      g.depDay=G.day+g.nights; g.depHour=ri(8,11); g.price=prop.prices[room.type];
      g.checkedIn=false; arrivals.push(g);
    }
  }
  G.pendingArrivals=arrivals;
  prop.expectedToday=arrivals.length;
}
function genGuest(prop){
  const mix=[];
  const c=prop.city, l=prop.loc;
  const w={business:c.biz*1.0+l.bizW, corporate:c.biz*.6+l.bizW*.5, tourist:c.tour*1.0+l.tourW,
    family:c.tour*.5+.15, budget:(1-c.spend*.5)+.25, transit:l.transW+.1, premium:c.prem*.8,
    wedding:c.tour*.25+.05, longstay:.12, vip:c.prem*.3};
  let tot=0; for(const k in w){w[k]=Math.max(.02,w[k]); tot+=w[k];}
  let r=Math.random()*tot, type='tourist';
  for(const k in w){ r-=w[k]; if(r<=0){type=k;break;} }
  const gt=GUEST_TYPES[type];
  const budget=prop.city.baseRate*prop.city.spend*gt.budgetF*rnd(.8,1.3);
  return {id:'g'+(roomSeq++)+''+ri(10,99), name:pick(FNAMES)+' '+pick(LNAMES), type,
    budget, sens:gt.sens*prop.city.sens*G.D.sensM, quiet:gt.quiet, clean:gt.clean,
    patience:gt.patience, reviewT:gt.review, sat:72, requests:[], complaints:0, served:0};
}
function priceOK(prop,room,g){ return prop.prices[room.type] <= g.budget*1.25; }
function scoreFor(g,room){
  const gt=GUEST_TYPES[g.type];
  let s=roomQ(room);
  if(gt.prefRT.includes(room.type)) s+=25;
  return s - Math.abs(P().prices[room.type]-g.budget)/1000;
}
function bookWillingness(prop,room,g){
  const price=prop.prices[room.type], mkt=marketRate(prop,room.type);
  let w=.8;
  w-= clamp((price/g.budget-1),-.3,1)*.7*g.sens; // expensive vs budget
  w-= clamp((price/mkt-1),-.4,1)*.4*g.sens;       // vs market
  w*= repFactor(prop)*.6+.5;
  if(GUEST_TYPES[g.type].prefRT.includes(room.type)) w+=.12;
  // facilities the guest wants present?
  const wants=GUEST_TYPES[g.type].prefer.filter(f=>prop.facilities.includes(f)).length;
  w+=wants*.05;
  return clamp(w,.03,.96);
}

/* ---------------- SIM TICK (per in-game hour) ---------------- */
function tickHour(){
  const prop=P();
  G.hour++;
  if(G.hour>=24){ G.hour=0; G.day++; G.dow=(G.dow+1)%7; dayRollover(); }

  // process arrivals
  G.pendingArrivals.forEach(a=>{
    if(!a.checkedIn && a.arrHour===G.hour){
      const room=prop.rooms.find(r=>r.id===a.roomId);
      if(room && room.status==='clean'){
        room.status='occupied'; room.guest=a; a.checkedIn=true; prop.lifetimeGuests++;
        // check-in service quality
        const fd=avgSkill(prop,'frontdesk');
        a.sat += (fd-65)*.15;
        feed('🛎️ '+a.name+' ('+GUEST_TYPES[a.type].name+') checked into Room '+room.id+'.','info');
        maybeRequestEvent(prop,room,a);
      } else if(room && room.status!=='clean'){
        // room not ready -> walk-in unhappy / reassign
        const alt=prop.rooms.find(r=>r.status==='clean');
        if(alt){ alt.status='occupied'; alt.guest=a; a.roomId=alt.id; a.checkedIn=true; a.sat-=6;
          feed('⚠️ Room not ready — '+a.name+' moved to Room '+alt.id+'.','warn'); }
        else { a.checkedIn='lost'; prop.incidents++; a.sat=20;
          feed('❌ No clean room for '+a.name+' — walked out. Reputation hit.','neg');
          prop.reputation=clamp(prop.reputation-1.2,0,100); }
      }
    }
  });

  // process check-outs
  prop.rooms.forEach(room=>{
    const g=room.guest;
    if(g && g.checkedIn===true && G.day>=g.depDay && G.hour>=g.depHour){
      // finalize satisfaction & revenue
      finalizeStay(prop,room,g);
      const rev=g.price*g.nights + g.extraRev;
      prop.revToday+=rev; prop.lifetimeRev+=rev; G.totalRevenue+=rev; G.cash+=rev;
      room.guest=null; room.status='dirty'; room.dirtyT=ri(1,3);
      room.cond=clamp(room.cond-rnd(.5,2.2),40,100);
    }
  });

  // housekeeping — clean dirty rooms based on capacity
  let hk=Math.round(cleanCapacity(prop));
  prop.rooms.filter(r=>r.status==='dirty').sort((a,b)=>a.dirtyT-b.dirtyT).forEach(r=>{
    if(hk>0){ r.dirtyT--; if(r.dirtyT<=0){ r.status='clean'; } hk--; }
  });
  // maintenance recovery
  prop.rooms.filter(r=>r.status==='maintenance').forEach(r=>{
    r.maintT-= maintSpeed(prop);
    if(r.maintT<=0){ r.status='dirty'; r.dirtyT=1; r.cond=clamp(r.cond+rnd(10,25),0,100);
      feed('🔧 Room '+r.id+' maintenance complete.','pos'); }
  });
  // occupied guest mood drift (noise, condition)
  prop.rooms.filter(r=>r.status==='occupied').forEach(r=>{
    const g=r.guest; if(!g)return;
    const noise=prop.loc.noise*(1-facBoost(prop,'sat')*.01);
    if(noise>g.quiet+.15 && Math.random()<.04) g.sat-=rnd(.5,2);
    if(r.cond<60 && Math.random()<.05) g.sat-=rnd(.5,1.5);
  });

  // random operational events
  G.eventCooldown--;
  if(G.eventCooldown<=0 && !G.paused){
    if(Math.random()<.14){ triggerEvent(prop); G.eventCooldown=ri(8,18); }
    else G.eventCooldown=ri(3,7);
  }
  accrueHourlyCost(prop);
}

function dayRollover(){
  const prop=P();
  // settle day
  prop.revYest=prop.revToday; prop.expYest=prop.expToday;
  G.finHist.push({day:G.day-1, rev:prop.revToday, exp:prop.expToday, cash:G.cash});
  if(G.finHist.length>120) G.finHist.shift();
  prop.revToday=0; prop.expToday=0;
  // pay any lump daily already accrued hourly; salaries accrued hourly too
  // reputation drift toward rating
  if(prop.reviews.length){
    const recent=prop.reviews.slice(-12);
    const avgR=recent.reduce((s,r)=>s+r.stars,0)/recent.length;
    const target=avgR*20;
    prop.reputation += (target-prop.reputation)*.12 - prop.incidents*.3;
    prop.reputation=clamp(prop.reputation,0,100);
  }
  prop.incidents=Math.max(0,prop.incidents-1);
  // competitor moves occasionally
  if(Math.random()<.25){
    const c=pick(prop.comps);
    if(prop.rating>c.rating+.3 && Math.random()<.5){ c.priceIdx=clamp(c.priceIdx-.05,.6,2); feed('🏨 '+c.name+' cut prices to compete.','warn'); }
    else if(Math.random()<.4){ c.rating=clamp(c.rating+rnd(.02,.08),2.8,4.9); }
  }
  // staff morale drift
  for(const role in prop.staff) prop.staff[role].forEach(s=>{
    const load=workload(prop);
    s.morale=clamp(s.morale + (load>1.1?-1.5:.6) + rnd(-.5,.5),20,100);
  });
  // schedule new day arrivals
  scheduleDay();
  feed('— Day '+G.day+' begins. '+prop.expectedToday+' bookings expected. Season index '+G.seasonNow.toFixed(2)+'. —','gold');
  // bankruptcy check
  if(G.cash<-500000){ gameOver(); }
}

function cleanCapacity(prop){
  const hk=prop.staff.housekeeping||[];
  const mgr=avgSkill(prop,'manager');
  return hk.reduce((s,x)=>s+(x.skill/100)*(x.morale/100)*0.9,0)*(1+ (mgr-60)/200);
}
function maintSpeed(prop){
  const m=prop.staff.maintenance||[];
  return Math.max(.5, m.reduce((s,x)=>s+(x.skill/100),0)*1.4);
}
function avgSkill(prop,role){
  const a=prop.staff[role]||[]; if(!a.length) return 35;
  return a.reduce((s,x)=>s+x.skill*(x.morale/100),0)/a.length;
}
function workload(prop){
  const occ=prop.rooms.filter(r=>r.status==='occupied').length;
  const staffN=Object.values(prop.staff).reduce((s,a)=>s+a.length,0)||1;
  return occ/(staffN*2.5);
}
function accrueHourlyCost(prop){
  // salaries: monthly -> /30/24 per hour
  let sal=0; for(const role in prop.staff) prop.staff[role].forEach(s=>sal+=s.sal/30/24);
  // utilities + maintenance per room/hour
  let util=prop.rooms.length*250/24;
  let maint=prop.rooms.reduce((s,r)=>s+ROOMTYPES[r.type].dmaint,0)/24*G.D.maintM;
  let fac=prop.facilities.reduce((s,f)=>s+FACILITIES[f].daily,0)/24;
  const cost=(sal+util+maint+fac)*G.D.costM;
  prop.expToday+=cost; G.cash-=cost;
}

/* ---------------- SATISFACTION & REVIEWS ---------------- */
function finalizeStay(prop,room,g){
  const gt=GUEST_TYPES[g.type];
  let sat=g.sat;
  const q=roomQ(room), exp=ROOMTYPES[room.type].exp*GUEST_TYPES[g.type].clean*G.D.exp;
  sat += (q-exp)*.5;                                   // room vs expectation
  // value for money
  const mkt=marketRate(prop,room.type);
  sat -= clamp((g.price/mkt-1),-.4,1.2)*22*g.sens*.6;
  // cleanliness (housekeeping performance proxy)
  const hk=clamp(cleanCapacity(prop)/Math.max(1,prop.rooms.length)*100,30,100);
  sat += (hk-65)*.18*g.clean;
  // service
  sat += (avgSkill(prop,'frontdesk')-65)*.16;
  // facilities the guest wanted
  const wants=gt.prefer.filter(f=>prop.facilities.includes(f)).length;
  sat += wants*3 + facBoost(prop,'sat')*.15;
  // noise
  sat -= clamp(prop.loc.noise-g.quiet,0,1)*14;
  // complaints handled this stay already affected g.sat
  g.sat=clamp(sat,0,100);
  // revenue extras from facilities (F&B, services)
  let extra=0;
  prop.facilities.forEach(f=>{ if(FACILITIES[f].rev && Math.random()<.5) extra+= rnd(300,1500)*(gt.budgetF); });
  g.extraRev=Math.round(extra);
  // review?
  const reviewChance=g.reviewT*(.4+Math.abs(g.sat-65)/65)*G.D.harsh*.9;
  if(Math.random()<clamp(reviewChance,.05,.95)){
    leaveReview(prop,g,room);
  }
  feed((g.sat>75?'😊':g.sat>50?'😐':'😞')+' '+g.name+' checked out — satisfaction '+Math.round(g.sat)+'%.', g.sat>70?'pos':g.sat>45?'info':'neg');
}
function leaveReview(prop,g,room){
  let s=g.sat - (G.D.harsh-1)*8;
  const stars=clamp(Math.round(s/20+rnd(-.3,.3)),1,5);
  const txt=reviewText(stars,g,room,prop);
  prop.reviews.push({stars,txt,who:g.name,type:g.type,day:G.day});
  if(prop.reviews.length>200) prop.reviews.shift();
  prop.rating= prop.reviews.reduce((a,r)=>a+r.stars,0)/prop.reviews.length;
  feed('★ '+g.name+' left a '+stars+'-star review.', stars>=4?'pos':stars<=2?'neg':'info');
  renderTopbar();
}
function reviewText(stars,g,room,prop){
  const rt=ROOMTYPES[room.type].name;
  const POS=['Excellent stay overall.','Staff was genuinely helpful.','Spotless room and great service.','Great value for the price.','Will definitely return.','Comfortable and well-kept '+rt.toLowerCase()+' room.','Smooth check-in, lovely experience.'];
  const MID=['Decent stay, room was fine.','Okay for the price, nothing special.','Good location but service was slow.','Clean room, but check-in took too long.','Average — could improve housekeeping.','Comfortable enough, a bit overpriced.'];
  const NEG=['Overpriced for what was provided.','Bathroom quality was below expectations.','Room wasn\u2019t ready on arrival.','Noisy and hard to sleep.','Service was disappointing.','Not worth the rate, won\u2019t return.','Cleanliness needs serious attention.'];
  let pool = stars>=4?POS : stars===3?MID : NEG;
  let base=pick(pool);
  // add a specific aspect
  if(prop.loc.noise>.6 && stars<4 && Math.random()<.5) base+=' The area was quite noisy.';
  if(g.sat<50 && Math.random()<.4) base+=' Expected more for the price.';
  if(stars>=4 && prop.facilities.length>3 && Math.random()<.4) base+=' Loved the amenities.';
  return base;
}

function ovCard(t,v,sub,bar){return `<div class="card"><h3>${t}</h3><div class="stat">${v}</div><div class="delta flat">${sub}</div>${bar}</div>`;}
function barH(v,c){return `<div class="bar"><i style="width:${clamp(v,0,100)}%;background:${c}"></i></div>`;}
function row(l,v){return `<div class="row"><span class="lab">${l}</span><span class="val">${v}</span></div>`;}
function renderFeed(){
  if(!G.feed.length) return '<div class="muted sm">Press Play ▶ to begin operations…</div>';
  return G.feed.slice(0,40).map(f=>`<div class="fitem"><span class="dot" style="background:${f.c}"></span><span class="txt">${f.t}</span><span class="ft">D${f.d} ${String(f.h).padStart(2,'0')}h</span></div>`).join('');
}
function feed(t,type){
  const cmap={gold:'#d8a24a',pos:'#46c06a',neg:'#ef6a6a',info:'#4fa9c9',warn:'#e6b450'};
  G.feed.unshift({t,c:cmap[type]||'#8a98b2',d:G.day,h:G.hour});
  if(G.feed.length>120)G.feed.pop();
}

function roomCell(p,r){
  const st={clean:'Available',occupied:'Occupied',dirty:'Cleaning',maintenance:'Maintenance'}[r.status];
  const bg={clean:'bg-clean',occupied:'bg-occ',dirty:'bg-dirty',maintenance:'bg-maint'}[r.status];
  const cl={clean:'clean-ok',occupied:'occ',dirty:'dirty',maintenance:'maint'}[r.status];
  return `<div class="roomcell" onclick="roomDetail(${r.id})">
    <span class="statline ${bg}"></span>
    <div class="rt">Room ${r.id}</div>
    <div class="rn">${ROOMTYPES[r.type].name} · ${r.q.name} · F${r.floor}</div>
    <div class="rprice">${cr0(p.prices[r.type])}</div>
    <div class="rstat ${cl}">${st}${r.guest?' · '+(GUEST_TYPES[r.guest.type].ic):''}</div>
    <div class="bar" style="margin-top:8px"><i style="width:${roomQ(r)}%;background:#3a4a66"></i></div>
  </div>`;
}
function roomDetail(id){
  const p=P(), r=p.rooms.find(x=>x.id===id); if(!r)return;
  const g=r.guest;
  const box=$('#mbox');
  box.innerHTML=`<div class="mhead"><div class="mic" style="background:#1c2740">▦</div>
    <div><h3>Room ${r.id}</h3><div class="ms">${ROOMTYPES[r.type].name} · ${r.q.name} furnishing · Floor ${r.floor}</div></div></div>
    <div class="mbody">
      ${row('Status','<span class="pill '+(r.status==='clean'?'green':r.status==='occupied'?'blue':r.status==='dirty'?'gold':'red')+'">'+r.status+'</span>')}
      ${row('Nightly rate',cr0(p.prices[r.type]))}
      ${row('Room quality',Math.round(roomQ(r))+'/100')}
      ${row('Condition',Math.round(r.cond)+'%')}
      ${g?`<div style="margin-top:10px" class="notice"><b>${g.name}</b> · ${GUEST_TYPES[g.type].name}<br>
        Satisfaction: <b>${Math.round(g.sat)}%</b> · Nights: ${g.nights} · Rate ${cr0(g.price)}<br>
        Checks out Day ${g.depDay}, ~${g.depHour}:00</div>`:''}
      <div class="wrapf" style="margin-top:12px">
        ${r.status==='clean'?`<button class="btn" onclick="upgradeRoomQ(${r.id})">Upgrade Furnishing</button>`:''}
        ${r.cond<85&&r.status!=='occupied'&&r.status!=='maintenance'?`<button class="btn" onclick="renovate(${r.id})">Renovate (₹${(80000).toLocaleString('en-IN')})</button>`:''}
        ${r.status==='clean'?`<button class="btn" onclick="sendMaint(${r.id})">Send to Maintenance</button>`:''}
      </div>
    </div>`;
  $('#modal').style.display='flex';
  $('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').style.display='none';};
}
window.upgradeRoomQ=id=>{
  const p=P(),r=p.rooms.find(x=>x.id===id);
  const idx=QUALITY.findIndex(q=>q.name===r.q.name);
  if(idx>=QUALITY.length-1){toast('Already at top furnishing tier.','warn');return;}
  const nq=QUALITY[idx+1], cost=nq.cost-r.q.cost;
  if(G.cash<cost){toast('Not enough cash.','neg');return;}
  G.cash-=cost; p.expToday+=cost; r.q=nq; r.cond=clamp(r.cond+10,0,100);
  toast('Room '+id+' upgraded to '+nq.name+'.'); $('#modal').style.display='none'; renderAll();
};
window.renovate=id=>{const p=P(),r=p.rooms.find(x=>x.id===id);if(G.cash<80000){toast('Not enough cash.','neg');return;}G.cash-=80000;p.expToday+=80000;r.cond=100;toast('Room '+id+' renovated.');$('#modal').style.display='none';renderAll();};
window.sendMaint=id=>{const p=P(),r=p.rooms.find(x=>x.id===id);r.status='maintenance';r.maintT=ri(2,5);toast('Room '+id+' under maintenance.');$('#modal').style.display='none';renderAll();};
window.roomDetail=roomDetail;

    </div>
  </div>
  <div class="card" style="margin-top:12px"><h3>Guest Mix Insight</h3>

function moodPill(s){return s>75?'<span class="pill green">😊 '+Math.round(s)+'%</span>':s>50?'<span class="pill gold">😐 '+Math.round(s)+'%</span>':'<span class="pill red">😞 '+Math.round(s)+'%</span>';}
function guestMixTags(p){
  const c=p.city,l=p.loc;
  const tags=[];
  if(c.biz+l.bizW>.6)tags.push('Business');
  if(c.tour+l.tourW>.6)tags.push('Tourism');
  if(l.transW>.4)tags.push('Transit');
  if(c.prem>.35)tags.push('Premium');
  if(c.spend<.95)tags.push('Budget-led');
  if(c.tour>.5)tags.push('Family & Wedding');
  return tags.map(t=>`<span class="tag on">${t}</span>`).join('');
}

function milestone(t,done){return `<div class="row"><span class="lab">${done?'✅':'⬜'} ${t}</span><span class="val">${done?'<span class="pill green">done</span>':'<span class="pill gray">pending</span>'}</span></div>`;}
window.buildRoom=rt=>{const p=P();const qi=+($('#q_'+rt)?.value||0);const q=QUALITY[qi];const cost=ROOMTYPES[rt].build+q.cost;
  if(p.rooms.filter(r=>r.floor<=p.floors).length>=p.floors*p.capPerFloor){toast('No floor capacity — add a floor first.','warn');return;}
  if(G.cash<cost){toast('Not enough cash.','neg');return;}
  let floor=1;for(let f=1;f<=p.floors;f++){if(p.rooms.filter(r=>r.floor===f).length<p.capPerFloor){floor=f;break;}}
  G.cash-=cost;p.expToday+=cost;p.rooms.push(makeRoom(p,rt,floor,q));toast(ROOMTYPES[rt].name+' room built on floor '+floor+'.');renderAll();};
window.addFloor=()=>{const p=P();const cost=2500000+p.floors*800000;if(G.cash<cost){toast('Not enough cash for a new floor.','neg');return;}G.cash-=cost;p.expToday+=cost;p.floors++;toast('Floor '+p.floors+' added (+'+p.capPerFloor+' room capacity).');renderAll();};

/* ---------------- TOAST ---------------- */
function toast(msg,type){
  const t=document.createElement('div'); t.className='toast';
  if(type==='neg')t.style.borderLeftColor='#ef6a6a'; if(type==='pos')t.style.borderLeftColor='#46c06a'; if(type==='warn')t.style.borderLeftColor='#e6b450';
  t.textContent=msg; $('#toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.4s';setTimeout(()=>t.remove(),400);},2600);
}

  }
  if(wiz.step===2){

      <div class="sub">${d.note}</div>
      <div class="row"><span class="lab">Starting capital</span><span class="val gold">${cr(CAP_BASE[k])}</span></div>
    </div>`}).join('')}</div>`;
    $$('.pick[data-diff]',b).forEach(el=>el.onclick=()=>{wiz.diff=el.dataset.diff;renderWiz();});
  }

    const c=CITIES[wiz.city],l=LOCALITIES[wiz.loc],d=DIFFS[wiz.diff];
    b.innerHTML=`<div class="wizhead"><h2>Confirm & name your hotel</h2></div>

      <div class="card"><h3>Difficulty</h3><div class="b" style="font-size:16px">${d.name}</div><div class="muted sm gold">${cr(CAP_BASE[wiz.diff])} capital</div></div>

function startGame(){

 {name:'Platinum',min:10,disc:.10,upg:.40,brk:true}
];
function loyaltyTier(stays){let t=null;for(const L of LOYALTY)if(stays>=L.min)t=L;return t;}

/* ---------------- STATE AUGMENTATION ---------------- */
function augmentInit(){

/* ---------------- LOG HELPERS ---------------- */
function logEvent(prop,cat,txt){if(!G.eventLog)G.eventLog=[];G.eventLog.unshift({d:G.day,h:G.hour,cat,txt});if(G.eventLog.length>500)G.eventLog.pop();}
function logDecision(txt,cost,reason,shortI,longI){if(!G.decisionLog)G.decisionLog=[];G.decisionLog.unshift({d:G.day,txt,cost,reason,shortI,longI});if(G.decisionLog.length>200)G.decisionLog.pop();}

/* ---------------- ROOM QUALITY (override: add components) ---------------- */
function roomQ(r){
  const base={budget:42,standard:58,deluxe:70,premium:80,suite:88,exec:94}[r.type];
  return clamp(base + r.q.q + compScore(r) + (r.cond-100)*.4,0,100);
}
function compScore(r){let s=0;for(const k in (r.comp||{}))if(r.comp[k]&&COMPONENTS[k])s+=COMPONENTS[k].q;return Math.min(s,22);}

/* makeRoom override: add comp + renoT */
function makeRoom(prop,rt,floor,q){
  return {id:roomSeq++,type:rt,floor,q,status:'clean',guest:null,dirtyT:0,maintT:0,renoT:0,cond:100,comp:{}};
}

/* ---------------- GUEST GENERATION (override) ---------------- */
function pickChannel(prop,weekend){
  const w={};
  CH_ORDER.forEach(k=>{const C=CHANNELS[k];let v=C.vol;
    if(C.weekday)v*=weekend?.4:1.5;
    if(k==='ota')v*=1+prop.city.tour*.3;
    if(k==='direct')v*=1+prop.reputation/100*.5;
    if(k==='walkin')v*=1+prop.loc.transW*.6;
    w[k]=v;});
  let tot=0;for(const k in w)tot+=w[k];
  let r=Math.random()*tot;for(const k in w){r-=w[k];if(r<=0)return k;}return 'direct';
}
function vehProb(type,l){const base={business:.5,corporate:.6,tourist:.35,family:.55,budget:.15,transit:.25,premium:.6,wedding:.5,longstay:.4,vip:.7}[type]||.3;return clamp(base*(1+l.conv*.2),.05,.85);}
function buildReturnPool(){
  G.returnPool={};
  const db=G.guestDB||{};
  for(const k in db){const e=db[k];if(e.avgSat>=62)(G.returnPool[e.type]=G.returnPool[e.type]||[]).push(e);}
}
function genGuest(prop){
  const c=prop.city,l=prop.loc,weekend=(G.dow>=5);
  const ch=pickChannel(prop,weekend),CH=CHANNELS[ch];
  const w={business:c.biz*1.0+l.bizW,corporate:c.biz*.6+l.bizW*.5,tourist:c.tour*1.0+l.tourW,
    family:c.tour*.5+.15,budget:(1-c.spend*.5)+.25,transit:l.transW+.1,premium:c.prem*.8,
    wedding:c.tour*.25+.05,longstay:.12,vip:c.prem*.3};
  for(const k in w){w[k]=Math.max(.02,w[k]);if(CH.arche.includes(k))w[k]*=2.4;}
  let tot=0;for(const k in w)tot+=w[k];
  let r=Math.random()*tot,type='tourist';
  for(const k in w){r-=w[k];if(r<=0){type=k;break;}}
  let returning=null,prior=0,favRT=null,loyalty=null;
  const poolT=G.returnPool&&G.returnPool[type];
  if(poolT&&poolT.length&&Math.random()<clamp(.12+prop.reputation/100*.25,0,.5)){
    returning=pick(poolT);prior=returning.stays;favRT=returning.favRT;type=returning.type;loyalty=loyaltyTier(prior);
  }
  const gt=GUEST_TYPES[type];
  const budget=c.baseRate*c.spend*gt.budgetF*rnd(.8,1.3)*(ch==='ota'?.95:ch==='corp'?1.08:1);
  const veh=Math.random()<vehProb(type,l);
  const ev=veh&&Math.random()<(['premium','business','corporate','vip'].includes(type)?.3:.08);
  return {id:'g'+(roomSeq++)+''+ri(10,99),name:returning?returning.name:pick(FNAMES)+' '+pick(LNAMES),type,
    channel:ch,budget,sens:gt.sens*c.sens*G.D.sensM,quiet:gt.quiet,clean:gt.clean,
    patience:gt.patience,reviewT:gt.review*CH.reviewM,expM:CH.expM*(loyalty?1.06:1),
    returning:!!returning,prior,favRT,loyalty:loyalty?loyalty.name:null,
    vehicle:veh,ev,sat:72+(returning?4:0),requests:[],complaints:0,served:0};
}

/* ---------------- DAY SCHEDULING (override) ---------------- */
function scheduleDay(){
  const prop=P();
  buildReturnPool();
  G.seasonNow=seasonFactor(G.day,prop.city,prop.loc);
  const total=prop.rooms.length||1;
  let demandIdx=prop.city.dem*prop.loc.dem*G.seasonNow*repFactor(prop)*compFactor(prop)*G.D.demM;
  demandIdx*=(1+facBoost(prop,'dem'));
  demandIdx*=(1+(G.chain?G.chain.brand:0)/100*.5);
  const weekend=(G.dow>=5);
  demandIdx*=weekend?(1+prop.city.tour*.25):(1+prop.city.biz*.12);
  let attempts=Math.round(total*1.6*clamp(demandIdx,.2,2.3)*rnd(.8,1.2));
  attempts=clamp(attempts,1,total*3);
  const arrivals=[],chCount={};const overbook=prop.policies.overbook||0;let booked=0;
  for(let i=0;i<attempts;i++){
    const g=genGuest(prop);
    g.nights=clamp(ri(GUEST_TYPES[g.type].nights[0],GUEST_TYPES[g.type].nights[1]),prop.policies.minStay||1,prop.policies.maxStay||30);
    let cand=prop.rooms.filter(r=>r.status==='clean'&&priceOK(prop,r,g)&&!arrivals.find(a=>a.roomId===r.id));
    if(!cand.length){
      if(overbook>0 && booked<total+overbook){
        cand=prop.rooms.filter(r=>!arrivals.find(a=>a.roomId===r.id)&&priceOK(prop,r,g));
      }
      if(!cand.length)continue;
    }
    cand.sort((a,b)=>scoreFor(g,b)-scoreFor(g,a));
    const room=cand[0];
    let willing=bookWillingness(prop,room,g);
    if(prop.policies.cancelType==='nonref')willing*=.9;
    if(prop.policies.payment==='full')willing*=.92;
    if(prop.policies.cancelType==='flexible')willing*=1.04;
    if(g.loyalty)willing*=1.08;
    if(Math.random()<willing){
      g.roomId=room.id;g.arrHour=clamp(Math.round(rnd(12,22)),11,23);
      g.depDay=G.day+g.nights;g.depHour=ri(8,11);g.price=prop.prices[room.type];
      if(g.loyalty){const L=LOYALTY.find(x=>x.name===g.loyalty);if(L)g.price=Math.round(g.price*(1-L.disc));}
      const depFrac=prop.policies.payment==='full'?1:prop.policies.payment==='partial'?.3:0;
      g.deposit=Math.round(g.price*g.nights*depFrac);g.bookingAmt=g.price*g.nights;
      const cancelP=CHANNELS[g.channel].cancel*(prop.policies.cancelType==='nonref'?.5:prop.policies.cancelType==='flexible'?1.15:1);
      if(Math.random()<cancelP){
        prop.cancellations=(prop.cancellations||0)+1;
        const refundable=prop.policies.cancelType==='flexible';
        if(!refundable&&g.deposit>0){G.cash+=g.deposit;prop.revToday+=g.deposit;logEvent(prop,'booking',g.name+' cancelled — deposit '+cr0(g.deposit)+' retained.');}
        else logEvent(prop,'booking',g.name+' cancelled (refundable).');
        continue;
      }
      g.checkedIn=false;arrivals.push(g);booked++;chCount[g.channel]=(chCount[g.channel]||0)+1;
    }
  }
  G.pendingArrivals=arrivals;prop.expectedToday=arrivals.length;prop.chCountToday=chCount;
  ensureIntel(prop);
}

/* ---------------- CHECK-IN / QUEUE / PARKING ---------------- */
function chkPrio(a){let p=0;if(a.loyalty==='Platinum')p+=3;else if(a.loyalty==='Gold')p+=2;if(a.type==='vip')p+=3;if(a.type==='premium')p+=2;return p;}
function assignParking(prop,a){
  if(!a.vehicle)return;const pk=prop.parking;if(!pk)return;
  const guaranteed=['premium','vip','business','corporate'].includes(a.type);
  if(a.ev&&pk.evOccupied<pk.ev){pk.evOccupied++;a.parked='ev';
    if(prop.policies.parking!=='complimentary'){const fee=(prop.policies.evPrice||12)*ri(15,40);G.cash+=fee;prop.revToday+=fee;a.extraPark=(a.extraPark||0)+fee;}}
  else if(pk.occupied<pk.spaces){pk.occupied++;a.parked='std';
    if(prop.policies.parking==='paid'){const fee=ri(150,400);G.cash+=fee;prop.revToday+=fee;a.extraPark=(a.extraPark||0)+fee;}}
  else{a.parked='none';a.sat-=guaranteed?rnd(6,12):rnd(2,5);prop._compToday=(prop._compToday||0)+1;
    if(Math.random()<.5)logEvent(prop,'service',a.name+' found parking full on arrival.');}
}
function checkInGuest(prop,a,waiting){
  let room=prop.rooms.find(r=>r.id===a.roomId);
  if(!(room&&room.status==='clean')){
    const alt=prop.rooms.find(r=>r.status==='clean');
    if(alt){room=alt;a.roomId=alt.id;a.sat-=6;feed('⚠️ Room not ready — '+a.name+' moved to Room '+alt.id+'.','warn');}
    else{a.checkedIn='lost';prop.incidents++;a.sat=20;prop._compToday=(prop._compToday||0)+1;
      feed('❌ No clean room for '+a.name+' — walked out.','neg');prop.reputation=clamp(prop.reputation-1.2,0,100);
      logEvent(prop,'service','Walkout: no clean room for '+a.name+'.');return;}
  }
  room.status='occupied';room.guest=a;a.checkedIn=true;prop.lifetimeGuests++;prop._arrToday=(prop._arrToday||0)+1;
  const fd=avgSkill(prop,'frontdesk');a.sat+=(fd-65)*.15;
  if(waiting>0&&chkPrio(a)<3){a.sat-=clamp(waiting*rnd(3,6),0,22);a.queued=waiting;}
  if(a.loyalty){const L=LOYALTY.find(x=>x.name===a.loyalty);if(L&&L.upg&&Math.random()<L.upg){a.sat+=4;a.upgraded=true;}if(L&&L.brk)a.sat+=2;}
  assignParking(prop,a);
  if(prop.policies.breakfast==='included'||prop.policies.breakfast==='buffet')a.sat+=2;
  feed('🛎️ '+a.name+' ('+(a.returning?'returning ':'')+GUEST_TYPES[a.type].name+(a.loyalty?', '+a.loyalty:'')+') checked into Room '+room.id+(a.queued?' after a wait':'')+'.',a.returning?'gold':'info');
  if(a.returning)logEvent(prop,'guest',a.name+' returned for stay #'+(a.prior+1)+'.');
}

/* ---------------- SIM TICK (override) ---------------- */
function tickHour(){
  const prop=P();
  G.hour++;
  if(G.hour>=24){G.hour=0;G.day++;G.dow=(G.dow+1)%7;dayRollover();}
  const due=G.pendingArrivals.filter(a=>!a.checkedIn&&a.checkedIn!=='lost'&&a.arrHour===G.hour);
  if(due.length){
    due.sort((x,y)=>chkPrio(y)-chkPrio(x));
    const fdN=(prop.staff.frontdesk||[]).length;
    const fdCap=Math.max(1,Math.round(fdN*(avgSkill(prop,'frontdesk')/100*1.4+.6)*2));
    prop.queuePeak=Math.max(prop.queuePeak||0,due.length);
    due.forEach((a,idx)=>checkInGuest(prop,a,Math.max(0,idx+1-fdCap)));
    if(due.length>fdCap){prop._compToday=(prop._compToday||0)+1;logEvent(prop,'service','Front-desk queue of '+due.length+' exceeded capacity '+fdCap+'.');if(Math.random()<.3)prop.reputation=clamp(prop.reputation-.4,0,100);}
  }
  prop.rooms.forEach(room=>{
    const g=room.guest;
    if(g&&g.checkedIn===true&&G.day>=g.depDay&&G.hour>=g.depHour){
      finalizeStay(prop,room,g);
      prop.channelRev=prop.channelRev||{};
      const gross=g.price*g.nights+(g.extraRev||0)+(g.extraPark||0);
      const comm=Math.round((g.price*g.nights)*((CHANNELS[g.channel]&&CHANNELS[g.channel].comm)||0));
      const rev=gross-comm;
      prop.commToday=(prop.commToday||0)+comm;
      prop.channelRev[g.channel]=(prop.channelRev[g.channel]||0)+rev;
      prop.revToday+=rev;prop.lifetimeRev+=rev;G.totalRevenue+=rev;G.cash+=rev;
      writeGuestDB(prop,g);
      if(g.parked==='ev'&&prop.parking)prop.parking.evOccupied=Math.max(0,prop.parking.evOccupied-1);
      else if(g.parked==='std'&&prop.parking)prop.parking.occupied=Math.max(0,prop.parking.occupied-1);
      prop._depToday=(prop._depToday||0)+1;
      room.guest=null;room.status='dirty';room.dirtyT=ri(1,3);room.cond=clamp(room.cond-rnd(.5,2.2),40,100);
    }
  });
  let hk=Math.round(cleanCapacity(prop));
  prop.rooms.filter(r=>r.status==='dirty').sort((a,b)=>a.dirtyT-b.dirtyT).forEach(r=>{if(hk>0){r.dirtyT--;if(r.dirtyT<=0)r.status='clean';hk--;}});
  prop.rooms.filter(r=>r.status==='maintenance').forEach(r=>{r.maintT-=maintSpeed(prop);if(r.maintT<=0){r.status='dirty';r.dirtyT=1;r.cond=clamp(r.cond+rnd(10,25),0,100);feed('🔧 Room '+r.id+' maintenance complete.','pos');}});
  prop.rooms.filter(r=>r.status==='occupied').forEach(r=>{const g=r.guest;if(!g)return;const noise=prop.loc.noise*(1-facBoost(prop,'sat')*.01)-(r.comp&&r.comp.soundproof?.25:0);if(noise>g.quiet+.15&&Math.random()<.04)g.sat-=rnd(.5,2);if(r.cond<60&&Math.random()<.05)g.sat-=rnd(.5,1.5);});
  G.eventCooldown--;
  if(G.eventCooldown<=0&&!G.paused){if(Math.random()<.14){triggerEvent(prop);G.eventCooldown=ri(8,18);}else G.eventCooldown=ri(3,7);}
  accrueHourlyCost(prop);
}

/* ---------------- DAY ROLLOVER (override) ---------------- */
function dayRollover(){
  const prop=P();
  prop.revYest=prop.revToday;prop.expYest=prop.expToday;
  G.finHist.push({day:G.day-1,rev:prop.revToday,exp:prop.expToday,cash:G.cash});
  if(G.finHist.length>120)G.finHist.shift();
  if(prop.reviews.length){const recent=prop.reviews.slice(-12);const avgR=recent.reduce((s,r)=>s+r.stars,0)/recent.length;const target=avgR*20;prop.reputation+=(target-prop.reputation)*.12-prop.incidents*.3;prop.reputation=clamp(prop.reputation,0,100);}
  prop.incidents=Math.max(0,prop.incidents-1);
  competitorAI(prop);
  for(const role in prop.staff)prop.staff[role].forEach(s=>{const load=workload(prop);s.morale=clamp(s.morale+(load>1.1?-1.5:.6)+rnd(-.5,.5),20,100);});
  prop.rooms.forEach(r=>{if(r.status==='renovation'){r.renoT--;if(r.renoT<=0){r.status='clean';r.cond=100;if(r._renoGain>=26){const qi=QUALITY.findIndex(q=>q.name===r.q.name);if(qi<QUALITY.length-1)r.q=QUALITY[qi+1];}logEvent(prop,'service','Room '+r.id+' reopened after renovation.');feed('✨ Room '+r.id+' reopened after renovation.','pos');}}});
  captureAnalytics(prop);buildDailyReport(prop);updateChain();bookingConfidenceDrift(prop);
  prop.revToday=0;prop.expToday=0;
  prop._arrToday=0;prop._depToday=0;prop._compToday=0;prop._satSum=0;prop._satN=0;prop.commToday=0;
  scheduleDay();
  feed('— Day '+G.day+' begins. '+prop.expectedToday+' bookings expected. Season index '+G.seasonNow.toFixed(2)+'. —','gold');
  if(G.cash<-500000)gameOver();
}

/* ---------------- REPEAT GUEST DB ---------------- */
function writeGuestDB(prop,g){
  const key=g.name+'|'+g.type;const db=G.guestDB;let e=db[key];
  if(!e){e={name:g.name,type:g.type,stays:0,totalSpend:0,complaints:0,satSum:0,avgSat:70,favRT:null,rtCount:{},loyalty:null,firstDay:G.day};db[key]=e;if(G.chain)G.chain.loyaltyMembers++;}
  e.stays++;e.totalSpend+=g.price*g.nights+(g.extraRev||0);e.complaints+=g.complaints||0;
  e.satSum+=g.sat;e.avgSat=e.satSum/e.stays;
  const rm=prop.rooms.find(r=>r.id===g.roomId);const rtype=g.favRT||(rm?rm.type:'standard');
  e.rtCount[rtype]=(e.rtCount[rtype]||0)+1;e.favRT=Object.keys(e.rtCount).sort((a,b)=>e.rtCount[b]-e.rtCount[a])[0];
  const L=loyaltyTier(e.stays);e.loyalty=L?L.name:null;
  prop._satSum=(prop._satSum||0)+g.sat;prop._satN=(prop._satN||0)+1;
}

/* ---------------- SATISFACTION & REVIEWS (override) ---------------- */
function finalizeStay(prop,room,g){
  const gt=GUEST_TYPES[g.type];let sat=g.sat;
  const q=roomQ(room);
  let exp=ROOMTYPES[room.type].exp*gt.clean*G.D.exp*(g.expM||1);
  if(g.loyalty)exp+=(g.prior||0)*.6;
  sat+=(q-exp)*.5;
  const mkt=marketRate(prop,room.type);
  sat-=clamp((g.price/mkt-1),-.4,1.2)*22*g.sens*.6;
  const hk=clamp(cleanCapacity(prop)/Math.max(1,prop.rooms.length)*100,30,100);
  sat+=(hk-65)*.18*g.clean;
  sat+=(avgSkill(prop,'frontdesk')-65)*.16;
  const wants=gt.prefer.filter(f=>prop.facilities.includes(f)).length;
  sat+=wants*3+facBoost(prop,'sat')*.15;
  let compVal=0;for(const k in (room.comp||{}))if(room.comp[k]&&COMPONENTS[k]&&COMPONENTS[k].val.includes(g.type))compVal+=2.4;
  sat+=Math.min(compVal,14);
  let noise=prop.loc.noise-(room.comp&&room.comp.soundproof?.3:0);
  sat-=clamp(noise-g.quiet,0,1)*14;
  g.sat=clamp(sat,0,100);
  if(g.sat<45)g.complaints=(g.complaints||0)+1;
  let extra=0;
  prop.facilities.forEach(f=>{if(FACILITIES[f].rev&&Math.random()<.5)extra+=rnd(300,1500)*(gt.budgetF);});
  if(prop.policies.breakfast==='alacarte'||prop.policies.breakfast==='buffet')extra+=rnd(150,500)*g.nights;
  if(prop.policies.laundry==='paid'&&Math.random()<.4)extra+=rnd(200,700);
  if(prop.policies.roomsvc24&&Math.random()<.3)extra+=rnd(250,900);
  g.extraRev=Math.round(extra);
  g.aspects=buildAspects(prop,room,g,hk);
  const reviewChance=g.reviewT*(.4+Math.abs(g.sat-65)/65)*G.D.harsh*.9;
  if(Math.random()<clamp(reviewChance,.05,.95))leaveReview(prop,g,room);
  feed((g.sat>75?'😊':g.sat>50?'😐':'😞')+' '+g.name+' checked out — satisfaction '+Math.round(g.sat)+'%.',g.sat>70?'pos':g.sat>45?'info':'neg');
}
function buildAspects(prop,room,g,hk){
  const has=f=>prop.facilities.includes(f);const a={};
  a.cleanliness=hk>75?1.5:hk>55?.3:-1.5;
  a.staff=(avgSkill(prop,'frontdesk')>72?1.3:avgSkill(prop,'frontdesk')<55?-1.2:0)-(g.queued?1:0);
  a.wifi=(has('wifi')||room.comp.fastwifi)?1:-.6;
  a.noise=(prop.loc.noise-(room.comp.soundproof?.3:0))>g.quiet?-1.3:.6;
  a.bathroom=(room.comp.rainshower||room.comp.bathtub||room.comp.fittings)?1.2:roomQ(room)<55?-1:0;
  a.breakfast=(prop.policies.breakfast==='included'||prop.policies.breakfast==='buffet'||has('breakfast'))?1:prop.policies.breakfast==='unavailable'?-.5:0;
  a.restaurant=has('restaurant')?1:0;
  a.roomservice=has('roomsvc')?.9:0;
  a.parking=g.vehicle?(g.parked==='none'?-1.5:(prop.parking&&prop.parking.spaces>0)?.8:.2):0;
  return a;
}
function leaveReview(prop,g,room){
  let s=g.sat-(G.D.harsh-1)*8;
  const stars=clamp(Math.round(s/20+rnd(-.3,.3)),1,5);
  const rv=reviewText(stars,g,room,prop);
  prop.reviews.push({stars,title:rv.title,txt:rv.body,who:g.name,type:g.type,day:G.day,channel:g.channel,aspects:g.aspects||{}});
  if(prop.reviews.length>240)prop.reviews.shift();
  prop.rating=prop.reviews.reduce((a,r)=>a+r.stars,0)/prop.reviews.length;
  logEvent(prop,'review',g.name+' left '+stars+'★: "'+rv.title+'"');
  feed('★ '+g.name+' left a '+stars+'-star review.',stars>=4?'pos':stars<=2?'neg':'info');
  renderTopbar();
}
function reviewText(stars,g,room,prop){
  const rt=ROOMTYPES[room.type].name.toLowerCase();
  const TIT={5:['Fantastic stay','Exceeded expectations','Would book again','Truly memorable'],
    4:['Very good stay','Pleasant experience','Solid choice','Comfortable and clean'],
    3:['Decent but average','An okay stay','Fair for the price','Room to improve'],
    2:['Disappointing','Below expectations','Not great','Needs work'],
    1:['Poor experience','Best avoided','Very disappointing','Would not return']};
  const OPEN={5:['Genuinely impressed with everything.','One of the better stays I have had.'],
    4:['A comfortable, well-run hotel.','Good value and friendly service.'],
    3:['It did the job, nothing more.','An average stay overall.'],
    2:['A few things let this place down.','Expected more for what I paid.'],
    1:['A frustrating stay from start to finish.','Multiple problems during my stay.']};
  const A=g.aspects||{};const ap=[];
  const ment=(k,pos,neg)=>{if(A[k]>=1&&pos)ap.push(pos);else if(A[k]<=-1&&neg)ap.push(neg);};
  ment('cleanliness','The room was spotless.','Cleanliness was below par.');
  ment('staff','Staff were warm and efficient.','The front desk was slow and indifferent.');
  ment('wifi','Wi-Fi was fast and reliable.','The Wi-Fi barely worked.');
  ment('noise','It was quiet and restful.','Noise made it hard to sleep.');
  ment('bathroom','Loved the bathroom.','The bathroom needs attention.');
  ment('breakfast','Breakfast was a great touch.','No proper breakfast option.');
  ment('restaurant','The restaurant was excellent.','');
  ment('roomservice','Room service was prompt.','');
  ment('parking','Parking was convenient.','Parking was full when I arrived.');
  let body=pick(OPEN[stars]);
  if(g.returning)body='Back again — '+body.charAt(0).toLowerCase()+body.slice(1);
  const chosen=ap.filter(Boolean).sort(()=>Math.random()-.5).slice(0,2);
  if(chosen.length)body+=' '+chosen.join(' ');
  if(stars>=4&&prop.facilities.length>3&&Math.random()<.3)body+=' The amenities were a nice bonus.';
  if(g.upgraded&&Math.random()<.5)body+=' Appreciated the complimentary upgrade.';
  return {title:pick(TIT[stars]),body:body.trim()+' ('+rt+' room)'};
}

/* ---------------- COMPETITOR AI + FOG OF WAR ---------------- */
const DIFF_FOG={easy:['rating','price','fac'],normal:['rating'],hard:[]};
function ensureIntel(prop){
  prop.comps.forEach(co=>{
    if(co.occ==null)co.occ=clamp(rnd(.4,.85),.2,.97);
    if(co.facN==null)co.facN=ri(2,5);
    if(co.cash==null)co.cash=rnd(.6,1.3);
    if(!co.viz){co.viz={};(DIFF_FOG[G.diff]||[]).forEach(f=>co.viz[f]=1e9);}
  });
}
function knows(co,f){return co.viz&&co.viz[f]&&co.viz[f]>=G.day;}
function competitorAI(prop){
  ensureIntel(prop);
  prop.comps.forEach(co=>{
    co.cash+=rnd(-.04,.05);
    const gap=(prop.rating||3)-co.rating;let act=null;
    if(Math.random()<.2){
      const roll=Math.random();
      if(gap>.35&&roll<.4&&co.cash>.5){co.rating=clamp(co.rating+rnd(.04,.12),2.4,4.9);co.cash-=.14;act='renovated rooms';}
      else if(roll<.56){co.priceIdx=clamp(co.priceIdx+(gap>0?-.05:.04),.55,2);act=gap>0?'cut prices':'raised rates';}
      else if(roll<.7){co.strength=clamp((co.strength||1)+.05,.6,1.7);co.cash-=.07;act='hired staff';}
      else if(roll<.82){co.promo=ri(2,5);co.priceIdx=clamp(co.priceIdx-.08,.55,2);act='launched a promo';}
      else if(roll<.9&&co.cash>1.1){co.rating=clamp(co.rating+.05,2.4,4.9);co.facN++;co.cash-=.22;act='added a facility';}
      else if(co.cash<.35){co.rating=clamp(co.rating-rnd(.04,.1),2.2,4.9);act='cut back amid losses';}
    }
    if(co.promo){co.promo--;if(co.promo<=0)co.priceIdx=clamp(co.priceIdx+.08,.55,2);}
    co.occ=clamp(co.occ+rnd(-.06,.06),.2,.98);
    if(act){co.lastAct=act;co.lastActDay=G.day;if(knows(co,'rating')||knows(co,'price'))feed('🏨 '+co.name+' '+act+'.','warn');}
  });
}
window.research=kind=>{
  const prop=P();const C={market:40000,mystery:25000,web:8000,report:60000}[kind];
  if(G.cash<C){toast('Not enough cash for this research.','neg');return;}
  G.cash-=C;prop.expToday+=C;ensureIntel(prop);
  const setv=(co,fs,days)=>fs.forEach(f=>co.viz[f]=G.day+days);
  if(kind==='market'){prop.comps.forEach(co=>setv(co,['rating','price'],30));logDecision('Market research',C,'Reveal rival ratings & pricing','Intel for 30 days','Sharper positioning');}
  if(kind==='mystery'){const co=prop.comps.slice().sort((a,b)=>b.rating-a.rating)[0];setv(co,['fac','occ','rating'],20);logDecision('Mystery guest at '+co.name,C,'Deep-dive strongest rival','20-day intel','Quality benchmark');}
  if(kind==='web'){prop.comps.forEach(co=>setv(co,['price','promo'],10));logDecision('Website inspection',C,'Check rival rates & promos','10-day price intel','React to promos');}
  if(kind==='report'){prop.comps.forEach(co=>setv(co,['rating','price','occ','fac'],45));logDecision('Industry report',C,'Full market visibility','45-day full intel','Strategic planning');}
  toast('Intelligence updated.','pos');renderAll();
};

/* ---------------- ANALYTICS / REPORTS / CHAIN ---------------- */
function captureAnalytics(prop){
  const total=prop.rooms.length||1;
  const occR=occupied(prop)/total*100;
  const sold=prop.rooms.filter(r=>r.status==='occupied'&&r.guest);
  const adrV=sold.length?sold.reduce((s,r)=>s+r.guest.price,0)/sold.length:avgPrice(prop);
  const sat=prop._satN?prop._satSum/prop._satN:(prop.analytics.length?prop.analytics[prop.analytics.length-1].sat:70);
  prop.analytics.push({day:G.day-1,occ:occR,adr:adrV,revpar:adrV*occR/100,rev:prop.revYest,exp:prop.expYest,
    profit:prop.revYest-prop.expYest,sat,rep:prop.reputation,rating:prop.rating||0,complaints:prop._compToday||0,arrivals:prop._arrToday||0});
  if(prop.analytics.length>400)prop.analytics.shift();
}
function marketShare(prop){
  const mine=(prop.rating||3)+prop.reputation/40;
  const tot=prop.comps.reduce((s,c)=>s+c.rating+(c.strength||1),mine);
  return mine/tot*100;
}
function buildDailyReport(prop){
  const total=prop.rooms.length||1;
  const compNews=prop.comps.filter(c=>c.lastActDay===G.day-1).map(c=>c.name+' '+c.lastAct);
  const prevRating=prop._prevRating!=null?prop._prevRating:prop.rating;
  prop.lastReport={day:G.day-1,
    fin:{rev:prop.revYest,exp:prop.expYest,profit:prop.revYest-prop.expYest,comm:prop.commToday||0},
    ops:{occ:Math.round(occupied(prop)/total*100),arr:prop._arrToday||0,dep:prop._depToday||0,clean:prop.rooms.filter(r=>r.status==='clean').length,dirty:prop.rooms.filter(r=>r.status==='dirty').length},
    svc:{complaints:prop._compToday||0,queuePeak:prop.queuePeak||0,cancellations:prop.cancellations||0},
    gx:{ratingChg:+(((prop.rating||0)-prevRating).toFixed(2)),rating:prop.rating||0,sat:prop._satN?Math.round(prop._satSum/prop._satN):'—',reviews:prop.reviews.filter(r=>r.day===G.day-1).length},
    comp:{marketShare:marketShare(prop),news:compNews}};
  prop._prevRating=prop.rating;prop.queuePeak=0;
  if(!prop.reportHist)prop.reportHist=[];prop.reportHist.unshift(prop.lastReport);if(prop.reportHist.length>40)prop.reportHist.pop();
}
function updateChain(){
  const ps=G.properties;
  G.chain.rep=ps.reduce((s,p)=>s+p.reputation,0)/ps.length;
  let camp=0;G.chain.campaigns=(G.chain.campaigns||[]).filter(c=>{c.left--;if(c.left>0){camp+=c.boost;return true;}return false;});
  const avgRating=ps.reduce((s,p)=>s+(p.rating||0),0)/ps.length;
  G.chain.brand=clamp(G.chain.brand+(ps.length-1)*.05+(avgRating-3.5)*.1+camp-.03,0,100);
}
function bookingConfidenceDrift(prop){
  const cancelRate=prop.cancellations/Math.max(1,prop.lifetimeGuests+prop.cancellations);
  prop.bookingConfidence=clamp((prop.bookingConfidence||70)+((1-cancelRate*3)*2-1),0,100);
}

  if(G.cash<spec[0]){toast('Not enough cash.','neg');return;}

  logDecision(kind[0].toUpperCase()+kind.slice(1)+' renovation, Room '+id,spec[0],'Lift room condition & appeal','Offline '+spec[1]+'d','Higher rate & satisfaction');

window.buyFac=f=>{const p=P(),fc=FACILITIES[f];let cost=fc.build;if(G.facDiscount)cost=Math.round(cost*(1-G.facDiscount));
  if(G.cash<cost){toast('Not enough cash to build '+fc.name+'.','neg');return;}
  G.cash-=cost;p.expToday+=cost;p.facilities.push(f);

  p.reputation=clamp(p.reputation+fc.rep*.4,0,100);
  if(G.facDiscount){G.facDiscount=0;toast('Central purchasing discount applied.');}
  logEvent(p,'decision',fc.name+' built.');toast(fc.name+' built.','pos');renderAll();};

/* ---------------- CHECK-IN PROBABILITY CURVE ---------------- */
function checkinWeights(prop){
  const T=prop.policies.checkinTime||14,shift=T-14;
  const base={0:.15,1:.1,2:.1,3:.1,4:.1,5:.15,6:.3,7:.5,8:1,9:1.4,10:2.2,11:3.6,12:4.6,13:4.8,14:4.2,15:3,16:2.4,17:1.8,18:1,19:.6,20:.4,21:.35,22:.3,23:.2};
  const w={};
  for(let h=0;h<24;h++){const src=clamp(Math.round(h-shift),0,23);w[h]=base[src]||.2;}
  const air=prop.loc.name==='Airport Zone',biz=(prop.city.biz>.45||prop.loc.name==='Business District');
  for(let h=0;h<24;h++){if(air&&(h>=20||h<=2))w[h]+=1.2;if(biz&&h>=17&&h<=21)w[h]+=.8;}
  return w;
}
function sampleHour(prop){const w=checkinWeights(prop);let tot=0;for(let h=0;h<24;h++)tot+=w[h];let r=Math.random()*tot;for(let h=0;h<24;h++){r-=w[h];if(r<=0)return clamp(h,6,23);}return 13;}

/* pickChannel override: + direct-booking marketing boost */
function pickChannel(prop,weekend){
  const w={};
  CH_ORDER.forEach(k=>{const C=CHANNELS[k];let v=C.vol;
    if(C.weekday)v*=weekend?.4:1.5;
    if(k==='ota')v*=1+prop.city.tour*.3;
    if(k==='direct')v*=1+prop.reputation/100*.5+(prop.directBoost||0);
    if(k==='walkin')v*=1+prop.loc.transW*.6;
    w[k]=v;});
  let tot=0;for(const k in w)tot+=w[k];
  let r=Math.random()*tot;for(const k in w){r-=w[k];if(r<=0)return k;}return 'direct';
}

/* scheduleDay override: curve arrivals, configurable checkout, same-room returns, channel stats */
function scheduleDay(){
  const prop=P();
  buildReturnPool();
  G.seasonNow=seasonFactor(G.day,prop.city,prop.loc);
  prop.channelStats=prop.channelStats||{};
  const total=prop.rooms.length||1;
  let demandIdx=prop.city.dem*prop.loc.dem*G.seasonNow*repFactor(prop)*compFactor(prop)*G.D.demM;
  demandIdx*=(1+facBoost(prop,'dem'));
  demandIdx*=(1+(G.chain?G.chain.brand:0)/100*.5);
  const weekend=(G.dow>=5);
  demandIdx*=weekend?(1+prop.city.tour*.25):(1+prop.city.biz*.12);
  let attempts=Math.round(total*1.6*clamp(demandIdx,.2,2.3)*rnd(.8,1.2));
  attempts=clamp(attempts,prop.rooms.length?1:0,total*3);
  const arrivals=[],chCount={};const overbook=prop.policies.overbook||0;let booked=0;
  for(let i=0;i<attempts;i++){
    const g=genGuest(prop);
    g.nights=clamp(ri(GUEST_TYPES[g.type].nights[0],GUEST_TYPES[g.type].nights[1]),prop.policies.minStay||1,prop.policies.maxStay||30);
    let cand=prop.rooms.filter(r=>r.status==='clean'&&priceOK(prop,r,g)&&!arrivals.find(a=>a.roomId===r.id));
    if(!cand.length){if(overbook>0&&booked<total+overbook){cand=prop.rooms.filter(r=>!arrivals.find(a=>a.roomId===r.id)&&priceOK(prop,r,g));}if(!cand.length)continue;}
    if(g.returning&&g.favRT){const same=cand.filter(r=>r.type===g.favRT);if(same.length)cand=same;}
    cand.sort((a,b)=>scoreFor(g,b)-scoreFor(g,a));
    const room=cand[0];
    let willing=bookWillingness(prop,room,g);
    if(prop.policies.cancelType==='nonref')willing*=.9;
    if(prop.policies.payment==='full')willing*=.92;
    if(prop.policies.cancelType==='flexible')willing*=1.04;
    if(g.loyalty)willing*=1.08;
    const st=prop.channelStats[g.channel]=prop.channelStats[g.channel]||{bookings:0,cancels:0,satSum:0,satN:0,revenue:0,repeat:0};
    if(Math.random()<willing){
      g.roomId=room.id;
      g.arrHour=sampleHour(prop);
      g.depDay=G.day+g.nights;g.depHour=clamp((prop.policies.checkoutTime||11)+ri(-1,1),6,14);
      g.price=prop.prices[room.type];
      if(g.loyalty){const L=LOYALTY.find(x=>x.name===g.loyalty);if(L)g.price=Math.round(g.price*(1-L.disc));}
      const depFrac=prop.policies.payment==='full'?1:prop.policies.payment==='partial'?.3:0;
      g.deposit=Math.round(g.price*g.nights*depFrac);g.bookingAmt=g.price*g.nights;
      const cancelP=CHANNELS[g.channel].cancel*(prop.policies.cancelType==='nonref'?.5:prop.policies.cancelType==='flexible'?1.15:1);
      if(Math.random()<cancelP){
        prop.cancellations=(prop.cancellations||0)+1;st.cancels++;
        const keepFr=prop.policies.cancelType==='flexible'?0:prop.policies.cancelType==='partial'?.5:1;
        if(keepFr>0&&g.deposit>0){const keep=Math.round(g.deposit*keepFr);G.cash+=keep;prop.revToday+=keep;logEvent(prop,'finance',g.name+' cancelled — deposit '+cr0(keep)+' retained.');}
        else logEvent(prop,'booking',g.name+' cancelled (refundable).');
        continue;
      }
      st.bookings++;if(g.returning)st.repeat++;
      g.checkedIn=false;arrivals.push(g);booked++;chCount[g.channel]=(chCount[g.channel]||0)+1;
    }
  }
  G.pendingArrivals=arrivals;prop.expectedToday=arrivals.length;prop.chCountToday=chCount;
  ensureIntel(prop);
}

/* ---------------- SATISFACTION (override: F&B, returns, maintenance, channel) ---------------- */
function fnbQuality(prop){const s=prop.staff.fnb||[];if(!s.length)return 42;return clamp(s.reduce((a,x)=>a+x.skill*(x.morale/100),0)/s.length,30,98);}
function finalizeStay(prop,room,g){
  const gt=GUEST_TYPES[g.type];let sat=g.sat;
  const q=roomQ(room);
  let exp=ROOMTYPES[room.type].exp*gt.clean*G.D.exp*(g.expM||1);
  if(g.loyalty)exp+=(g.prior||0)*.6;
  sat+=(q-exp)*.5;
  const mkt=marketRate(prop,room.type);
  sat-=clamp((g.price/mkt-1),-.4,1.2)*22*g.sens*.6;
  let hkv=clamp(cleanCapacity(prop)/Math.max(1,prop.rooms.length)*100,30,100);
  if(prop.hk&&prop.hk.inspection)hkv=clamp(hkv+8,30,100);
  sat+=(hkv-65)*.18*g.clean;
  sat+=(avgSkill(prop,'frontdesk')-65)*.16;
  const wants=gt.prefer.filter(f=>prop.facilities.includes(f)).length;
  sat+=wants*3+facBoost(prop,'sat')*.15;
  let compVal=0;for(const k in (room.comp||{}))if(room.comp[k]&&COMPONENTS[k]&&COMPONENTS[k].val.includes(g.type))compVal+=2.4;
  sat+=Math.min(compVal,16);
  let noise=prop.loc.noise-(room.comp&&room.comp.soundproof?.3:0);
  sat-=clamp(noise-g.quiet,0,1)*14;
  if(prop.maintBacklog&&prop.maintBacklog.some(is=>is.roomId===room.id))sat-=rnd(3,8);
  if(prop.facilities.includes('restaurant')||prop.facilities.includes('breakfast')){
    const fq=fnbQuality(prop);sat+=(fq-60)*.1;
    if(fq<50&&Math.random()<.4){prop.foodComplaints=(prop.foodComplaints||0)+1;sat-=rnd(1,4);}
  }
  if(g.type==='longstay'&&prop.facilities.includes('laundry')&&prop.policies.laundry!=='unavailable')sat+=3;
  if(g.returning){const e=G.guestDB[g.name+'|'+g.type];if(e&&g.sat<e.avgSat-8){sat-=3;g.declined=true;}else if(e&&g.sat>e.avgSat+8){sat+=2;g.improved=true;}}
  g.sat=clamp(sat,0,100);
  if(g.sat<45)g.complaints=(g.complaints||0)+1;
  let extra=0;
  prop.facilities.forEach(f=>{if(FACILITIES[f].rev&&Math.random()<.5)extra+=rnd(300,1500)*(gt.budgetF);});
  if(prop.facilities.includes('restaurant')||prop.facilities.includes('breakfast')){
    const b=rnd(120,420)*g.nights,l=prop.facilities.includes('restaurant')?rnd(0,500)*g.nights:0,dn=prop.facilities.includes('restaurant')?rnd(150,700)*g.nights:0;
    prop.fnbRev.breakfast+=b;prop.fnbRev.lunch+=l;prop.fnbRev.dinner+=dn;extra+=b+l+dn;
  }
  if(prop.policies.laundry==='paid'&&prop.facilities.includes('laundry')&&Math.random()<.4)extra+=rnd(200,700);
  if(prop.policies.roomsvc24&&prop.facilities.includes('roomsvc')&&Math.random()<.3)extra+=rnd(250,900);
  g.extraRev=Math.round(extra);
  g.aspects=buildAspects(prop,room,g,hkv);
  const st=prop.channelStats[g.channel];
  if(st){st.satSum=(st.satSum||0)+g.sat;st.satN=(st.satN||0)+1;st.revenue=(st.revenue||0)+(g.price*g.nights*(1-(CHANNELS[g.channel].comm||0)));}
  const reviewChance=g.reviewT*(.4+Math.abs(g.sat-65)/65)*G.D.harsh*.9;
  if(Math.random()<clamp(reviewChance,.05,.95))leaveReview(prop,g,room);
  feed((g.sat>75?'😊':g.sat>50?'😐':'😞')+' '+g.name+' checked out — satisfaction '+Math.round(g.sat)+'%.',g.sat>70?'pos':g.sat>45?'info':'neg');
}

const MAINT_ISSUES=[{t:'Leaky faucet',base:1200},{t:'AC not cooling',base:2500},{t:'Flickering lights',base:900},{t:'Clogged drain',base:1500},{t:'Door lock fault',base:1800},{t:'Wi-Fi dead spot',base:1100},{t:'Cracked tile',base:1400},{t:'Water heater issue',base:2200},{t:'Pest sighting',base:2600},{t:'TV not working',base:1000}];

function processMaintenance(prop){

    growth:{rooms:prop.rooms.length,facilities:prop.facilities.length,cash:G.cash},
    comp:{marketShare:marketShare(prop),news:compNews},
    best:best?best.who+' left '+best.stars+'★: "'+best.title+'"':'A steady day — no standout wins.',
    worst:(prop._compToday>0?prop._compToday+' complaint(s) handled today.':'No complaints — a clean operational day.'),
    opp,risk};
  prop._prevRating=prop.rating;prop.queuePeak=0;
  if(!prop.reportHist)prop.reportHist=[];prop.reportHist.unshift(prop.lastReport);if(prop.reportHist.length>40)prop.reportHist.pop();
}

/* ---------------- DAY ROLLOVER (override: + maintenance, channel decay) ---------------- */
function dayRollover(){
  const prop=P();
  prop.revYest=prop.revToday;prop.expYest=prop.expToday;
  G.finHist.push({day:G.day-1,rev:prop.revToday,exp:prop.expToday,cash:G.cash});
  if(G.finHist.length>120)G.finHist.shift();
  if(prop.reviews.length){const recent=prop.reviews.slice(-12);const avgR=recent.reduce((s,r)=>s+r.stars,0)/recent.length;const target=avgR*20;prop.reputation+=(target-prop.reputation)*.12-prop.incidents*.3;prop.reputation=clamp(prop.reputation,0,100);}
  prop.incidents=Math.max(0,prop.incidents-1);
  competitorAI(prop);
  for(const role in prop.staff)prop.staff[role].forEach(s=>{const load=workload(prop);s.morale=clamp(s.morale+(load>1.1?-1.5:.6)+rnd(-.5,.5),20,100);});
  prop.rooms.forEach(r=>{if(r.status==='renovation'){r.renoT--;if(r.renoT<=0){r.status='clean';r.cond=100;if(r._renoGain>=26){const qi=QUALITY.findIndex(q=>q.name===r.q.name);if(qi<QUALITY.length-1)r.q=QUALITY[qi+1];}logEvent(prop,'maintenance','Room '+r.id+' reopened after renovation.');feed('✨ Room '+r.id+' reopened after renovation.','pos');}}});
  const cashBefore=G.cash;
  prop.rooms.forEach(r=>{const used=r.status==='occupied'||r.cond<70;if(Math.random()<(used?.05:.015)+(r.cond<55?.04:0))spawnMaintIssue(prop,r);});
  if(prop.rooms.length&&Math.random()<.08)spawnMaintIssue(prop,null);
  processMaintenance(prop);
  prop._maintCostToday=Math.max(0,cashBefore-G.cash);
  if(prop.directBoost)prop.directBoost=Math.max(0,prop.directBoost-.02);
  captureAnalytics(prop);buildDailyReport(prop);updateChain();bookingConfidenceDrift(prop);
  prop.revToday=0;prop.expToday=0;
  prop._arrToday=0;prop._depToday=0;prop._compToday=0;prop._satSum=0;prop._satN=0;prop.commToday=0;
  scheduleDay();
  feed('— Day '+G.day+' begins. '+prop.expectedToday+' bookings expected. Season index '+G.seasonNow.toFixed(2)+'. —','gold');
  if(G.cash<-500000)gameOver();
}

/* ---------------- MANDATORY EVENT MODAL (override) ---------------- */
function showEvent(ev,prop){

  box.innerHTML=`<div class="mhead"><div class="mic" style="background:${ev.cl}22;color:${ev.cl}">${ev.ic}</div><div><h3>${ev.title}</h3><div class="ms">${ev.sub} · <span class="gold">decision required</span></div></div></div>

  $('#modal').style.display='flex';
  $('#modal').onclick=null; // mandatory — backdrop will not dismiss
  $$('.choice',box).forEach(b=>b.onclick=()=>{
    const ci=+b.dataset.i;ev.ch[ci].f(prop);

/* ---------------- BOOKING CHANNEL EVOLUTION (override) ---------------- */
function maturity(prop){
  const reviews=prop.reviews.length,age=G.day-(prop.bornDay||1);
  let m=0;
  m+=clamp(reviews/120,0,1)*.30;
  m+=clamp(((prop.rating||0)-3)/2,0,1)*.25;
  m+=clamp(prop.reputation/100,0,1)*.20;
  m+=clamp(age/240,0,1)*.10;
  m+=clamp((G.chain?G.chain.loyaltyMembers:0)/200,0,1)*.10;
  m+=clamp((prop.awareness||0)/100,0,1)*.05;
  return clamp(m,0,1);
}
function pickChannel(prop,weekend){
  const mt=maturity(prop),w={};
  CH_ORDER.forEach(k=>{const C=CHANNELS[k];let v=C.vol;
    if(C.weekday)v*=weekend?.4:1.5;
    if(k==='ota')v*=(1.3-mt*0.7)*(1+prop.city.tour*.3);
    if(k==='agent')v*=(1.2-mt*0.5);
    if(k==='walkin')v*=(1.1-mt*0.2)*(1+prop.loc.transW*.6);
    if(k==='direct')v*=(0.4+mt*1.6+(prop.directBoost||0)+(prop.awareness||0)/100*.4+prop.reputation/100*.3);
    if(k==='phone')v*=(0.6+mt*0.6);
    if(k==='corp')v*=(0.8+mt*0.3);
    w[k]=Math.max(.02,v);});
  let tot=0;for(const k in w)tot+=w[k];
  let r=Math.random()*tot;for(const k in w){r-=w[k];if(r<=0)return k;}return 'direct';
}

  const c=prop.city,l=prop.loc,weekend=(G.dow>=5);
