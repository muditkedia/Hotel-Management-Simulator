      const vis=C.series.filter(s=>!s.off);const all=vis.flatMap(s=>s.vals);
      const mn=Math.min(...all),mx=Math.max(...all),sp=(mx-mn)||1;
      const X=i=>8+i/(n-1)*(C.w-16),Y=v=>C.h-8-((v-mn)/sp)*(C.h-16-12);
      if(gl){gl.setAttribute('x1',X(idx));gl.setAttribute('x2',X(idx));gl.style.display='';}
      el.querySelectorAll('.gd').forEach((d,k)=>{const s=vis[k];if(!s){d.style.display='none';return;}d.setAttribute('cx',X(idx));d.setAttribute('cy',Y(s.vals[idx]));d.style.display='';});
      tip.innerHTML=`<b>${C.labels&&C.labels[idx]!=null?C.labels[idx]:'#'+idx}</b><br>`+vis.map(s=>`<span style="color:${s.color}">●</span> ${s.name}: <b>${C.fmt(s.vals[idx])}</b>`).join('<br>');
      tip.style.display='block';tip.style.left=clamp(cx+14,0,r.width-130)+'px';tip.style.top='18px';};
    svg.onmousemove=move;svg.ontouchstart=move;svg.ontouchmove=move;
    svg.onmouseleave=()=>{tip.style.display='none';if(gl)gl.style.display='none';el.querySelectorAll('.gd').forEach(d=>d.style.display='none');};

    const day=G.day+off;
    const onBooks=p.resv.filter(r=>r.day===day&&r.status==='ok').length;
    const cap=Math.round(p.rooms.length*(1+((p.policies.overbook||0)/Math.max(1,p.rooms.length))));
    const target=Math.round(p.rooms.length*clamp(projDemand(p,off)*.5,0,.85)*(1-off/24));
    let add=Math.max(0,Math.round((target-onBooks)*rnd(.15,.4)));
    while(add-->0){
      const rt=pick(RT_ORDER.filter(t=>p.rooms.some(r=>r.type===t)))||'standard';
      const lead=off,nights=ri(1,4);
      let rate=Math.round((p.prices[rt]||2000)*(lead>=7?(1-(p.rm.eb||0)/100):1));
      const ch=pick(['ota','ota','direct','corp','agent']);
      if(ch==='corp')rate=Math.round(rate*(1-(p.rm.corp||0)/100));
      const rec={id:resvSeq++,name:regionalName(p),type:ch==='corp'?'corporate':pick(['business','tourist','family','premium']),
        rt,day,nights,rate,channel:ch,lead,status:'ok',dep:0};
      if(onBooks+1>cap){p.waitlist.push(rec);if(p.waitlist.length>40)p.waitlist.shift();continue;}
      rec.dep=Math.round(rate*nights*resvDepFrac(p)); p.escrow+=rec.dep;

  }

  p.resv.forEach(r=>{

    if(Math.random()<cxP){

      if(r.dep>0&&p.policies.cancelType!=='flexible'){const keep=p.policies.cancelType==='partial'?Math.round(r.dep*.5):r.dep;G.cash+=keep;p.revToday+=keep;logEvent(p,'finance','Reservation cancelled — '+cr0(keep)+' of deposit retained.');}
      const w=p.waitlist.shift();
      if(w&&w.day===r.day){w.dep=Math.round(w.rate*w.nights*resvDepFrac(p));p.escrow+=w.dep;w.status='ok';p.resv.push(w);feed('📇 Waitlist guest confirmed for Day '+w.day+'.','pos');}
    } else if(Math.random()<.03){r.day+=pick([-1,1]);if(r.day<=G.day)r.day=G.day+1;r.modified=true;}

function computeIdentity(p){
  ensureV12(p);
  const mixT=Object.values(p._mix).reduce((a,b)=>a+b,0)||1;
  const sh=t=>(p._mix[t]||0)/mixT;
  const nights=(p._nightsSum||0)/Math.max(1,(p._nightsN||1));
  const cls=hotelClass(p).k;
  const cand=[];
  cand.push(['Business Hotel',(sh('business')+sh('corporate'))*2+(p.facilities.includes('businessctr')?.3:0)+(p.facilities.includes('conf')?.3:0)]);
  cand.push(['Airport Hotel',(p.loc.transW||0)*1.4+(p.facilities.includes('shuttle')?.6:0)+sh('transit')*1.5]);
  cand.push(['Budget Hotel',(cls==='budget'?1.2:0)+sh('budget')*1.6]);
  cand.push(['Luxury Hotel',(cls==='luxury'?1.4:0)+(sh('premium')+sh('vip'))*2+(p.facilities.includes('spa')?.3:0)]);
  cand.push(['Wedding Destination',sh('wedding')*3+(p.facilities.includes('banquet')?.6:0)]);
  cand.push(['Boutique Hotel',(cls==='upscale'&&p.rooms.length<=25?1:0)+((p.rating||0)>=4.3?.5:0)]);
  cand.push(['Long-Stay Residence',nights>3.2?1.3:0+sh('longstay')*2.5]);
  cand.push(['Conference Hotel',(p.facilities.includes('conf')?1:0)+sh('corporate')*1.2]);
  cand.sort((a,b)=>b[1]-a[1]);
  const [name,score]=cand[0];
  p.identity={name:score>.55?name:'Emerging Hotel',conf:clamp(score/1.6,0,1),tags:cand.slice(0,3).filter(c=>c[1]>.4).map(c=>c[0])};
  /* identity feeds demand through segment boosts (native genGuest hook) */
  p.segBoost=p.segBoost||{};
  const M={'Business Hotel':['business','corporate'],'Airport Hotel':['transit','business'],'Budget Hotel':['budget'],'Luxury Hotel':['premium','vip'],'Wedding Destination':['wedding','family'],'Boutique Hotel':['premium','tourist'],'Long-Stay Residence':['longstay','corporate'],'Conference Hotel':['corporate','business']};
  Object.keys(p.segBoost).forEach(k=>delete p.segBoost[k]);
  (M[p.identity.name]||[]).forEach(t=>p.segBoost[t]=.15*p.identity.conf);
}

   ======================================================================= */
function finExplain(p){
  const a=p.analytics;if(a.length<2)return [];
  const cur=a[a.length-1],prev=a[a.length-2];const out=[];
  const d=(x,y)=>Math.round((x||0)-(y||0));
  const revD=d(cur.rev,prev.rev),expD=d(cur.exp,prev.exp);
  if(Math.abs(revD)>500){
    const why=[];
    const occD=Math.round((cur.occ||0)-(prev.occ||0)),adrD=d(cur.adr,prev.adr);
    if(Math.abs(occD)>=3)why.push((occD>0?'+':'')+occD+'pt occupancy');
    if(Math.abs(adrD)>=50)why.push('ADR '+(adrD>0?'+':'')+cr0(adrD));
    const arrD=d(cur.arrivals,prev.arrivals);if(Math.abs(arrD)>=2)why.push((arrD>0?'+':'')+arrD+' arrivals');
    if(p._fnbInfo&&p._fnbPrev){const cd=(p._fnbInfo.covers||0)-(p._fnbPrev.covers||0);if(Math.abs(cd)>=4)why.push((cd>0?'+':'')+cd+' restaurant covers');}
    out.push({k:'Revenue',v:revD,why:why.length?why:['normal daily variance']});
  }
  if(Math.abs(expD)>500){
    const why=[];
    if((G._otYest||0)>200)why.push('overtime & night premiums '+cr0(G._otYest));
    const mD=d(cur.maintCost,prev.maintCost);if(Math.abs(mD)>800)why.push('maintenance '+(mD>0?'+':'')+cr0(mD));
    if((p.joins||[]).length===0&&(p._joinYest||0)>0)why.push((p._joinYest)+' new joiner(s) on payroll');
    const camp=(p.marketing&&p.marketing.campaigns||[]).length;if(camp)why.push(camp+' marketing campaign(s) running');
    if(Object.keys(p.invShort||{}).length)why.push('emergency procurement (stock-outs)');
    if((p.assets&&Object.values(p.assets).some(x=>x.down))?1:0)why.push('facility breakdown downtime');
    out.push({k:'Expenses',v:expD,why:why.length?why:['payroll & running costs']});
  }
  if(p._fnbInfo&&p._fnbPrev&&p.dept&&p.dept.restaurant){
    const pd=(p.dept.restaurant.daily||{}).profit||0,pp=p._prevDaily.restaurant||0;
    if(Math.abs(pd-pp)>800){const why=[];
      const cd=(p._fnbInfo.covers||0)-(p._fnbPrev.covers||0);if(cd)why.push((cd>0?'+':'')+cd+' covers');
      const ck=(p._fnbInfo.check||0)-(p._fnbPrev.check||0);if(Math.abs(ck)>20)why.push('avg check '+(ck>0?'+':'')+cr0(ck));
      if(p.invShort&&p.invShort.foodstock)why.push('ingredient stock-out');
      out.push({k:'Restaurant profit',v:Math.round(pd-pp),why:why.length?why:['menu & demand mix']});}
  }
  return out;
}

pickChannel=function(prop,weekend){
  const age=G.day||1, rev=(prop.reviews||[]).length, rat=prop.rating||0, aw=(prop.awareness||0), rep=prop.reputation||50;
  const w={};
  w.walkin=Math.max(.06,(1.35-Math.min(1,age/240))*(1+prop.loc.transW*.6));
  w.ota=(0.55+Math.min(.75,age/90))*(1+prop.city.tour*.25)*(rat?clamp(rat/4,.7,1.15):.85);
  w.agent=.22+Math.min(.25,age/300)+prop.city.tour*.15;
  w.phone=.05+Math.min(.4,age/220)+aw/100*.25;
  w.corp=(rep>=62&&rat>=3.7)?(.06+Math.min(.35,(age-40)/300)+rep/100*.2)*(weekend?.4:1.5):(weekend?.01:.03);
  w.direct=(rat>=3.9&&rev>=20)?clamp((rat-3.8)*.55+aw/100*.45+rep/100*.3+(prop.directBoost||0),0,w.ota*.6):.01+(prop.directBoost||0)*.3;
  CH_ORDER.forEach(k=>{w[k]=Math.max(.005,w[k]||.005);});
  let tot=0;for(const k in w)tot+=w[k];

const R_MAXDAY=12;
function dayHours(p,role,d){return p.roster[role][d].reduce((a,b)=>a+b,0);}
rNeed=function(p,role,dow,h){
  const rms=p.rooms.length;if(!rms)return 0;
  if(role==='frontdesk')return 1+(rms>=16&&h>=8&&h<=22?1:0)+(rms>=34?1:0);
  if(role==='housekeeping'){
    if(h>=8&&h<=17)return Math.max(1,Math.ceil(rms/10));
    if(h>=18&&h<=22)return rms>=8?1:0;
    return rms>=18?1:0; /* overnight turndown/laundry desk for larger hotels */
  }
  if(role==='maintenance')return (h>=9&&h<=18&&rms>=8)?1:0;
  if(role==='security'){
    if(h>=20||h<=5)return rms>=10?1:0;
    return rms>=30?1:0; /* big hotels keep day security too */
  }
  if(role==='fnb')return p.facilities.includes('restaurant')&&((h>=7&&h<=10)||(h>=12&&h<=15)||(h>=19&&h<=23))?Math.max(1,Math.ceil((p.fnb?p.fnb.seats:24)/26)):0;
  return 0;
};
autoFillRoster=function(p){
  p._rosterGap={};
  R_ROLES.forEach(role=>{
    const head=rHead(p,role);
    p.roster[role]=Array.from({length:7},()=>Array(24).fill(0));
    if(!head){let miss=0;for(let d=0;d<7;d++)for(let h=0;h<24;h++)miss+=rNeed(p,role,d,h);if(miss)p._rosterGap[role]={miss,why:'No '+ROLES[role].name.toLowerCase()+' on payroll — hire first.'};return;}
    let weekBudget=head*R_MAXWK;
    const dayBudget=Array(7).fill(head*R_MAXDAY);
    let missed=0;
    /* two passes: cover 1 person everywhere first, then top up to full need */
    for(let pass=0;pass<2;pass++){
      for(let d=0;d<7;d++)for(let h=0;h<24;h++){
        const need=Math.min(rNeed(p,role,d,h),head);
        const want=pass===0?Math.min(1,need):need;
        const cur=p.roster[role][d][h];
        let add=Math.max(0,want-cur);
        add=Math.min(add,weekBudget,dayBudget[d]);
        if(add>0){p.roster[role][d][h]=cur+add;weekBudget-=add;dayBudget[d]-=add;}
        if(pass===1)missed+=Math.max(0,need-p.roster[role][d][h]);
      }
    }
    if(missed>0){
      const per=R_MAXWK, needHeads=Math.ceil(missed/per);
      p._rosterGap[role]={miss:missed,why:head+' × '+ROLES[role].name.toLowerCase()+' can legally work '+(head*R_MAXWK)+'h/week ('+R_MAXWK+'h cap, '+R_MAXDAY+'h/day). Coverage needs '+missed+'h more — hire ~'+needHeads+' more.'};
    }
  });
};

chRender=function(id){
  const C=window.__CH[id];if(!C)return '';
  const vis=C.series.filter(s=>!s.off);const all=vis.flatMap(s=>s.vals);
  const w=C.w,h=C.h,padL=8,padR=8,padT=16,padB=16;
  if(!all.length||C.series[0].vals.length<2)return `<div class="chi" data-ch="${id}"><div class="muted sm">Collecting data…</div></div>`;
  let mn=Math.min(...all),mx=Math.max(...all);
  if(mn>0)mn=0; if(mx<0)mx=0; if(mx===mn)mx=mn+1;
  const sp=mx-mn,n=C.series[0].vals.length;
  const X=i=>padL+i/(n-1)*(w-padL-padR),Y=v=>padT+(1-(v-mn)/sp)*(h-padT-padB);
  const ticks=[0,.33,.66,1].map(t=>{const v=mn+sp*t;return `<line x1="${padL}" x2="${w-padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${w-padR}" y="${Y(v)-2}" text-anchor="end" font-size="10" fill="var(--mut2)">${C.fmt(v)}</text>`;}).join('');
  const zero=(mn<0&&mx>0)?`<line x1="${padL}" x2="${w-padR}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mut)" stroke-width="1.4"/><text x="${padL}" y="${Y(0)-3}" font-size="9.5" fill="var(--mut)">0</text>`:(mn===0?`<line x1="${padL}" x2="${w-padR}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mut)" stroke-width="1.2"/>`:'');
  const paths=vis.map(s=>`<path d="${s.vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2"/>`).join('');
  const dots=vis.map((s,si)=>`<circle class="gd" data-s="${si}" r="3.4" fill="${s.color}" style="display:none"/>`).join('');
  const xl=C.labels?[0,Math.floor((n-1)/2),n-1].map(i=>`<text x="${X(i)}" y="${h-3}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" font-size="9.5" fill="var(--mut2)">${C.labels[i]||''}</text>`).join(''):'';
  const leg=C.series.map((s,si)=>`<span class="chleg ${s.off?'off':''}" onclick="chToggle('${id}',${si})" style="color:${s.color}">● ${s.name}</span>`).join('');
  return `<div class="chi" data-ch="${id}" style="position:relative">
    <div class="wrapf" style="gap:10px;margin-bottom:2px">${leg}</div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-width:100%;touch-action:none">${ticks}${zero}<line class="gl" y1="${padT}" y2="${h-padB}" stroke="var(--mut2)" stroke-dasharray="3 3" style="display:none"/>${paths}${dots}${xl}</svg>
    <div class="chtip" style="display:none"></div></div>`;
};

finExplain=function(p){
  const a=p.analytics;if(a.length<2)return [];
  const cur=a[a.length-1],prev=a[a.length-2];const out=[];
  const d=(x,y)=>Math.round((x||0)-(y||0));
  const mk=(k,v,why,goodUp)=>out.push({k,v,why,goodUp});
  const revD=d(cur.rev,prev.rev),expD=d(cur.exp,prev.exp);
  if(Math.abs(revD)>500){const why=[];const occD=Math.round((cur.occ||0)-(prev.occ||0)),adrD=d(cur.adr,prev.adr);
    if(Math.abs(occD)>=3)why.push((occD>0?'+':'')+occD+'pt occupancy');
    if(Math.abs(adrD)>=50)why.push('ADR '+(adrD>0?'+':'')+cr0(adrD));
    const arrD=d(cur.arrivals,prev.arrivals);if(Math.abs(arrD)>=2)why.push((arrD>0?'+':'')+arrD+' arrivals');
    if(p._fnbInfo&&p._fnbPrev){const cd=(p._fnbInfo.covers||0)-(p._fnbPrev.covers||0);if(Math.abs(cd)>=4)why.push((cd>0?'+':'')+cd+' restaurant covers');}
    mk('Revenue',revD,why.length?why:['normal daily variance'],true);}
  if(Math.abs(expD)>500){const why=[];
    if((G._otYest||0)>200)why.push('overtime & night premiums '+cr0(G._otYest));
    const mD=d(cur.maintCost,prev.maintCost);if(Math.abs(mD)>800)why.push('maintenance '+(mD>0?'+':'')+cr0(mD));
    if((p._joinYest||0)>0)why.push(p._joinYest+' new joiner(s) on payroll');
    const camp=(p.marketing&&p.marketing.campaigns||[]).length;if(camp)why.push(camp+' marketing campaign(s) running');
    if(Object.keys(p.invShort||{}).length)why.push('emergency procurement (stock-outs)');
    if((p.assets&&Object.values(p.assets).some(x=>x.down)))why.push('facility breakdown downtime');
    mk('Expenses',expD,why.length?why:['payroll & running costs'],false);}
  if(p._fnbInfo&&p._fnbPrev&&p.dept&&p.dept.restaurant){
    const pd=(p.dept.restaurant.daily||{}).profit||0,pp=(p._prevDaily||{}).restaurant||0;
    if(Math.abs(pd-pp)>800){const why=[];
      const cd=(p._fnbInfo.covers||0)-(p._fnbPrev.covers||0);if(cd)why.push((cd>0?'+':'')+cd+' covers');
      const ck=(p._fnbInfo.check||0)-(p._fnbPrev.check||0);if(Math.abs(ck)>20)why.push('avg check '+(ck>0?'+':'')+cr0(ck));
      if(p.invShort&&p.invShort.foodstock)why.push('ingredient stock-out');
      mk('Restaurant profit',Math.round(pd-pp),why.length?why:['menu & demand mix'],true);}}
  return out;
};
