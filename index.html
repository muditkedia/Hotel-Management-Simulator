/* =======================================================================
   v30 — SUPPLIER MARKETPLACE (spec item #2)
   Replaces the single 3-tier "Supply Partner" with a live, per-category
   marketplace: competing suppliers with price / quality / delivery /
   reliability / credit terms / bulk discounts / minimum orders and an
   evolving reputation. Suppliers enter and exit the market; poor ones
   fail deliveries. Manager procurement picks suppliers by your buying
   strategy (cheapest / fastest / quality / reliable). Supplier quality
   feeds the kitchen and the workshop. Credit orders settle through a
   payables queue (P&L and cash recognised together at payment).
   ======================================================================= */

const SUP_N1=['Sharma','Metro','Prime','Golden','City','Apex','Crown','Delta','Everest','Falcon','Galaxy','Orient'];
const SUP_N2={'Bathroom':'Supplies','Housekeeping':'Textiles','Restaurant':'Foods','Laundry':'Chemicals','Maintenance':'Hardware'};
const SUP_CATS=['Bathroom','Housekeeping','Restaurant','Laundry','Maintenance'];
let supSeq=1;
function mkSupplier(cat,tilt){
  // tilt biases a new entrant toward one strength so the market stays interesting
  const t=tilt||pick(['cheap','fast','quality','reliable','balanced']);
  const s={id:'s'+(supSeq++),cat,name:pick(SUP_N1)+' '+(SUP_N2[cat]||'Trading'),
    priceM:+rnd(.88,1.14).toFixed(2),q:+rnd(.88,1.12).toFixed(2),lead:pick([-1,0,0,1,2]),
    rel:+rnd(.85,.985).toFixed(2),credit:pick([0,0,7,15]),bulk:pick([0,5,8,12]),minQ:pick([0,0,.25,.4]),rep:ri(40,70)};
  if(t==='cheap'){s.priceM=+rnd(.82,.92).toFixed(2);s.q=+rnd(.85,.97).toFixed(2);s.rel=+rnd(.84,.93).toFixed(2);}
  if(t==='fast'){s.lead=pick([-1,-1,0]);s.priceM=+rnd(1,1.14).toFixed(2);}
  if(t==='quality'){s.q=+rnd(1.05,1.15).toFixed(2);s.priceM=+rnd(1.04,1.18).toFixed(2);}
  if(t==='reliable'){s.rel=+rnd(.96,.99).toFixed(2);s.credit=pick([7,15]);s.priceM=+rnd(.98,1.1).toFixed(2);}
  return s;
}
function ensureSupMkt(){
  if(!G.supMkt){G.supMkt={};SUP_CATS.forEach(c=>{G.supMkt[c]=[mkSupplier(c,'cheap'),mkSupplier(c,'balanced'),mkSupplier(c,'quality'),mkSupplier(c,'reliable')];});}
  return G.supMkt;
}
function ensureSup(p){
  ensureSupMkt();
  if(!p.supSel){p.supSel={};SUP_CATS.forEach(c=>p.supSel[c]=G.supMkt[c][1]?G.supMkt[c][1].id:G.supMkt[c][0].id);}
  if(!p.procStrat)p.procStrat='reliable';
  if(!p.payables)p.payables=[];
  if(!p._supQ)p._supQ={};
}
function supOf(p,cat){ensureSup(p);const arr=G.supMkt[cat]||[];return arr.find(s=>s.id===p.supSel[cat])||arr[0];}
function supScore(s,strat){
  if(!s)return 0;
  if(strat==='cheapest')return 200-s.priceM*100-(s.minQ*20);
  if(strat==='fastest')return 100-(s.lead+1)*25+s.rel*20;
  if(strat==='quality')return s.q*100+s.rel*10-s.priceM*20;
  return s.rel*120+s.rep/4-s.priceM*20; // reliable (default)
}
window.setSupplierCat=(cat,id)=>{const p=P();ensureSup(p);p.supSel[cat]=id;
  const s=(G.supMkt[cat]||[]).find(x=>x.id===id);
  logEvent(p,'finance','Supplier for '+cat+': '+(s?s.name:id)+'.');toast('Supplier switched.','pos');renderTab();};
window.setProcStrat=k=>{const p=P();ensureSup(p);p.procStrat=k;
  logDecision('Buying strategy → '+k,0,'Manager procurement follows this stance','Suppliers re-picked at next order','Cost/speed/quality trade-off',['costs']);renderTab();};

/* ---- ordering through the selected supplier ---- */
window.reorderInv=k=>{
  const p=P(),it=p.inv[k],I=INV[k];ensureSup(p);
  const sup=supOf(p,I.cat);
  let qty=I.cap-it.stock;
  if(qty<=0){toast('Already full.');return;}
  if(sup&&sup.minQ&&qty<I.cap*sup.minQ)qty=Math.ceil(I.cap*sup.minQ); // minimum order quantity
  qty=Math.min(qty,I.cap); // never order past capacity headroom by much
  let unit=I.cost*(sup?sup.priceM:1);
  const bulky=sup&&sup.bulk&&qty>=I.cap*.7;
  if(bulky)unit*=(1-sup.bulk/100);
  const cost=Math.round(qty*unit);
  const lead=Math.max(1,I.lead+(sup?sup.lead:0));
  if(!sup||!sup.credit){ // cash order
    if(G.cash<cost){toast('Not enough cash.','neg');return;}
    G.cash-=cost;p.expToday+=cost;
  }else{ // credit order — settles after delivery + credit days
    p.payables.push({day:G.day+lead+sup.credit,amt:cost,name:(sup.name||'supplier')+' · '+I.name});
  }
  it.incoming=qty;it.incDays=lead;
  it._sup=sup?{name:sup.name,rel:sup.rel,lead:sup.lead,q:sup.q,id:sup.id}:null;
  logEvent(p,'finance','Ordered '+I.name+' from '+(sup?sup.name:'supplier')+' ('+cr0(cost)+(sup&&sup.credit?', '+sup.credit+'-day credit':'')+(bulky?', bulk discount':'')+').');
  toast(I.name+' ordered — arrives in '+lead+'d'+(sup&&sup.credit?' · payable in '+(lead+sup.credit)+'d':'')+'.','pos');renderTab();};

/* manager procurement: pick the best supplier per category by strategy, then order */
autoProcure=function(prop){
  ensureSup(prop);
  const eff=avgSkill(prop,'procurement')/100;
  SUP_CATS.forEach(cat=>{ // strategy-driven supplier selection (skilled managers switch smartly)
    const arr=G.supMkt[cat]||[];if(!arr.length)return;
    const best=arr.slice().sort((a,b)=>supScore(b,prop.procStrat)-supScore(a,prop.procStrat))[0];
    const cur=supOf(prop,cat);
    if(best&&cur&&best.id!==cur.id&&supScore(best,prop.procStrat)>supScore(cur,prop.procStrat)+8*(1.2-eff)){
      prop.supSel[cat]=best.id;
      logEvent(prop,'finance','Procurement switched '+cat+' supply to '+best.name+' ('+prop.procStrat+' strategy).');
    }});
  INV_ORDER.forEach(k=>{const it=prop.inv[k],I=INV[k];
    if(it.stock<=it.reorder&&it.incDays<=0){
      const sup=supOf(prop,I.cat);
      let qty=Math.round((I.cap-it.stock)*(.7+eff*.3));
      if(sup&&sup.minQ&&qty<I.cap*sup.minQ)qty=Math.ceil(I.cap*sup.minQ);
      let unit=I.cost*(sup?sup.priceM:1)*(1.1-eff*.2);
      if(sup&&sup.bulk&&qty>=I.cap*.7)unit*=(1-sup.bulk/100);
      const cost=Math.round(qty*unit);
      const lead=Math.max(1,I.lead+(sup?sup.lead:0));
      if(sup&&sup.credit){prop.payables.push({day:G.day+lead+sup.credit,amt:cost,name:sup.name+' · '+I.name});}
      else{if(G.cash<cost)return;G.cash-=cost;prop.expToday+=cost;}
      it.incoming=qty;it.incDays=lead;
      it._sup=sup?{name:sup.name,rel:sup.rel,lead:sup.lead,q:sup.q,id:sup.id}:null;
      logEvent(prop,'finance','Procurement ordered '+I.name+' from '+(sup?sup.name:'supplier')+' ('+cr0(cost)+').');
    }
  });
};

/* deliveries: per-order supplier drives early/late/failed; quality lands in _supQ */
v12Deliveries=function(p){
  ensureSup(p);
  INV_ORDER.forEach(k=>{const it=p.inv[k];if(!it)return;
    const s=it._sup||{rel:.95,lead:0,q:1,name:'supplier'};
    if(it.incDays>0){
      if(s.lead<0&&Math.random()<.4)it.incDays--;
      if(s.lead>0&&Math.random()<.25)it.incDays++;
      if(it.incDays<=1&&Math.random()>s.rel){
        if(Math.random()<.5){ it.incoming=Math.round(it.incoming*.7);
          feed('🚚 Partial delivery of '+INV[k].name+' — '+s.name+' shorted the order.','warn');
        }else{ it.incDays+=2;
          feed('🚚 '+s.name+' missed the '+INV[k].name+' delivery — 2 days late.','warn');}
        const cat=INV[k].cat,live=(G.supMkt[cat]||[]).find(x=>x.id===s.id);
        if(live)live.rep=clamp(live.rep-4,5,95);
      }
    }
    if(it.incDays<=1&&it.incoming>0){/* shipment landing — record its quality */
      p._supQ[INV[k].cat]=s.q;
      const live=(G.supMkt[INV[k].cat]||[]).find(x=>x.id===s.id);
      if(live)live.rep=clamp(live.rep+1,5,95);
    }
  });
  /* payables fall due */
  if(p.payables&&p.payables.length){
    const due=p.payables.filter(x=>x.day<=G.day);
    if(due.length){p.payables=p.payables.filter(x=>x.day>G.day);
      due.forEach(x=>{G.cash-=x.amt;p.expToday+=x.amt;logEvent(p,'finance','Paid supplier invoice: '+x.name+' — '+cr0(x.amt)+'.');});}
  }
};

/* =======================================================================
   v31 — CHAIN HQ DEPTH + LONG-TERM PROGRESSION (spec items #3 & #4)
   HQ: internal benchmarking with performance ranking, inter-property
   staff transfers, per-property capital allocation executed monthly by
   the regional office. Progression: Brand Prestige (0–100) built from
   nine measurable pillars, a five-tier brand ladder, chain valuation &
   market share, strategic milestones on the Goals page, and a franchise
   programme unlocked by prestige. Shared marketing/loyalty/procurement
   and the IPO layer already exist and are surfaced, not duplicated.
   ======================================================================= */

function ensureHQ2(){
  if(!G.hq)G.hq={regional:false,audits:0};
  if(!G.hq.budgets)G.hq.budgets={};
  if(!G.franchise)G.franchise={units:0,fees:0};
}
/* ---- benchmarking ---- */
function hqPerf(pp){
  const a=(pp.analytics||[]).slice(-30);
  const rev=a.reduce((s,x)=>s+(x.rev||0),0),prof=a.reduce((s,x)=>s+(x.profit||0),0);
  const occ=a.length?a.reduce((s,x)=>s+(x.occ||0),0)/a.length:0;
  const revpar=a.length?a.reduce((s,x)=>s+(x.revpar||0),0)/a.length:0;
  const goppar=pp.rooms.length?prof/30/Math.max(1,pp.rooms.length):0;
  return {occ:Math.round(occ),revpar,goppar,prof,rev,rating:pp.rating||0,rep:pp.reputation||0,
    score:Math.round(clamp(occ*.35+(pp.rating||0)*10+(pp.reputation||0)*.2+(prof>0?15:0),0,100))};
}
window.hqTransfer=(destIdx,role)=>{
  const src=P(),dest=G.properties[destIdx];
  if(!dest||dest===src)return;
  const pool=(src.staff[role]||[]);
  if(pool.length<=1){toast('Keep at least one '+ROLES[role].name.toLowerCase()+' at '+src.name+'.','warn');return;}
  pool.sort((a,b)=>b.skill-a.skill);
  const s=pool.pop(); // transfer the junior; the A-team stays
  if(!dest.staff[role])dest.staff[role]=[];
  dest.staff[role].push(s);
  logEvent(src,'decision',s.name+' ('+ROLES[role].name+') transferred to '+dest.name+'.');
  logEvent(dest,'decision',s.name+' ('+ROLES[role].name+') joined from '+src.name+'.');
  try{ensureV10(dest);rosterTopUp(dest,role);}catch(e){}
  toast(s.name+' transferred to '+dest.name+'.','pos');renderTab();};
window.hqBudget=(idx,v)=>{ensureHQ2();G.hq.budgets[idx]=Math.max(0,Math.round((+v||0)*(LOC.k||1)));
  logDecision('Capital allocation — '+(G.properties[idx]||{}).name,0,'Monthly upkeep budget '+cr(G.hq.budgets[idx]),'Regional office invests it monthly','Condition & stock held up remotely',['expansion']);renderTab();};

/* regional office spends allocated capital monthly: worst rooms first, then stock */
function hqRunBudgets(){
  ensureHQ2();
  if(!G.hq.regional)return;
  G.properties.forEach((pp,i)=>{
    if(pp===P())return;
    let bud=Math.min(G.hq.budgets[i]||0,Math.max(0,G.cash-500000));
    if(bud<=0)return;
    let spent=0;
    const perPt=Math.round(4000*(activeCountry().capex||1));   // cost per condition point
    pp.rooms.slice().sort((a,b)=>a.cond-b.cond).forEach(r=>{
      if(spent>=bud||r.cond>=88)return;
      const pts=Math.min(88-r.cond,Math.floor((bud-spent)/perPt));
      if(pts<=0)return;
      r.cond=clamp(r.cond+pts,0,100);spent+=pts*perPt;});
    if(spent<bud&&pp.inv){INV_ORDER.forEach(k=>{const it=pp.inv[k],I=INV[k];
      if(spent>=bud||!it||it.stock>I.cap*.5)return;
      const qty=Math.min(I.cap-it.stock,Math.floor((bud-spent)/I.cost));
      if(qty<=0)return;it.stock+=qty;spent+=Math.round(qty*I.cost);});}
    if(spent>0){G.cash-=spent;pp.expToday=(pp.expToday||0)+spent;
      logEvent(pp,'finance','Regional office invested '+cr0(spent)+' (allocated capital).');}
  });
}

/* ---- progression: prestige, tiers, valuation, market share, franchise ---- */
function chainValuation(){
  let prof=0;(G.properties||[]).forEach(pp=>{prof+=(pp.analytics||[]).slice(-30).reduce((s,x)=>s+(x.profit||0),0);});
  return Math.max(0,Math.round(chainAssets()+prof*12*6+(G.cash-((G.loans||[]).reduce((s,l)=>s+l.balance,0)))));
}
function marketShare(p){
  const mine=(G.properties||[]).reduce((s,pp)=>s+pp.rooms.length,0);
  const comps=(p.comps||[]).length*22; // competitor sets average ~22 keys
  return clamp(Math.round(mine/Math.max(1,mine+comps)*100),0,100);
}
function prestigePillars(p){
  const morale=(function(){let s=0,n=0;(G.properties||[]).forEach(pp=>{for(const r in pp.staff)pp.staff[r].forEach(x=>{s+=x.morale||70;n++;});});return n?s/n:70;})();
  const loyal=(typeof loyalMembers==='function')?loyalMembers().m:0;
  const corpN=(G.properties||[]).reduce((s,pp)=>s+((pp.corp&&pp.corp.contracts)||[]).length,0);
  const awardsN=(G.properties||[]).reduce((s,pp)=>s+((pp.awards||[]).filter(a=>a.until>=G.day).length),0);
  const green=(G.properties||[]).some(pp=>(pp.awards||[]).some(a=>a.id==='green'&&a.until>=G.day));
  const lux=(G.properties||[]).some(pp=>(pp.awards||[]).some(a=>a.id==='lux'&&a.until>=G.day));
  return [
   {n:'Guest rating',v:clamp(((p.rating||0)-3)*50,0,100),d:(p.rating||0).toFixed(2)+'★'},
   {n:'National reputation',v:clamp((G.chain?G.chain.rep:p.reputation),0,100),d:Math.round(G.chain?G.chain.rep:p.reputation)+'/100'},
   {n:'Brand awareness',v:clamp(G.chain?G.chain.brand:(p.awareness||0),0,100),d:Math.round(G.chain?G.chain.brand:(p.awareness||0))+'/100'},
   {n:'Awards & certifications',v:clamp(awardsN*18,0,100),d:awardsN+' held'+(green?' · green':'')+(lux?' · luxury':'')},
   {n:'Corporate accounts',v:clamp(corpN*16,0,100),d:corpN+' under contract'},
   {n:'Guest loyalty',v:clamp(loyal/3,0,100),d:loyal+' members'},
   {n:'Employee satisfaction',v:clamp((morale-40)*2,0,100),d:Math.round(morale)+'/100 morale'},
   {n:'Market share',v:clamp(marketShare(p)*4,0,100),d:marketShare(p)+'% of local keys'},
   {n:'Estate scale',v:clamp((G.properties||[]).length*18+((G.properties||[]).reduce((s,pp)=>s+pp.rooms.length,0))/2,0,100),d:(G.properties||[]).length+' hotel(s)'}
  ];
}
function brandPrestige(p){const ps=prestigePillars(p);return Math.round(ps.reduce((s,x)=>s+x.v,0)/ps.length);}
const BRAND_TIERS=[
 {min:0,n:'Local Guesthouse'},{min:25,n:'City Player'},{min:45,n:'Regional Brand'},
 {min:65,n:'National Chain'},{min:82,n:'Hospitality Icon'}];
function brandTier(pr){let t=BRAND_TIERS[0];BRAND_TIERS.forEach(x=>{if(pr>=x.min)t=x;});return t;}
/* franchising: prestige converts into fee income — and risk to the badge */
window.sellFranchise=()=>{
  const p=P();ensureHQ2();
  const pr=brandPrestige(p);
  if(pr<65||G.properties.length<2){toast('Franchisees want a National Chain badge — prestige 65+ and 2+ owned hotels.','warn');return;}
  const fee=Math.round(2000000*(activeCountry().capex||1));
  G.franchise.units++;G.cash+=fee;p.revToday+=fee;G.franchise.fees+=fee;
  logDecision('Franchise unit sold',0,'License the brand','Upfront '+cr(fee)+' + monthly royalties','Brand risk if standards slip',['finance','expansion']);
  feed('🏨 Franchise unit #'+G.franchise.units+' signed — '+cr(fee)+' upfront.','pos');renderTab();};
{const _v31CM=corpMonthly;corpMonthly=function(p){_v31CM(p);try{
  ensureHQ2();
  hqRunBudgets();
  if(G.franchise.units>0){
    const roy=Math.round(G.franchise.units*60000*(activeCountry().capex||1));
    G.cash+=roy;p.revToday+=roy;G.franchise.fees+=roy;
    logEvent(p,'finance','Franchise royalties: '+cr0(roy)+' ('+G.franchise.units+' unit'+(G.franchise.units>1?'s':'')+').');
    if((G.chain?G.chain.rep:p.reputation)<45&&Math.random()<.3){
      G.franchise.units--;feed('📉 A franchisee left the brand — chain reputation is too weak.','neg');}
  }
}catch(e){}};}

/* ---- HQ page: benchmarking, transfers, capital allocation, franchise ---- */
{const _v31HQ=tabHQ;tabHQ=function(p){let h=_v31HQ(p);try{
  ensureHQ2();
  if(G.properties.length<2)return h;
  const perf=G.properties.map((pp,i)=>({i,pp,f:hqPerf(pp)})).sort((a,b)=>b.f.score-a.f.score);
  const roles=R_ROLES.filter(r=>(P().staff[r]||[]).length>1);
  h+=`<div class="card" style="margin-top:12px"><h3>Internal Benchmarking — performance ranking</h3>
   <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Property</th><th>Occ 30d</th><th>RevPAR</th><th>GOPPAR</th><th>Rating</th><th>Score</th><th>Capital / mo</th><th>Staff transfer</th></tr></thead><tbody>
   ${perf.map((x,rank)=>`<tr${x.pp===P()?' style="outline:1px solid var(--gold);outline-offset:-1px"':''}>
     <td class="b">${rank+1}${rank===0?' 🏆':rank===perf.length-1&&perf.length>2?' ⚠':''}</td>
     <td class="b">${x.pp.name}<div class="muted sm">${x.pp.city.name}${x.pp===P()?' · active':''}</div></td>
     <td>${x.f.occ}%</td><td>${cr0(x.f.revpar)}</td><td>${cr0(x.f.goppar)}</td><td>${(x.f.rating||0).toFixed(2)}★</td>
     <td>${barInline(x.f.score,x.f.score>60?'#1e5c3a':x.f.score>35?'#b45f14':'#7a2430')} ${x.f.score}</td>
     <td>${x.pp===P()?'<span class="muted sm">—</span>':`<input type="number" min="0" step="${LOC.k>1?500:25000}" value="${Math.round((G.hq.budgets[x.i]||0)/(LOC.k||1))}" style="width:90px" onchange="hqBudget(${x.i},this.value)">`}</td>
     <td>${x.pp===P()?'<span class="muted sm">—</span>':(roles.length?`<select id="tr_${x.i}" style="max-width:110px">${roles.map(r=>`<option value="${r}">${ROLES[r].name}</option>`).join('')}</select> <button class="btn" style="padding:3px 8px;font-size:11px" onclick="hqTransfer(${x.i},document.getElementById('tr_${x.i}').value)">Send 1</button>`:'<span class="muted sm">no spare staff</span>')}</td>
    </tr>`).join('')}
   </tbody></table></div>
   <div class="muted sm" style="margin-top:4px">Transfers move the junior of the chosen role from the active hotel (their roster tops up automatically). Allocated capital is invested monthly by the regional office — worst rooms first, then stock — only while a regional manager is appointed.</div>
  </div>
  <div class="card" style="margin-top:12px"><h3>Franchise Programme</h3>
   ${row('Brand prestige',brandPrestige(p)+'/100 · '+brandTier(brandPrestige(p)).n)}
   ${row('Franchised units',G.franchise.units+' · lifetime fees '+cr(G.franchise.fees))}
   ${row('Sell a franchise','<button class="btn primary" style="padding:4px 12px" onclick="sellFranchise()">License the brand — '+cr(Math.round(2000000*(activeCountry().capex||1)))+' upfront</button>')}
   <div class="muted sm" style="margin-top:4px">Needs prestige 65+ (National Chain). Each unit pays ${cr(Math.round(60000*(activeCountry().capex||1)))}/month in royalties — but franchisees walk if chain reputation slides below 45.</div>
  </div>`;
}catch(e){}return h;};}

/* ---- Goals page: Brand Prestige ladder + strategic milestones ---- */
{const _v31TG=tabGoals;tabGoals=function(p){let h=_v31TG(p);try{
  const pr=brandPrestige(p),tier=brandTier(pr);
  const next=BRAND_TIERS.find(t=>t.min>pr);
  const pillars=prestigePillars(p);
  const ipoOK=(typeof ipoReqs==='function')?ipoReqs().filter(r=>r[1]).length:0;
  const ipoAll=(typeof ipoReqs==='function')?ipoReqs().length:0;
  h+=`<div class="card" style="margin-top:12px"><h3>Brand Prestige — the long game</h3>
   <div class="row"><span class="lab"><b style="font-size:16px">${tier.n}</b> <span class="muted sm">prestige ${pr}/100${next?' · '+(next.min-pr)+' to '+next.n:' · the summit'}</span></span>
    <span class="val" style="min-width:160px">${barInline(pr,'#8a6a1e')}</span></div>
   <div style="margin-top:6px">${pillars.map(x=>`<div class="row"><span class="lab">${x.n} <span class="muted sm">${x.d}</span></span><span class="val" style="min-width:130px">${barInline(Math.round(x.v),x.v>60?'#1e5c3a':x.v>30?'#b45f14':'#8e8e85')}</span></div>`).join('')}</div>
   ${row('Chain valuation',cr(chainValuation())+' <span class="muted sm">assets + 6× annualised profit − debt</span>')}
   ${row('IPO readiness',ipoAll?ipoOK+'/'+ipoAll+' listing requirements met (see HQ)':'—')}
   <div class="muted sm" style="margin-top:4px">Prestige is the average of nine pillars — every operational system feeds one. It unlocks franchising at 65 and marks the road from a single guesthouse to a hospitality icon.</div>
  </div>`;
}catch(e){}return h;};}
try{Object.assign(TIPS,{hq:{t:'Chain Headquarters',d:'Benchmark every hotel on occupancy, RevPAR, GOPPAR and rating; transfer staff between properties; allocate monthly capital that the regional office invests in the weakest rooms and stock; and license the brand as a franchise once prestige reaches National Chain level.'}});}catch(e){}

renderWiz();
