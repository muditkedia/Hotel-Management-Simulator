<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RASOI — Restaurant Operations Simulator</title>
<style>
:root{
  --bg:#f6f6f3;--bg2:#f1f1ec;--panel:#ffffff;--panel2:#f3f3ee;
  --line:#e3e3db;--line2:#d4d4ca;--ink:#151513;--mut:#5c5c55;--mut2:#8e8e85;
  --gold:#8a6a1e;--pos:#1e5c3a;--neg:#7a2430;--warn:#b45f14;--info:#44505c;
  --serif:Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9c9bf;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
#app{display:none;grid-template-columns:212px 1fr;grid-template-rows:56px 1fr;height:100vh}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
.tb-logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:32px;height:32px;border-radius:7px;background:#151513;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.tb-prop{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{display:flex;gap:0;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.kpis::-webkit-scrollbar{display:none}
.kpi{padding:0 13px;border-right:1px solid var(--line);cursor:pointer;flex:none}
.kpi:last-child{border-right:none}
.kpi .k{font-size:9.5px;letter-spacing:.7px;color:var(--mut2);text-transform:uppercase;font-weight:700}
.kpi .v{font-size:14.5px;font-weight:700;margin-top:1px;white-space:nowrap}
.kpi .v small{font-size:10px;color:var(--mut2);font-weight:500}
.up{color:var(--pos)}.down{color:var(--neg)}
.clockbox{display:flex;align-items:center;gap:9px;flex:none}
.clock .t{font-size:15px;font-weight:700}.clock .d{font-size:10px;color:var(--mut)}
.speeds{display:flex;gap:4px}
.sp{width:30px;height:30px;border-radius:4px;background:#fff;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.sp.on{background:#151513;color:#fff;border-color:#151513}
#side{background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:12px 0 22px}
.glab{font-size:9.5px;letter-spacing:1.1px;color:var(--mut2);font-weight:700;padding:12px 18px 4px}
.nav{display:flex;align-items:center;gap:8px;padding:7px 12px;margin:1px 8px;border-radius:8px;font-size:12.5px;color:#3c3c36;cursor:pointer;font-weight:520}
.nav:hover{background:var(--panel2)}
.nav.on{background:#151513;color:#fff}
.nav .badge{margin-left:auto;background:var(--neg);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px}
#main{grid-column:2;grid-row:2;overflow-y:auto;padding:20px 22px 60px;min-width:0}
#scrim{display:none}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border-bottom:3px double var(--line2);padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:21px;font-weight:500;font-family:var(--serif)}
.page-head .desc{color:var(--mut);font-size:12px;margin-top:2px;max-width:640px}
.cards{display:grid;gap:12px}.cols-2{grid-template-columns:1fr 1fr}.cols-3{grid-template-columns:1fr 1fr 1fr}.cols-4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid #e7e6df;border-radius:3px;padding:13px 15px;box-shadow:0 1px 0 rgba(20,20,18,.03),0 1px 3px rgba(20,20,18,.05);min-width:0}
.card h3{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px;font-weight:700}
.stat{font-size:21px;font-weight:600;font-family:var(--serif);letter-spacing:-.01em}
.delta{font-size:11px;color:var(--mut);margin-top:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--panel2)}
.row:last-child{border-bottom:none}
.lab{color:var(--mut);font-size:12px}.val{font-weight:600;font-size:12.5px;text-align:right}
.muted{color:var(--mut)}.sm{font-size:11px}.b{font-weight:700}.gold{color:var(--gold)}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:2px;letter-spacing:.3px;border:1px solid currentColor;background:transparent}
.pill.green{color:var(--pos);background:rgba(30,92,58,.08)}
.pill.red{color:var(--neg);background:rgba(122,36,48,.08)}
.pill.gold{color:var(--gold);background:rgba(138,106,30,.08)}
.pill.blue{color:var(--info);background:rgba(68,80,92,.08)}
.btn{background:#fff;border:1px solid #c7c7bd;border-radius:2px;color:var(--ink);padding:7px 13px;font-size:12px;font-weight:600}
.btn:hover{border-color:#151513}
.btn.primary{background:#151513;border-color:#151513;color:#fff}
.btn.primary:hover{background:#33332f}
.btn:disabled{opacity:.4;cursor:default}
.tag{background:#fff;border:1px solid var(--line2);border-radius:2px;color:#44443f;padding:4px 10px;font-size:11px;font-weight:600}
.tag.on{background:#151513;border-color:#151513;color:#fff}
.wrapf{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.notice{background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:9px 12px;font-size:12px;color:#3c3c36;margin:8px 0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
thead th{border-bottom:1.5px solid #d9d8d0;color:#5c5c55;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;text-align:left;padding:6px 8px;font-weight:700}
tbody td{padding:6px 8px;border-bottom:1px solid var(--panel2)}
tbody tr:hover{background:#faf9f5}
input,select{background:#fff;border:1px solid var(--line2);color:var(--ink);border-radius:2px;padding:5px 8px;font-size:12px;font-family:inherit}
.shopitem{display:flex;align-items:center;gap:10px;border:1px solid #e7e6df;border-radius:3px;padding:10px 12px;margin-bottom:8px}
.shopitem:hover{border-color:#c9c7bc}
.si-ic{font-size:20px;flex:none}.si-b{flex:1;min-width:0}
.si-t{font-weight:700;font-size:12.5px}.si-d{font-size:11px;color:var(--mut);margin-top:1px}
.barwrap{background:var(--panel2);border-radius:3px;height:7px;overflow:hidden;flex:1;min-width:60px}
.bar{height:100%;border-radius:3px}
#toasts{position:fixed;right:16px;bottom:16px;z-index:400;display:flex;flex-direction:column;gap:7px}
.toast{background:#fff;border:1px solid var(--line2);border-left:3px solid var(--gold);border-radius:3px;padding:9px 13px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);max-width:320px}
.toast.pos{border-left-color:var(--pos)}.toast.neg{border-left-color:var(--neg)}.toast.warn{border-left-color:var(--warn)}
#modal{display:none;position:fixed;inset:0;background:rgba(20,20,18,.35);z-index:300;align-items:center;justify-content:center;padding:18px}
#mbox{background:#fff;border-radius:4px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:18px}
.mhead{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.mic{width:38px;height:38px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--panel2)}
.mhead h3{font-size:15px}.ms{font-size:11px;color:var(--mut)}
.fitem{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--panel2);font-size:11.5px}
.fitem .dot{width:6px;height:6px;border-radius:50%;flex:none;position:relative;top:-1px}
.fitem .txt{flex:1}.fitem .ft{color:var(--mut2);font-size:10px;flex:none}
/* cameras */
.camfeed{background:#fff;border:1px solid var(--line);margin-bottom:12px}
.camhead{display:flex;align-items:center;gap:12px;padding:7px 12px;border-bottom:1px solid var(--line);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:.8px;color:var(--mut)}
.camtitle{font-weight:700;color:var(--ink)}
.camtime{margin-left:auto}
.camlive{display:inline-flex;align-items:center;gap:5px;color:var(--pos);font-weight:700}
.camlive i{width:7px;height:7px;border-radius:50%;background:var(--pos);display:inline-block;animation:camblink 2.2s infinite}
@keyframes camblink{0%,100%{opacity:1}50%{opacity:.25}}
.camview svg{display:block;width:100%;height:auto}
.cambig .camview svg{max-height:400px}
.caminfo{display:flex;gap:16px;flex-wrap:wrap;padding:7px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut)}
.caminfo b{color:var(--ink)}
.camlayout{display:grid;grid-template-columns:1.55fr 1fr;gap:12px;align-items:start}
.camlayout .camfeed{margin-bottom:0}
.camright{display:flex;flex-direction:column;gap:12px}
.camsel{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.camsel select{flex:1}
.camWalk{animation:camdrift var(--dd,8s) ease-in-out infinite alternate}
@keyframes camdrift{from{transform:translateX(0)}to{transform:translateX(26px)}}
.camWalk2{animation:camdrift2 var(--dd,10s) ease-in-out infinite alternate}
@keyframes camdrift2{from{transform:translateX(0)}to{transform:translateX(-22px)}}
/* wizard + landing */
#setup{position:fixed;inset:0;background:var(--bg);z-index:200;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:26px 14px}
.wiz{background:#fff;border:1px solid var(--line);border-radius:4px;max-width:680px;width:100%;padding:26px;margin:auto}
.wizhead h2{font-family:var(--serif);font-size:24px;font-weight:500}
.stepdots{display:flex;gap:6px;margin:10px 0 16px}
.stepdot{width:26px;height:4px;border-radius:2px;background:var(--line2)}
.stepdot.on{background:#151513}
.pick{border:1px solid var(--line2);border-radius:3px;padding:10px 12px;cursor:pointer}
.pick:hover{border-color:#151513}
.pick.sel{border-color:#151513;background:var(--panel2);outline:1px solid #151513}
.pick .pt{font-weight:700;font-size:12.5px}.pick .pd{font-size:11px;color:var(--mut);margin-top:2px}
.grid-c{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.fl{display:block;font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.4px;margin:10px 0 4px;text-transform:uppercase}
#landing{position:fixed;inset:0;background:#141410;z-index:250;display:flex;align-items:center;justify-content:center;padding:20px}
.plate{border:1px solid #3a3a30;outline:1px solid #3a3a30;outline-offset:6px;max-width:520px;width:100%;text-align:center;padding:52px 34px;color:#e8e6da}
.plate .k{font-size:11px;letter-spacing:4px;color:#9a9782}
.plate h1{font-family:var(--serif);font-size:52px;font-weight:500;letter-spacing:6px;margin:12px 0 4px}
.plate .rule{width:60px;height:2px;background:#8a6a1e;margin:14px auto}
.plate .sub{font-size:13px;color:#cfccba}
.plate .d{font-size:11px;color:#8a8874;max-width:360px;margin:10px auto 30px;line-height:1.6}
@media(max-width:980px){
  #app{display:block!important;height:auto!important;min-height:100vh}
  html,body{overflow:auto!important;height:auto!important}
  #topbar{position:sticky;top:0;z-index:40;flex-wrap:wrap;height:auto!important;padding:8px 10px;gap:6px 8px}
  .kpis{flex:1 1 100%;order:10;padding:2px 0 4px}
  #side{position:fixed;left:0;top:0;bottom:0;width:78vw;max-width:270px;z-index:60;transform:translateX(-100%);transition:transform .25s;padding-top:14px}
  #app.navopen #side{transform:none}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;display:none}
  #app.navopen #scrim{display:block}
  #main{padding:12px 12px 80px}
  .cols-2,.cols-3,.cols-4{grid-template-columns:1fr!important}
  .camlayout{grid-template-columns:1fr}
  table{min-width:480px}
  #hamb{display:flex!important}
  .page-head{flex-direction:column}
}
#hamb{display:none;width:34px;height:34px;border-radius:6px;background:#fff;border:1px solid var(--line2);align-items:center;justify-content:center;font-size:15px;flex:none}
</style>
</head>
<body>
<div id="landing">
  <div class="plate">
    <div class="k">THE KITCHEN LEDGER</div>
    <h1>RASOI</h1>
    <div class="rule"></div>
    <div class="sub">A Restaurant Operations Simulation</div>
    <div class="d">An empty dining room, a cold kitchen, and a city full of appetites. Menus, margins, morale — every cover is yours to win.</div>
    <button onclick="landStart()" style="padding:12px 32px;border:1px solid #a67c34;border-radius:3px;background:#c99a4b;color:#241a08;font-weight:700;font-size:13px;letter-spacing:.08em;cursor:pointer">FIRE THE FIRST ORDER</button>
    <span id="contBtn"></span>
    <div style="margin-top:26px;font-size:10px;letter-spacing:2px;color:#6a6858">OFFLINE · SINGLE FILE · SAVES TO THIS DEVICE</div>
  </div>
</div>
<div id="setup" style="display:none"><div class="wiz">
  <div class="wizhead"><h2 id="wizTitle">Found your restaurant</h2></div>
  <div class="stepdots"><div class="stepdot on" data-s="0"></div><div class="stepdot" data-s="1"></div><div class="stepdot" data-s="2"></div><div class="stepdot" data-s="3"></div></div>
  <div id="wizbody"></div>
  <div style="display:flex;gap:8px;justify-content:space-between;margin-top:18px">
    <button class="btn" id="wizBack">Back</button>
    <button class="btn primary" id="wizNext">Continue</button>
  </div>
</div></div>
<div id="app">
  <div id="topbar">
    <button id="hamb" onclick="document.getElementById('app').classList.toggle('navopen')">☰</button>
    <div class="tb-logo"><div class="logo">Rs</div><div><b>RASOI</b><div class="tb-prop" id="tbProp">—</div></div></div>
    <div class="kpis" id="kpis"></div>
    <div class="clockbox">
      <div class="clock"><div class="t" id="clkT">07:00</div><div class="d" id="clkD">Day 1</div></div>
      <div class="speeds">
        <button class="sp" id="spP" title="Pause">❚❚</button>
        <button class="sp on" data-sp="1">1×</button><button class="sp" data-sp="2">2×</button>
        <button class="sp" data-sp="4">4×</button><button class="sp" data-sp="8">8×</button>
      </div>
    </div>
  </div>
  <div id="side"></div>
  <div id="scrim" onclick="document.getElementById('app').classList.remove('navopen')"></div>
  <div id="main"></div>
</div>
<div id="toasts"></div>
<div id="modal"><div id="mbox"></div></div>
<script>
/* =======================================================================
   RASOI — Restaurant Operations Simulator
   Built on the AATITHYA framework: same state architecture, tick loop,
   silhouette-minimal UI, CCTV engine, manager delegation and financial
   discipline — every mechanic redesigned for the restaurant business.
   ======================================================================= */

/* ---------------- helpers ---------------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const cr=n=>{n=Math.round(n);const a=Math.abs(n),s='₹';
  if(a>=1e7)return s+(n/1e7).toFixed(2)+' Cr';
  if(a>=1e5)return s+(n/1e5).toFixed(2)+' L';
  return s+n.toLocaleString('en-IN');};
const cr0=n=>'₹'+Math.round(n).toLocaleString('en-IN');
function hash32(s){let h=9;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),387420489);return h>>>0;}
function srng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function barInline(p,c){return `<span class="barwrap" style="display:inline-block;vertical-align:middle;width:70px"><span class="bar" style="width:${clamp(p,0,100)}%;background:${c||'#8a6a1e'}"></span></span>`;}
function barH(p,c){return `<div class="barwrap" style="margin-top:6px"><div class="bar" style="width:${clamp(p,0,100)}%;background:${c||'#8a6a1e'}"></div></div>`;}
function row(l,v){return `<div class="row"><span class="lab">${l}</span><span class="val">${v}</span></div>`;}
function ovCard(t,v,sub,bar){return `<div class="card"><h3>${t}</h3><div class="stat">${v}</div><div class="delta">${sub||''}</div>${bar||''}</div>`;}
function toast(msg,cls){const t=document.createElement('div');t.className='toast '+(cls||'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200);}
function moodPill(s){return s>=75?'<span class="pill green">'+Math.round(s)+'</span>':s>=50?'<span class="pill gold">'+Math.round(s)+'</span>':'<span class="pill red">'+Math.round(s)+'</span>';}

/* ---------------- DATA: concepts ---------------- */
const CONCEPTS={
 fine:   {name:'Fine Dining',ic:'🥂',cost:9000000, ticket:2.6,seats:36,kitchen:3,hours:[12,23],take:.04,del:.02,amb:3,staffM:1.6,d:'White tablecloths and tasting menus. Small covers, huge tickets, zero tolerance for error.'},
 cafe:   {name:'Premium Café',ic:'☕',cost:3500000, ticket:.9, seats:34,kitchen:1,hours:[8,22], take:.22,del:.14,amb:2,staffM:1.0,d:'Specialty coffee, all-day plates, laptop crowd. Ambience is the product.'},
 casual: {name:'Casual Dining',ic:'🍽️',cost:5000000,ticket:1.3,seats:52,kitchen:2,hours:[11,23],take:.14,del:.18,amb:2,staffM:1.2,d:'The dependable neighbourhood favourite. Volume with comfort.'},
 fast:   {name:'Fast Food',ic:'🍔',cost:4200000, ticket:.55,seats:44,kitchen:1,hours:[10,23],take:.38,del:.26,amb:1,staffM:1.0,d:'Speed is the brand. Thin margins, big throughput, ruthless efficiency.'},
 family: {name:'Family Restaurant',ic:'👨‍👩‍👧',cost:5600000,ticket:1.15,seats:64,kitchen:2,hours:[11,23],take:.12,del:.14,amb:2,staffM:1.25,d:'Big tables, birthday cakes, Sunday rushes that test the kitchen.'},
 qsr:    {name:'QSR Counter',ic:'🥡',cost:2600000, ticket:.45,seats:18,kitchen:1,hours:[10,23],take:.55,del:.30,amb:1,staffM:.8,d:'Order at the counter, out in minutes. Real estate efficiency perfected.'},
 drive:  {name:'Drive-Thru',ic:'🚗',cost:6500000, ticket:.6, seats:22,kitchen:2,hours:[7,24], take:.62,del:.16,amb:1,staffM:1.1,d:'Cars, headsets and 90-second service windows. Location is everything.'},
 bakery: {name:'Bakery',ic:'🥐',cost:2900000, ticket:.5, seats:14,kitchen:2,hours:[7,21], take:.58,del:.12,amb:2,staffM:.9,d:'Ovens on at 4 AM. Fresh trays sell out or get written off.'},
 dessert:{name:'Dessert Café',ic:'🍰',cost:3100000, ticket:.6, seats:26,kitchen:1,hours:[11,24],take:.30,del:.22,amb:2,staffM:.9,d:'Evenings and weekends. Instagram does half your marketing.'},
 cloud:  {name:'Cloud Kitchen',ic:'📦',cost:1800000, ticket:.8, seats:0, kitchen:2,hours:[10,24],take:.15,del:.85,amb:0,staffM:.7,d:'No dining room, no décor — just a kitchen and the delivery apps. Pure margin play.'},
 pizza:  {name:'Pizzeria',ic:'🍕',cost:3800000, ticket:.95,seats:38,kitchen:2,hours:[11,24],take:.28,del:.34,amb:2,staffM:1.0,d:'Dough, fire and speed. Delivery-heavy with a loyal dine-in core.'},
 south:  {name:'South Indian',ic:'🥞',cost:3200000, ticket:.5, seats:48,kitchen:2,hours:[7,22], take:.24,del:.16,amb:1,staffM:1.1,d:'Breakfast is the battlefield. Dosas at dawn, filter coffee by the litre.'}
};
const CONCEPT_ORDER=['fine','cafe','casual','fast','family','qsr','drive','bakery','dessert','cloud','pizza','south'];
const CUISINES=['North Indian','South Indian','Multi-Cuisine','Italian','Pan-Asian','Continental','Bakery & Café','American'];
/* ---------------- DATA: cities & localities ---------------- */
const CITIES=[
 {name:'Mumbai',tier:1,foot:1.35,rent:1.6,spend:1.30},
 {name:'Delhi NCR',tier:1,foot:1.30,rent:1.4,spend:1.25},
 {name:'Bengaluru',tier:1,foot:1.28,rent:1.35,spend:1.28},
 {name:'Hyderabad',tier:1,foot:1.15,rent:1.1,spend:1.12},
 {name:'Pune',tier:2,foot:1.05,rent:.95,spend:1.05},
 {name:'Chennai',tier:1,foot:1.12,rent:1.05,spend:1.08},
 {name:'Jaipur',tier:2,foot:.92,rent:.8,spend:.92},
 {name:'Kochi',tier:2,foot:.88,rent:.78,spend:.95}];
const LOCALITIES=[
 {name:'High Street',foot:1.35,rent:1.5,mix:'balanced'},

function hourCurve(mix,h){
  const base={7:.02,8:.04,9:.04,10:.03,11:.05,12:.10,13:.12,14:.08,15:.04,16:.04,17:.05,18:.06,19:.09,20:.11,21:.08,22:.04,23:.02,0:.01}[h]||0;

  if(mix==='student'&&(h>=16&&h<=19))m=1.4;
  if(mix==='family'&&(h>=19&&h<=21))m=1.35; if(mix==='family'&&h>=22)m=.5;
  if(mix==='transit'&&(h>=8&&h<=10))m=1.5;
  if(mix==='tourist'&&(h>=12&&h<=16))m=1.3;
  return base*m;
}
function archeAt(mix,h){
  const w={student:.8,office:1,family:1,couple:.8,biz:.5,tourist:.6,night:.2};
  if(mix==='office'){w.office=2.4;w.biz=1.4;}
  if(mix==='student'){w.student=2.8;w.couple=1.1;}
  if(mix==='family'){w.family=2.4;}
  if(mix==='tourist'){w.tourist=2.6;}
  if(mix==='transit'){w.office=1.6;w.tourist=1.4;}
  if(h>=22||h<2){w.night=2.5;w.family=.2;w.office=.3;}
  if(h>=12&&h<=14){w.office*=1.5;}
  if(h>=19&&h<=21){w.family*=1.4;w.couple*=1.5;}
  let tot=0;for(const k in w)tot+=w[k];
  let r=Math.random()*tot;
  for(const k in w){r-=w[k];if(r<=0)return k;}
  return 'couple';
}

function equipBonus(o){const b={cap:0,food:0,cold:0,buss:0,err:0};

function activeIngUse(o,seed){
  // expected daily usage per ingredient from active menu; optionally seed stock

    for(const g in d.rec)use[g]+=d.rec[g]*share;});

function invQty(o,k){return (o.inv[k]||[]).reduce((a,b)=>a+b.q,0);}
function consume(o,k,q){let need=q;const arr=o.inv[k]||[];

/* ============================ SIMULATION ============================ */
const abs=()=>G.day*24+G.hour;
function shiftWin(o,s){if(s.sh==='F')return true;
  const [a,b]=CONCEPTS[o.concept].hours;const len=b-a;
  const pos=((G.hour-a)+24)%24;if(pos>=len)return false;
  return s.sh==='A'?pos<len/2+1:pos>=len/2-1;}
function onDuty(o,s){return isOpen(o,G.hour)&&!s.off&&shiftWin(o,s);}
function staffOn(o,role){return (o.staff[role]||[]).filter(s=>onDuty(o,s));}
function kitchenOn(o){return ['chef','linecook','barista'].flatMap(r=>staffOn(o,r));}
function stationsCovered(o){const set=new Set();kitchenOn(o).forEach(s=>ROLES[s.role].st.forEach(x=>set.add(x)));return set;}
function kitchenCapMin(o){let cap=0;kitchenOn(o).forEach(s=>{
  cap+=60*ROLES[s.role].speed*(s.skill/70)*(1-s.fatigue/170)*(.72+s.morale/260);});
  return cap*(.72+o.equip/350)*(o.perks.training?1.06:1)*(1+equipBonus(o).cap);}
function demandIdx(o){
  const city=CITIES[o.cityI],loc=LOCALITIES[o.locI];
  let d=city.foot*loc.foot*DX().demM;
  d*=.55+(o.awareness/100)*.9;
  d*=.68+(o.rating-3)*.3;
  d*=1+(o.reputation-45)*.004;
  if(isWknd())d*=1.26;
  if(o.style==='value')d*=1.1;if(o.style==='premium')d*=.94;
  d*=1+Math.min(.15,o.campaigns.length*.05);
  if(o.loyalty&&o.loyalty.active)d*=1+clamp(o.loyalty.members/((o.seats||40)*30),0,.18);
  d*=rivalEdge(o);
  if(G.fest)d*=G.fest.demM;
  if(o._shut)d=0;
  return clamp(d,.1,2.8);}
function wx(o){return WEATHER[o.weather]||WEATHER.clear;}
function chOpen(o){return Object.keys(o.channels).filter(k=>o.channels[k].on&&k!=='walkin');}
function freeTable(o,size){let best=null;
  o.tables.forEach(t=>{if(t.state==='free'&&t.cap>=size&&(!best||t.cap<best.cap))best=t;});
  return best;}
function pickDish(o,arch,st){ // weighted pick among active cookable dishes
  const pool=o.menu.filter(m=>m.active&&canCook(o,m.k));
  if(!pool.length)return null;
  let tot=0;const w=pool.map(m=>{const d=DISH_LIB[m.k];
    let x=(d.appeal[arch]||1)*(m.special?1.35:1);
    if(st&&d.st!==st)x*=.5;
    x*=clamp(1.6-m.price/(DISH_LIB[m.k].price*menuPriceM(o)*1.6),.35,1.6); // price sensitivity vs anchor
    tot+=x;return x;});
  let r=Math.random()*tot;
  for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i];}
  return pool[pool.length-1];}
function buildOrderItems(o,arch,size,dine){
  const items=[];const n=Math.max(1,Math.round(size*(dine?rnd(1.5,2.1):rnd(1.1,1.5))));
  for(let i=0;i<n;i++){const m=pickDish(o,arch);if(!m)break;
    items.push({k:m.k,price:m.price});}
  // dine-in groups often add beverages/desserts
  if(dine&&Math.random()<.6){const m=pickDish(o,arch);if(m&&['Coffee','Beverages','Desserts'].includes(DISH_LIB[m.k].cat))items.push({k:m.k,price:m.price});}
  return items;}
function cookConsume(o,items){ // consume ingredients, return {icost,fresh,missing}
  let icost=0,fresh=1,missing=0;
  items.forEach(it=>{const d=DISH_LIB[it.k];
    for(const g in d.rec){const got=consume(o,g,d.rec[g]);
      icost+=ING[g].cost*d.rec[g];
      if(got<d.rec[g]-0.0001)missing++;}
    const m=o.menu.find(x=>x.k===it.k);if(m)m.icost+=ingCostPlate(it.k);});
  return {icost,fresh,missing};}
function supQ(o){ // avg quality multiplier of chosen suppliers
  let q=0,n=0;SUP_CATS.forEach(c=>{const s=o.market.find(x=>x.id===o.suppliers[c]);if(s){q+=s.q;n++;}});
  return n?q/n:1;}

/* ---- hourly heart ---- */
function tickHour(){
  G.outlets.forEach(o=>simOutlet(o));
  G.hour++;
  if(G.hour>=24){G.hour=0;G.day++;dayRollover();}
  renderTop();refreshLive();
  if(G.hour%6===0)saveGame();
}
function simOutlet(o){
  const open=isOpen(o,G.hour)&&!o._shut;
  // 1) bussing: cleaners reset dirty tables
  const cln=staffOn(o,'cleaner').length;
  let toClean=Math.round(cln*4*(1+equipBonus(o).buss));
  o.tables.forEach(t=>{if(t.state==='dirty'&&toClean>0){t.state='free';toClean--;}});
  if(!open&&!isOpen(o,G.hour)){ // closed hours: reset floor, recover staff
    o.tables.forEach(t=>{if(t.state==='dirty')t.state='free';});
    o.parties=o.parties.filter(p=>p.stage!=='done');
    Object.values(o.staff).flat().forEach(s=>{s.fatigue=Math.max(0,s.fatigue-(o.areas.includes('staffroom')?9:6));});
    o.clean=clamp(o.clean+3,0,100);
    return;}
  if(!open)return;
  // 2) departures: parties served an hour+ ago leave
  o.parties.forEach(p=>{
    if(p.stage==='served'&&abs()-p.servedAt>=1){departParty(o,p);}
  });
  o.parties=o.parties.filter(p=>p.stage!=='done');
  // 4) waiting queue: seat or lose patience
  o.waiting=o.waiting.filter(w=>{
    const t=freeTable(o,w.size);
    if(t){seatParty(o,w,t);return false;}
    w.waitH=(w.waitH||0)+1;
    if(w.waitH*60>ARCHE[w.arch].patience*2.2){o.waitLost+=w.size;return false;}
    return true;});
  // 5) reservations arriving this hour
  o.resv.filter(r=>r.d===G.day&&r.h===G.hour).forEach(r=>{
    const t=freeTable(o,r.size);
    if(t)seatParty(o,{size:r.size,arch:r.arch,resv:true},t);
    else{o.reputation=clamp(o.reputation-1.2,0,100);o.waitLost+=r.size;
      logEv(o,'floor','A '+r.size+'-cover reservation found no table. Word gets around.');}});
  o.resv=o.resv.filter(r=>!(r.d===G.day&&r.h<=G.hour));
  // 5) new walk-ins
  const mix=LOCALITIES[o.locI].mix;
  const dIdx=demandIdx(o);
  const W=wx(o);
  let exp=o.seats>0?o.tables.length*hourCurve(mix,G.hour)*2.7*dIdx*W.walkM:0;
  let n=Math.floor(exp)+(Math.random()<exp%1?1:0);
  for(let i=0;i<n;i++){
    const arch=archeAt(mix,G.hour);
    const size=clamp(ri(ARCHE[arch].grp[0],ARCHE[arch].grp[1]),1,8);
    const t=freeTable(o,size);
    if(t)seatParty(o,{size,arch},t);
    else if(o.waiting.length<8&&(o._queueMin||0)<240)o.waiting.push({size,arch,waitH:0});
    else o.waitLost+=size;
  }
  // 7) takeaway counter orders
  const c=CONCEPTS[o.concept];
  let tk=exp*c.take+(o.seats===0?0:0);
  if(o.areas.includes('pickup'))tk*=1.3;
  spawnCounter(o,tk,'walkin',mix);
  // 8) delivery orders per channel
  const delBase=(o.seats||42)*hourCurve('balanced',G.hour)*3.6*c.del*dIdx*W.delM;
  chOpen(o).forEach(ch=>{
    let e=delBase*o.channels[ch].pop;
    if(ch==='catering')e=G.hour===12||G.hour===19?o.channels.catering.pop*2.2*dIdx:0;
    spawnCounter(o,e,ch,mix);});
  // 8) kitchen: process the queue (same-hour service possible)
  let cap=kitchenCapMin(o);
  for(const q of o.kq){
    if(cap<=0)break;
    const take=Math.min(cap,q.left);q.left-=take;cap-=take;
    if(q.left<=0.01)serveOrder(o,q);
  }
  o.kq=o.kq.filter(q=>q.left>0.01);
  o._kcap=kitchenCapMin(o);o._queueMin=o.kq.reduce((a,q)=>a+q.left,0);
  // stale orders: cancellations & walkouts after ~2 unserved hours
  o.kq=o.kq.filter(q=>{
    const ageMin=(abs()-q.placed)*60;
    if(ageMin>90+q.patience*2){cancelOrder(o,q);return false;}
    return true;});
  // 9) wear: cleanliness, fatigue, hygiene
  const load=o.parties.length+o.kq.length;
  o.clean=clamp(o.clean-(load*.35)+cln*1.4,25,100);
  o.hygiene=clamp(o.hygiene+(o.clean>75?.2:-.4)-(invQty(o,'clean')<1?.6:0),20,100);
  kitchenOn(o).forEach(s=>{s.fatigue=clamp(s.fatigue+(o.kq.length>3?4:2),0,100);});
  staffOn(o,'server').forEach(s=>{s.fatigue=clamp(s.fatigue+(o.parties.length>6?3:1.5),0,100);});
  consume(o,'clean',cln*.06+.04);
  consume(o,'gas',Math.min(invQty(o,'gas'),(o.coversToday>0?.5:.2)+o.kq.length*.15));

}
function seatParty(o,w,t){
  t.state='seated';

    resv:!!w.resv,waitedH:w.waitH||0,items:buildOrderItems(o,w.arch,w.size,true)};
  t.party=p.id;o.parties.push(p);

  o.kq.push({id:p.id,items:p.items,left:prep,min:prep,party:p.id,ch:'walkin',dine:true,placed:abs(),patience});
}
function spawnCounter(o,expected,ch,mix){
  let n=Math.floor(expected)+(Math.random()<expected%1?1:0);
  const covSet=stationsCovered(o);
  for(let i=0;i<n;i++){
    const arch=ch==='catering'?'biz':archeAt(mix,G.hour);
    const items=buildOrderItems(o,arch,ch==='catering'?ri(6,14):ri(1,2),false);
    if(!items.length)continue;
    if(invQty(o,'pack')<items.length){o.waitLost++;continue;} // no packaging, no parcel
    consume(o,'pack',items.length);
    const prep=items.reduce((a,it)=>a+DISH_LIB[it.k].prep*(covSet.has(DISH_LIB[it.k].st)?1:1.7),0);
    o.kq.push({id:'c'+(G.seq++),items,left:prep,min:prep,party:null,ch,dine:false,placed:abs(),patience:22,arch});
  }
}
function serveOrder(o,q){
  const cc=cookConsume(o,q.items);
  let gross=q.items.reduce((a,it)=>a+it.price,0);
  const comm=CHANNELS[q.ch]?CHANNELS[q.ch].comm:0;
  const net=Math.round(gross*(1-comm));
  o.revToday+=net;o.moRev=(o.moRev||0)+net;G.cash+=net;
  o.ordersToday++;o.chToday[q.ch]=(o.chToday[q.ch]||0)+1;
  o.channels[q.ch]&&(o.channels[q.ch].vol=(o.channels[q.ch].vol||0)+1);
  q.items.forEach(it=>{const m=o.menu.find(x=>x.k===it.k);if(m){m.sold++;m.rev+=it.price;}});
  const waitMin=(abs()-q.placed)*60+q.min*.5; // dishes fire in parallel across the line
  if(q.dine){
    const p=o.parties.find(x=>x.id===q.party);
    if(p){p.stage='served';p.servedAt=abs();p.bill=gross;p.waitMin=waitMin+p.waitedH*60;p.missing=cc.missing;}
  }else{
    // counter / delivery satisfaction & review inline
    const arch=q.arch||'office';
    let sat=68-(Math.max(0,waitMin-30))*1.1-cc.missing*8+supQ(o)*14-14+(staffOn(o,'delivery').length?4:(q.ch==='swiggy'||q.ch==='zomato'?-6:0));
    const errRate=(staffOn(o,'delivery').length?.008:.02)*(o.kq.length>5?2.2:1)*(1-equipBonus(o).err);
    if(q.ch!=='walkin'&&Math.random()<errRate){sat-=25;o.revToday-=Math.round(gross*.3);G.cash-=Math.round(gross*.3);
      o._delErr=(o._delErr||0)+1;
      if(Math.random()<.3)logEv(o,'delivery','Wrong order packed in the rush — partial refund issued.');}
    sat=clamp(sat+rnd(-6,6),5,98);
    addRating(o,satToStars(sat));
    if(Math.random()<ARCHE[arch].rev*.8)pushReview(o,{arch,sat,dine:false,ch:q.ch,waitMin,missing:cc.missing});
    o.coversToday+= (q.ch==='catering'?8:1);
  }
  o.tipsToday+=Math.round(gross*(ARCHE[q.arch||'office']?ARCHE[q.arch||'office'].tip:0)*.5);
}
function cancelOrder(o,q){
  if(q.dine){
    const p=o.parties.find(x=>x.id===q.party);
    if(p){p.stage='done';const t=o.tables.find(x=>x.id===p.table);if(t){t.state='dirty';t.party=null;}
      o.walkouts+=p.size;addRating(o,1);
      if(Math.random()<.5)pushReview(o,{arch:p.arch,sat:12,dine:true,ch:'walkin',waitMin:999,walkout:true});
      logEv(o,'kitchen','Party of '+p.size+' walked out — the kitchen never got to their order.');}
  }else{
    addRating(o,1);
    if(Math.random()<.3)pushReview(o,{arch:q.arch||'office',sat:15,dine:false,ch:q.ch,waitMin:999,cancel:true});
  }
  o.reputation=clamp(o.reputation-.5,0,100);
}
function satToStars(s){return s>=85?5:s>=68?4:s>=50?3:s>=32?2:1;}
function addRating(o,stars){o.ratN++;o.recent=o.recent||[];o.recent.push(stars);
  if(o.recent.length>200)o.recent.shift();
  o.rating=clamp(Math.round((o.recent.reduce((a,b)=>a+b,0)/o.recent.length)*10)/10,1,5);}
function departParty(o,p){
  p.stage='done';
  const t=o.tables.find(x=>x.id===p.table);if(t){t.state='dirty';t.party=null;}
  o.coversToday+=p.size;
  // --- satisfaction components ---
  const city=CITIES[o.cityI];const c=CONCEPTS[o.concept];
  const chefs=kitchenOn(o);const chefSkill=chefs.length?chefs.reduce((a,s)=>a+s.skill,0)/chefs.length:40;
  const food=clamp(34+chefSkill*.42+(supQ(o)-1)*70+equipBonus(o).food+(p.missing?-p.missing*9:0)+(o.hygiene<50?-12:0)+rnd(-5,5),5,98);
  const wait=clamp(88-Math.max(0,(p.waitMin||25)-15-ARCHE[p.arch].patience)*2,5,98);
  const srv=staffOn(o,'server');const ratio=srv.length/Math.max(1,o.parties.length*.45);
  const friendly=srv.length?srv.reduce((a,s)=>a+s.friendly,0)/srv.length:50;
  const service=clamp(34+Math.min(1.25,ratio)*32+friendly*.22+rnd(-4,4),5,98);
  const ambExp={fine:3,biz:2.4,couple:2.2,tourist:1.8,family:1.6,office:1.3,student:1,night:1}[p.arch]||1.5;
  const amb=clamp(46+(o.amb-ambExp)*13+(o.clean-70)*.35+rnd(-4,4),5,98);
  const perHead=p.bill/p.size;
  const expect=ARCHE[p.arch].budget*city.spend*c.ticket*300+120;
  const value=clamp(66+((expect-perHead)/expect)*55+rnd(-5,5),5,98);
  const sat=clamp(food*.34+wait*.2+service*.16+amb*.14+value*.16,3,99);
  addRating(o,satToStars(sat));
  o.reputation=clamp(o.reputation+(sat-58)*.012,0,100);
  G.cash+=Math.round(p.bill*ARCHE[p.arch].tip*(service>65?1:.4));
  // loyalty / return pool
  const key=p.arch;
  G.guestDB[key]=G.guestDB[key]||{visits:0,satAvg:60};
  const e=G.guestDB[key];e.visits+=p.size;e.satAvg=e.satAvg*.9+sat*.1;
  if(Math.random()<ARCHE[p.arch].rev*(sat<35?1.8:sat>85?1.25:1))
    pushReview(o,{arch:p.arch,sat,dine:true,ch:'walkin',waitMin:p.waitMin,asp:{food,wait,service,amb,value},resv:p.resv});
}

/* ============================ PROCUREMENT & INVENTORY ============================ */
function supFor(o,cat){return o.market.find(s=>s.id===o.suppliers[cat]);}
function placeOrder(o,ing,qty){
  const cat=ING[ing].cat,s=supFor(o,cat);if(!s||qty<=0)return false;
  let cost=Math.round(ING[ing].cost*s.priceM*mktIdx(ing)*qty);
  if(qty*ING[ing].cost>4000&&s.bulk)cost=Math.round(cost*(1-s.bulk/100));
  if(o.perks&&o.perks.warehouse)cost=Math.round(cost*.94);
  cost=Math.round(cost*DX().costM);
  if(G.cash<cost){toast('Not enough cash for that order.','warn');return false;}
  G.cash-=cost;o.expToday+=cost;o.moFood=(o.moFood||0)+cost;
  o.pending.push({ing,qty,cost,sup:s.id,day:G.day+s.lead,fail:Math.random()>s.rel});
  return true;}
function arriveDeliveries(o){
  o.pending=o.pending.filter(p=>{
    if(p.day>G.day)return true;
    const s=o.market.find(x=>x.id===p.sup);
    if(p.fail){ // reliability miss: arrives a day late, partial
      p.fail=false;p.day=G.day+1;p.qty=Math.round(p.qty*.7);
      if(Math.random()<.4)logEv(o,'procure',(s?s.name:'Supplier')+' shorted a delivery — '+ING[p.ing].name+' arriving late and light.');
      if(s)s.rep=Math.max(0,s.rep-4);
      return true;}
    o.inv[p.ing].push({q:p.qty,exp:G.day+ING[p.ing].shelf});
    if(s)s.rep=Math.min(100,s.rep+1);
    return false;});
}
function spoilage(o){
  let waste=0;
  // capacity pressure: overflow cold storage spoils fastest
  const coldQty=ING_ORDER.filter(k=>ING[k].store==='cold').reduce((a,k)=>a+invQty(o,k),0);
  const coldCap=o.caps.cold*(o.areas.includes('coldstore')?2:1)*(1+equipBonus(o).cold);
  const over=coldQty>coldCap;
  const overLoss=o.equipUp&&o.equipUp.chiller?.05:.12;
  ING_ORDER.forEach(k=>{
    const arr=o.inv[k];if(!arr)return;
    for(let i=arr.length-1;i>=0;i--){
      const b=arr[i];
      if(b.exp<=G.day){waste+=b.q*ING[k].cost;arr.splice(i,1);}
      else if(over&&ING[k].store==='cold'){const l=b.q*overLoss;b.q-=l;waste+=l*ING[k].cost;}
    }});
  // pilferage: 1%/day of dry stock without a manager on the books
  if(!(o.staff.manager||[]).length&&!o.perks.hqops){
    ING_ORDER.filter(k=>ING[k].store==='dry').forEach(k=>{(o.inv[k]||[]).forEach(b=>{waste+=b.q*.01*ING[k].cost;b.q*=.99;});});
  }
  waste=Math.round(waste);
  if(waste>0){o.wasteToday+=waste;o.moWaste=(o.moWaste||0)+waste;}
}
function parTargets(o){
  const use=activeIngUse(o);
  const t={};ING_ORDER.forEach(k=>{if(use[k]>0.01){const s=supFor(o,ING[k].cat);t[k]=Math.ceil(use[k]*(2.5+(s?s.lead:1)));}});
  return t;}
function autoRestock(o){
  const t=parTargets(o);
  for(const k in t){
    const have=invQty(o,k)+o.pending.filter(p=>p.ing===k).reduce((a,p)=>a+p.qty,0);
    if(have<t[k]*.6)placeOrder(o,k,Math.ceil(t[k]-have));
  }
}

/* ============================ DAY & MONTH ROLLOVER ============================ */
function dayRollover(){
  G.outlets.forEach(o=>{
    arriveDeliveries(o);
    spoilage(o);
    // projects
    o.projects.forEach(p=>p.left--);
    o.projects=o.projects.filter(p=>{
      if(p.left>0)return true;
      finishProject(o,p);return false;});
    // campaigns
    o.campaigns.forEach(cp=>cp.left--);
    o.campaigns=o.campaigns.filter(cp=>{
      if(cp.left<=0){logEv(o,'marketing',MKT[cp.k].name+' campaign has wrapped up.');return false;}return true;});
    o.awareness=clamp(o.awareness-.35,2,100);
    o.campaigns.forEach(cp=>{const M=MKT[cp.k];
      o.awareness=clamp(o.awareness+M.aw*3.2,0,100);
      if(M.ch&&o.channels[M.ch])o.channels[M.ch].pop=clamp(o.channels[M.ch].pop+.012,0,1.2);});
    // channel evolution: direct grows with reputation, apps with volume
    if(o.channels.direct.on)o.channels.direct.pop=clamp(o.channels.direct.pop+(o.reputation-50)*.0009,.05,1);
    ['swiggy','zomato'].forEach(ch=>{const C=o.channels[ch];
      if(C.on)C.pop=clamp(C.pop+((C.vol||0)>8?.008:-.002)+(o.rating-3.8)*.004,.1,1.2);C.vol=0;});
    // staff recovery, morale & training
    Object.values(o.staff).flat().forEach(s=>{
      s.fatigue=clamp(s.fatigue-(o.areas.includes('staffroom')?34:24),0,100);
      const strain=s.fatigue>60?-2:s.fatigue>35?-.5:1;
      s.morale=clamp(s.morale+strain+(o.perks.training?.3:0)+rnd(-1,1),10,100);
      if(o.perks.training&&G.day%7===0)s.skill=clamp(s.skill+1,30,99);
      if(s.morale<25&&Math.random()<.25){quitStaff(o,s);}});
    // weather rolls fresh each day
    o.weather=rollWeather();
    // local competition: rival drifts toward its target rating & runs the odd promo
    if(o.rival){const R=o.rival;
      R.rating=+clamp(R.rating+(R.targetRating-R.rating)*.05+rnd(-.03,.03),2.5,4.8).toFixed(2);
      if(R.promo){R.promoLeft--;if(R.promoLeft<=0){R.promo=false;}}
      else if(Math.random()<.06){R.promo=true;R.promoLeft=ri(3,7);R.priceIdx=+clamp(R.priceIdx-.05,.82,1.15).toFixed(2);
        logEv(o,'market',R.name+' launched a promotion nearby — expect some diners to stray.');}
      else if(Math.random()<.04){R.priceIdx=+clamp(R.priceIdx+rnd(-.03,.04),.85,1.18).toFixed(2);}
    }
    // loyalty membership: satisfied covers enrol; a slice churns; redemptions cost
    if(o.loyalty&&o.loyalty.active){
      const enrol=Math.round(o.coversToday*.1*clamp((o.rating-2.8)/1.3,0,1.3));
      o.loyalty.members=Math.max(0,Math.round(o.loyalty.members*.992)+enrol);
      const redeem=Math.round(o.loyalty.members*3*DX().costM);
      G.cash-=redeem;o.expToday+=redeem;o.moOther=(o.moOther||0)+redeem;
      if(enrol>0&&o.loyalty.members>0&&G.day%7===0)o.reputation=clamp(o.reputation+.4,0,100);
    }
    // reservations for today
    genReservations(o);
    // random events
    dailyEvents(o);
    // manager automations
    runManagers(o);
    // analytics
    const profit=o.revToday-o.expToday;
    const occ=o.seats?Math.round(Math.min(100,(o.coversToday/(o.seats*3.4))*100)):0;
    o.analytics.push({d:G.day-1,rev:o.revToday,exp:o.expToday,profit,covers:o.coversToday,orders:o.ordersToday,
      occ,waste:o.wasteToday,rating:o.rating,aw:Math.round(o.awareness),lost:o.waitLost+o.walkouts});
    if(o.analytics.length>200)o.analytics.shift();
    o.revToday=0;o.expToday=0;o.coversToday=0;o.ordersToday=0;o.wasteToday=0;o.tipsToday=0;
    o.waitLost=0;o.walkouts=0;o.chToday={};o._shut=false;
  });
  driftMarket();
  // festival calendar (chain-wide): a multi-day demand spike every few weeks
  if(G.fest){G.fest.left--;if(G.fest.left<=0){toast('The '+G.fest.name+' rush is over.','');G.fest=null;G.festCooldown=ri(14,26);}}
  else if((G.festCooldown=(G.festCooldown||0)-1)<=0){
    const name=FESTIVALS[(G.day+ (G._festSeq=(G._festSeq||0)+1))%FESTIVALS.length];
    G.fest={name,left:ri(2,4),demM:+rnd(1.25,1.6).toFixed(2)};
    G.outlets.forEach(o=>logEv(o,'market',name+' is here — expect a rush. Stock up and staff up.'));
    toast('🪔 '+name+' has arrived — demand is surging for '+G.fest.left+' days.','pos');
  }
  if(G.day%30===1&&G.day>1)monthlySettle();
  checkProgression();
  saveGame();
}
function quitStaff(o,s){

function dailyEvents(o){

function monthlySettle(){
  let note=[];
  G.outlets.forEach(o=>{
    let sal=0;Object.values(o.staff).flat().forEach(s=>sal+=s.sal);
    o.salBill=sal;
    const util=Math.round((o._utilAcc||0));o._utilAcc=0;
    const rent=o.rentMo;
    const out=sal+util+rent;
    G.cash-=out;o.expToday+=out;
    o.moSal=sal;o.moUtil=util;o.moRentX=rent;
    const rev=o.moRev||0,food=o.moFood||0,waste=o.moWaste||0,other=o.moOther||0;
    const profit=rev-food-sal-util-rent-other;
    let tax=0;
    if(profit>0){tax=Math.round(profit*.25);G.cash-=tax;o.expToday+=tax;}
    o.lastMonth={rev,food,sal,util,rent,waste,other,tax,profit:profit-tax};
    note.push(o.name+': '+(profit-tax>=0?'+':'')+cr(profit-tax));
    o.moRev=0;o.moFood=0;o.moWaste=0;o.moOther=0;
    logEv(o,'finance','Month settled — revenue '+cr(rev)+', net '+cr(profit-tax)+' (rent '+cr(rent)+', payroll '+cr(sal)+', power & water '+cr(util)+(tax?', tax '+cr(tax):'')+').');
  });
  // loans EMI
  G.loans=G.loans.filter(l=>{
    G.cash-=l.emi;l.termLeft--;l.paid+=l.emi;
    if(l.termLeft<=0){toast('Loan "'+l.n+'" fully repaid.','pos');return false;}
    return true;});
  // franchise royalties
  if(G.chain.franchises.length){
    const roy=G.chain.franchises.reduce((a,f)=>a+f.roy,0);
    G.cash+=roy;G.chain.royalty+=roy;
    toast('Franchise royalties received: '+cr(roy),'pos');}
  toast('Monthly books closed. '+note.join(' · '),'');
  updBrandVal();
}
function updBrandVal(){
  const annual=G.outlets.reduce((a,o)=>a+((o.lastMonth?o.lastMonth.profit:0)*12),0);
  const assets=G.outlets.reduce((a,o)=>a+CONCEPTS[o.concept].cost*.5,0);
  const brand=G.outlets.reduce((a,o)=>a+o.awareness*o.reputation*400,0);
  G.brandVal=Math.max(0,Math.round(annual*6+assets+brand+G.chain.franchises.length*2500000));
}

function hasGM(o){return (o.staff.manager||[]).length>0;}
function runManagers(o){
  if(!hasGM(o)){ // par-based restock still available without GM
    if(o.autoPar&&o.mgr.procure)o.mgr.procure=false;
    if(o.autoPar)autoRestock(o);
    return;}
  if(o.mgr.procure||o.autoPar)autoRestock(o);
  if(o.mgr.pricing&&G.day%3===0){
    o.menu.filter(m=>m.active).forEach(m=>{
      const d=DISH_LIB[m.k];const cost=ingCostPlate(m.k,o);
      const margin=1-cost/Math.max(1,m.price);
      const anchor=d.price*menuPriceM(o);
      if(margin<.6&&m.price<anchor*1.35)m.price=Math.round(m.price*1.03/10)*10;
      else if(m.sold<2&&m.price>anchor*.8)m.price=Math.round(m.price*.97/10)*10;
    });}
  if(o.mgr.menu&&G.day%10===0&&G.day-o.openedDay>12){
    const act=o.menu.filter(m=>m.active);
    if(act.length>6){
      const worst=act.slice().sort((a,b)=>(a.sold)-(b.sold))[0];
      if(worst&&worst.sold<act.reduce((x,m)=>x+m.sold,0)/act.length*.25){
        worst.active=false;logEv(o,'menu','[GM] Retired "'+DISH_LIB[worst.k].name+'" — it wasn\'t selling.');}}
    const inact=o.menu.filter(m=>!m.active);
    if(inact.length&&act.length<14){const add=pick(inact);add.active=true;add.since=G.day;
      logEv(o,'menu','[GM] Added "'+DISH_LIB[add.k].name+'" to the card.');}}
  if(o.mgr.marketing&&o.awareness<45&&!o.campaigns.length){
    const k=pick(MKT_ORDER.filter(x=>MKT[x].cost<G.cash*.25));
    if(k){launchCampaign(o,k,true);}}
  if(o.mgr.hiring&&G.day%5===0)managerHiring(o);
  if(o.mgr.schedule){Object.values(o.staff).flat().forEach((s,i)=>{s.sh=openHours(o)>11?(i%2?'A':'B'):'F';});}
  if(o.mgr.kitchen){ // repairs + 86 handled implicitly; keep equipment healthy
    if(o.equip<75){const c=Math.round((100-o.equip)*4500*DX().costM);
      if(G.cash>c+300000){G.cash-=c;o.expToday+=c;o.moOther=(o.moOther||0)+c;o.equip=96;
        logEv(o,'ops','[GM] Called the service techs — kitchen equipment back to spec ('+cr(c)+').');}}}
}
function serviceStrain(o){
  const a=o.analytics.slice(-5);if(!a.length)return{kit:0,floor:0};
  const lost=a.reduce((x,y)=>x+y.lost,0)/a.length;
  return {kit:lost>6?1:0,floor:(o.seats&&staffOn(o,'server').length===0)?1:0};}
function managerHiring(o){
  let hired=0;
  const need=[];
  const kcap=kitchenCapMin(o);
  const a=o.analytics.slice(-5);
  const lost=a.length?a.reduce((x,y)=>x+y.lost,0)/a.length:0;
  if(lost>8&&(o.staff.chef.length+o.staff.linecook.length)<7)need.push(o.staff.chef.length<2?'chef':'linecook');

function launchCampaign(o,k,byGM){

  const avgSold=act.reduce((a,x)=>a+x.sold,0)/Math.max(1,act.length);
  const margins=act.map(x=>1-ingCostPlate(x.k,o)/Math.max(1,x.price)).sort((a,b)=>a-b);
  const medMar=margins.length?margins[Math.floor(margins.length/2)]:.6;
  const margin=1-ingCostPlate(m.k,o)/Math.max(1,m.price);
  const hiPop=m.sold>=avgSold,hiMar=margin>=medMar;
  return hiPop&&hiMar?['Star','green']:hiPop?['Plowhorse','gold']:hiMar?['Puzzle','blue']:['Dog','red'];
}

      return `<div class="shopitem"><div class="si-ic">${own?'✅':'🏗️'}</div><div class="si-b"><div class="si-t">${n}</div><div class="si-d">${d}</div></div>
      <div style="text-align:right"><div class="b">${cr(cost)}</div><button class="btn" style="margin-top:4px;padding:4px 12px;font-size:11px" ${own?'disabled':''} onclick="buyPerk('${k}',${cost})">${own?'owned':'build'}</button></div></div>`;}).join('')}
  </div>
  ${G.chain.franchises.length?`<div class="card" style="margin-top:12px"><h3>Franchise Book (${G.chain.franchises.length})</h3>
    ${G.chain.franchises.map(f=>row('Partner outlet — '+f.city,cr(f.roy)+'/mo royalty')).join('')}
    ${row('<b>Total royalties</b>','<b>'+cr(G.chain.franchises.reduce((a,f)=>a+f.roy,0))+'/mo</b>')}</div>`:''}`;
}
window.buyPerk=(k,cost)=>{
  if(G.cash<cost){toast('Not enough cash.','warn');return;}
  G.cash-=cost;G.chain.perks[k]=true;
  G.outlets.forEach(o=>{o.perks[k==='central'?'central':k==='warehouse'?'warehouse':k==='training'?'training':'hqops']=true;});
  logEv(R(),'expand','Group infrastructure built: '+HQ_PERKS.find(p=>p[0]===k)[1]+'.');
  toast('Built for the whole chain.','pos');renderTab();};
function tabSettings(o){
  return pageHead('Settings','Save, pace and the fine print.','')+
  `<div class="cards cols-2">
    <div class="card"><h3>Game</h3>
      ${row('Difficulty',DIFFS[G.diff].name)}
      ${row('Day',G.day+' · '+DOW[dow()])}
      ${row('Autosave','every 6 in-game hours + daily')}
      <div class="wrapf" style="margin-top:10px">
        <button class="btn" onclick="saveGame();toast('Saved.','pos')">Save now</button>
        <button class="btn" onclick="if(confirm('Wipe this save and start over?'))wipeGame()">New game (wipe save)</button>
      </div>
    </div>
    <div class="card"><h3>About</h3>
      <div class="sm" style="line-height:1.7">RASOI — a restaurant operations simulation.<br>
      Built on the AATITHYA framework: silhouette-minimal UI, hourly ticks, CCTV floors, delegation-first management.<br>
      Single file · offline · saves to this device.</div>
    </div>
  </div>`;
}
/* ============================ CCTV ============================ */
function camList(o){
  const L=[];
  if(o.seats>0)L.push(['dining','Dining Hall']);
  L.push(['kitchen','Kitchen Line']);
  if(stationsCovered(o).has('coffee')||o.menu.some(m=>m.active&&DISH_LIB[m.k].st==='coffee'))L.push(['coffee','Coffee Bar']);
  if(o.areas.includes('pickup')||CONCEPTS[o.concept].take>=.3||o.concept==='cloud')L.push(['pickup','Pickup Counter']);
  if(o.concept==='drive'||o.areas.includes('drivelane'))L.push(['drive','Drive-Thru Lane']);
  if(o.areas.includes('outdoor'))L.push(['outdoor','Terrace']);
  if(o.seats>0)L.push(['waiting','Waiting Area']);
  L.push(['storage','Store Room']);
  return L;}
function sil(x,y,s,drift){return `<g transform="translate(${x},${y}) scale(${s||1})" ${drift?`class="camWalk" style="--dd:${(6+(x%5))}s"`:''}><circle cx="0" cy="-25" r="5.5" fill="#151513"/><path d="M-7,-19 Q0,-23 7,-19 L7,4 Q0,7 -7,4 Z" fill="#151513"/></g>`;}
function silSit(x,y,s){return `<g transform="translate(${x},${y}) scale(${s||1})"><circle cx="0" cy="-20" r="5" fill="#151513"/><path d="M-6,-15 Q0,-18 6,-15 L6,0 L-6,0 Z" fill="#151513"/></g>`;}
function camScene(o,cam){
  const rng=srng(hash32(o.id+cam+G.day+'h'+G.hour));
  const W=640,H=250;const el=[];const info=[];
  el.push(`<rect width="${W}" height="${H}" fill="#fdfdfb"/>`);
  el.push(`<line x1="0" y1="${H-34}" x2="${W}" y2="${H-34}" stroke="#151513" stroke-width="1.5"/>`);
  const open=isOpen(o,G.hour)&&!o._shut;
  if(cam==='dining'){
    const seated=o.tables.filter(t=>t.state==='seated');
    const dirty=o.tables.filter(t=>t.state==='dirty').length;
    const nT=Math.min(7,o.tables.length);
    for(let i=0;i<nT;i++){
      const x=60+i*86,y=H-44;
      el.push(`<rect x="${x-24}" y="${y-16}" width="48" height="14" fill="none" stroke="#151513" stroke-width="1.8"/>`);
      el.push(`<line x1="${x-18}" y1="${y-2}" x2="${x-18}" y2="${y+12}" stroke="#151513" stroke-width="1.8"/><line x1="${x+18}" y1="${y-2}" x2="${x+18}" y2="${y+12}" stroke="#151513" stroke-width="1.8"/>`);
      if(i<seated.length){const n=Math.min(3,1+Math.floor(rng()*3));
        for(let j=0;j<n;j++)el.push(silSit(x-14+j*15,y-16,.9));}
      else if(i<seated.length+dirty)el.push(`<g transform="translate(${x},${H-64})"><circle r="3" cx="-6" fill="none" stroke="#151513"/><circle r="3" cx="4" cy="2" fill="none" stroke="#151513"/></g>`);
    }
    const srv=staffOn(o,'server').length;
    for(let i=0;i<Math.min(3,srv);i++)el.push(sil(120+i*180+rng()*40,H-40,1,true));
    info.push(['Seated',seated.length+'/'+o.tables.length],['Dirty',dirty],['Servers',srv],['Clean',Math.round(o.clean)]);
  }
  if(cam==='kitchen'){
    el.push(`<rect x="30" y="${H-84}" width="${W-60}" height="16" fill="#151513"/>`);
    for(let i=0;i<4;i++)el.push(`<rect x="${70+i*130}" y="${H-118}" width="52" height="30" fill="none" stroke="#151513" stroke-width="1.8"/>`);
    const cooks=kitchenOn(o);
    cooks.slice(0,5).forEach((s,i)=>{el.push(sil(90+i*118,H-88,1.05));
      el.push(`<rect x="${82+i*118}" y="${H-136}" width="16" height="7" fill="#151513"/>`);}); // toque
    for(let i=0;i<Math.min(8,o.kq.length);i++)el.push(`<rect x="${40+i*22}" y="34" width="14" height="20" fill="none" stroke="#151513" stroke-width="1.4"/>`);
    if(o.kq.length)el.push(`<text x="40" y="26" font-size="10" fill="#5c5c55" font-family="monospace">ORDER RAIL — ${o.kq.length} TICKETS</text>`);
    info.push(['Brigade',cooks.length],['Queue',o.kq.length+' orders'],['Backlog',Math.round(o._queueMin||0)+' min'],['Equipment',Math.round(o.equip)+'%'],['Hygiene',Math.round(o.hygiene)]);
  }
  if(cam==='coffee'){
    el.push(`<rect x="60" y="${H-92}" width="300" height="20" fill="#151513"/>`);
    el.push(`<rect x="90" y="${H-124}" width="44" height="30" fill="none" stroke="#151513" stroke-width="2"/><rect x="98" y="${H-116}" width="10" height="12" fill="#151513"/>`);
    const b=staffOn(o,'barista').length;
    if(b)el.push(sil(190,H-96,1.05));
    const q=Math.min(4,Math.round((o.kq.filter(x=>x.items.some(i=>DISH_LIB[i.k].st==='coffee')).length)||rng()*2*(open?1:0)));
    for(let i=0;i<q;i++)el.push(sil(420+i*44,H-40,1,i===0));
    info.push(['Barista',b?'on bar':'—'],['Waiting',q],['Beans',invQty(o,'coffee').toFixed(1)+' kg']);
  }
  if(cam==='pickup'){
    el.push(`<rect x="60" y="${H-88}" width="220" height="16" fill="#151513"/>`);
    el.push(`<rect x="300" y="${H-140}" width="120" height="66" fill="none" stroke="#151513" stroke-width="1.6"/>`);
    for(let i=0;i<3;i++)for(let j=0;j<2;j++)if(rng()<.6)el.push(`<rect x="${308+i*38}" y="${H-132+j*30}" width="26" height="20" fill="#151513" opacity=".85"/>`);
    const riders=Math.min(4,(o.chToday.swiggy||0)+(o.chToday.zomato||0)>6?3:Math.round(rng()*2*(open?1:0)));
    for(let i=0;i<riders;i++){el.push(sil(470+i*46,H-40,1));el.push(`<rect x="${460+i*46}" y="${H-64}" width="22" height="14" fill="none" stroke="#151513" stroke-width="1.6"/>`);}
    info.push(['Parcels out',(o.chToday.swiggy||0)+(o.chToday.zomato||0)+(o.chToday.direct||0)+(o.chToday.phone||0)],['Riders',riders],['Packaging',Math.round(invQty(o,'pack'))+' pc']);
  }
  if(cam==='drive'){
    el.push(`<rect x="40" y="${H-96}" width="130" height="30" fill="none" stroke="#151513" stroke-width="2"/><rect x="70" y="${H-66}" width="40" height="32" fill="#151513"/>`);
    const cars=Math.min(5,open?Math.round((o.chToday.walkin||0)/8+rng()*3):0);
    for(let i=0;i<cars;i++){const x=250+i*80;
      el.push(`<g transform="translate(${x},${H-52})"><rect x="-30" y="-16" width="60" height="16" rx="4" fill="#151513"/><rect x="-18" y="-26" width="34" height="12" rx="3" fill="#151513"/><circle cx="-18" cy="2" r="6" fill="#151513"/><circle cx="18" cy="2" r="6" fill="#151513"/></g>`);}
    info.push(['Cars in lane',cars],['Window',open?'serving':'closed']);
  }
  if(cam==='outdoor'){
    for(let i=0;i<4;i++){const x=90+i*140;
      el.push(`<line x1="${x}" y1="${H-120}" x2="${x}" y2="${H-40}" stroke="#151513" stroke-width="2"/><path d="M${x-46},${H-118} Q${x},${H-150} ${x+46},${H-118} Z" fill="#151513"/>`);
      el.push(`<rect x="${x-20}" y="${H-56}" width="40" height="12" fill="none" stroke="#151513" stroke-width="1.6"/>`);
      if(open&&rng()<.55){el.push(silSit(x-12,H-56,.85));el.push(silSit(x+12,H-56,.85));}}
    info.push(['Terrace','built'],['Weather',pick(['clear','breezy','warm'])]);
  }
  if(cam==='waiting'){
    el.push(`<rect x="80" y="${H-70}" width="200" height="8" fill="#151513"/><line x1="90" y1="${H-62}" x2="90" y2="${H-38}" stroke="#151513" stroke-width="2"/><line x1="270" y1="${H-62}" x2="270" y2="${H-38}" stroke="#151513" stroke-width="2"/>`);
    o.waiting.slice(0,5).forEach((w,i)=>el.push(silSit(110+i*38,H-70,.95)));
    const host=staffOn(o,'cashier').length;
    if(host)el.push(sil(420,H-40,1.05));
    el.push(`<rect x="400" y="${H-76}" width="60" height="14" fill="#151513"/>`);
    info.push(['Waiting',o.waiting.length+' parties'],['Lost today',o.waitLost],['Host desk',host?'staffed':'empty']);
  }
  if(cam==='storage'){
    for(let r=0;r<3;r++)el.push(`<line x1="60" y1="${70+r*52}" x2="380" y2="${70+r*52}" stroke="#151513" stroke-width="2.5"/>`);
    const fill=clamp(ING_ORDER.reduce((a,k)=>a+invQty(o,k),0)/(o.caps.dry+o.caps.cold),0,1);
    for(let r=0;r<3;r++)for(let i=0;i<8;i++)if(rng()<fill*1.1)el.push(`<rect x="${66+i*40}" y="${46+r*52}" width="30" height="22" fill="#151513" opacity=".88"/>`);
    el.push(`<rect x="440" y="60" width="130" height="${H-94-60}" fill="none" stroke="#151513" stroke-width="2.5"/><line x1="505" y1="60" x2="505" y2="${H-34}" stroke="#151513" stroke-width="2"/><circle cx="495" cy="130" r="3" fill="#151513"/>`);
    el.push(`<text x="446" y="52" font-size="10" fill="#5c5c55" font-family="monospace">COLD ROOM${o.areas.includes('coldstore')?' ×2':''}</text>`);
    info.push(['Stock fill',Math.round(fill*100)+'%'],['Waste today',cr(o.wasteToday)],['Inbound',o.pending.length+' orders']);
  }
  if(!open)el.push(`<g transform="translate(${W/2},${H/2}) rotate(-8)"><rect x="-90" y="-20" width="180" height="40" fill="none" stroke="#7a2430" stroke-width="2.5"/><text x="0" y="7" text-anchor="middle" font-size="20" fill="#7a2430" font-family="monospace" letter-spacing="4">${o._shut?'SHUT':'CLOSED'}</text></g>`);
  el.push(`<text x="${W-10}" y="${H-8}" text-anchor="end" font-size="9" fill="#8e8e85" font-family="monospace">CAM·${cam.toUpperCase()} D${G.day} ${String(G.hour).padStart(2,'0')}:00 · 1 FRAME/HR</text>`);
  return {svg:`<svg viewBox="0 0 ${W} ${H}">${el.join('')}</svg>`,info};
}
function tabCameras(o){
  const L=camList(o);
  if(!G.camSel||!L.some(c=>c[0]===G.camSel))G.camSel=L[0][0];
  const main=camScene(o,G.camSel);
  const others=L.filter(c=>c[0]!==G.camSel).slice(0,3);
  return pageHead('CCTV','One frame per in-game hour — the whole day plays back like a timelapse. Every figure on screen is real state.',
    `<span class="camlive"><i></i>REC</span>`)+
  `<div class="camsel"><select onchange="G.camSel=this.value;renderTab()">${L.map(c=>`<option value="${c[0]}" ${G.camSel===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div>
  <div class="camlayout">
    <div class="camfeed cambig">
      <div class="camhead"><span class="camtitle">${L.find(c=>c[0]===G.camSel)[1].toUpperCase()}</span><span class="camlive"><i></i>LIVE</span><span class="camtime">D${G.day} · ${String(G.hour).padStart(2,'0')}:00</span></div>
      <div class="camview">${main.svg}</div>
      <div class="caminfo">${main.info.map(x=>`<span>${x[0]}: <b>${x[1]}</b></span>`).join('')}</div>
    </div>
    <div class="camright">
      ${others.map(c=>{const s=camScene(o,c[0]);
        return `<div class="camfeed" style="cursor:pointer" onclick="G.camSel='${c[0]}';renderTab()">
        <div class="camhead"><span class="camtitle">${c[1].toUpperCase()}</span><span class="camtime">${String(G.hour).padStart(2,'0')}:00</span></div>
        <div class="camview">${s.svg}</div></div>`;}).join('')}
    </div>
  </div>`;
}

/* ============================ CLOCK & BOOT ============================ */
let _acc=0,_last=Date.now();
const HOUR_MS=1900;
setInterval(()=>{
  const now=Date.now();
  if(!G||G.paused||$('#app').style.display!=='grid'){_last=now;return;}
  _acc+=(now-_last)*G.speed;_last=now;
  let n=0;
  while(_acc>=HOUR_MS&&n<6){_acc-=HOUR_MS;tickHour();n++;}
  if(_acc>HOUR_MS*6)_acc=0;
},220);
function setPause(v){if(!G)return;G.paused=v;$('#spP').classList.toggle('on',v);}
$('#spP').onclick=()=>setPause(!G.paused);
$$('.sp[data-sp]').forEach(b=>b.onclick=()=>{
  if(!G)return;G.speed=+b.dataset.sp;setPause(false);
  $$('.sp[data-sp]').forEach(x=>x.classList.toggle('on',x===b));});
document.addEventListener('keydown',e=>{
  if(!G||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key===' '){e.preventDefault();setPause(!G.paused);}
});
(function boot(){
  try{
    if(localStorage.getItem(SAVEKEY)){
      $('#contBtn').innerHTML='<button onclick="landContinue()" style="margin-left:10px;padding:12px 24px;border:1px solid #3a3a30;border-radius:3px;background:transparent;color:#cfccba;font-weight:700;font-size:13px;letter-spacing:.08em;cursor:pointer">CONTINUE SERVICE</button>';
    }
  }catch(e){}
})();
</script>
